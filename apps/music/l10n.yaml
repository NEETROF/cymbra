# Configuration for the Flutter gen_l10n toolchain (paired with
# `flutter: generate: true` in pubspec.yaml). ARB sources live under lib/l10n/;
# the generated `AppLocalizations` is written to lib/l10n/gen/ (gitignored and
# regenerated by `flutter gen-l10n` / `flutter pub get`, like the gRPC/frb
# generated sources). `app_en.arb` is the single template all others mirror.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Emit real files into the source tree under `output-dir` (the synthetic package
# is removed in recent Flutter, so generation is always non-synthetic).
# `nullable-getter: false` makes `AppLocalizations.of(context)` non-null so call
# sites stay terse.
nullable-getter: false
