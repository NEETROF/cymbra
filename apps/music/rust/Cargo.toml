[package]
name = "rust_lib_music"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# Never published to crates.io (local FFI crate) — also lets `cargo about`
# (change: add-oss-license-attributions) auto-exclude it as first-party via
# its `private.ignore` filter, see apps/music/rust/about.toml.
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
# Shared, FFI-free notation engine: data model + streaming parser + geometry
# + .mxl decode + validate(). The app's musicxml.rs re-exports its model and
# delegates the frb wrappers here (single source of truth across app/backend/crawler).
cymbra-musicxml-core = { path = "../../../crates/musicxml-core" }
cymbra-sf2-meta = { path = "../../../crates/sf2-meta" }
# Raw USB-MIDI port listening: CoreMIDI (macOS/iOS), ALSA (Linux),
# WinMM (Windows), AMidi via NDK (Android). 0.11 adds the Android backend.
midir = "0.11"

# Audio output (api/audio.rs): a pure-Rust SoundFont synthesizer rendered to the
# system's default device via cpal. cpal covers CoreAudio (macOS/iOS), WASAPI
# (Windows), ALSA (Linux) and AAudio (Android) — its Android backend uses the
# NDK/`ndk-context` we already initialize in JNI_OnLoad (see lib.rs), so no extra
# `oboe`/target gate is needed here.
rustysynth = "1.3"
cpal = "0.18"

# Android context init: midir's AMidi backend needs the JavaVM, which we
# provide via ndk_context (initialized in JNI_OnLoad, see lib.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
