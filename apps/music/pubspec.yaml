name: music
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.15.0+22

environment:
  sdk: ^3.10.9

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Localization delegates + supported locales for the four UI languages
  # (en/fr/it/es). Paired with `flutter: generate: true` and `l10n.yaml`, which
  # generate `AppLocalizations` from the ARB files under `lib/l10n/`.
  flutter_localizations:
    sdk: flutter
  # Required by the gen_l10n toolchain (placeholders/plurals). Version is pinned
  # by the Flutter SDK, so defer to it with `any`.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  rust_lib_music:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0

  # Cymbra ID account layer (change: add-music-account-access).
  # Native gRPC client over the backend's auth.proto / user.proto, secure token
  # storage, and the native Google/Apple sign-in SDKs. All sit behind injectable
  # Riverpod seams so state/widgets stay testable without the backend or SDKs.
  grpc: ^4.0.4
  protobuf: ^4.2.0
  fixnum: ^1.1.1
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.2
  http: ^1.6.0
  crypto: ^3.0.7

  # Native file picker for the score-contribution flow (.musicxml/.xml/.mxl),
  # behind the injectable `filePickerProvider` seam so the wizard is testable
  # without the native picker (change: add-user-score-upload).
  file_picker: ^8.1.2

  # Local, on-device key-value store for small user preferences (starting with
  # the selected UI language). Kept separate from flutter_secure_storage, which
  # is reserved for auth tokens. Behind the injectable `preferencesServiceProvider`
  # seam so state/widgets are testable with an in-memory fake.
  shared_preferences: ^2.3.2

  # Client-generated UUID v7 session ids for the play-activity outbox (change:
  # add-play-activity-profile): each captured session gets a stable id BEFORE any
  # network attempt, so the server dedupes retried deliveries (idempotency key).
  uuid: ^4.5.3

  # Network reachability for the play-outbox sender's "resume on regained
  # connectivity" trigger. Behind the injectable `connectivityServiceProvider`
  # seam so the sender is testable without the native plugin.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Dart code generator for the gRPC stubs (run via `melos run gen-grpc`); the
  # `protoc` binary itself comes from the toolchain (brew/apt) in CI.
  protoc_plugin: ^22.5.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.0
  # Default test-double: mockito with generated mocks (@GenerateNiceMocks +
  # build_runner). See the `flutter-testing` skill.
  mockito: ^5.4.4

  # Store branding generators. These are build-time tools only (run manually,
  # not at app runtime): they regenerate the native launcher icons and splash
  # from the source art under `assets/branding/`. Re-run after changing the art:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Launcher icons generated from the Cymbra source art. The full-bleed square
# (`icon.png`, no alpha) feeds iOS and legacy Android; the transparent mark
# (`icon_foreground.png`) plus the navy background make the Android 8+ adaptive
# icon. Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0F1633"
  android: "ic_launcher"
  min_sdk_android: 29
  adaptive_icon_background: "#0F1633"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Branded launch screen: the Cymbra mark centered on the navy brand color,
# replacing the default blank screen on both platforms (incl. the Android 12+
# splash API). Regenerate with `dart run flutter_native_splash:create`.
#
# POST-REGEN PATCH 1 (Android anti-flicker): after running :create, re-apply the
# navy `windowBackground` in android/app/src/main/res/values*/styles.xml — set
# NormalTheme's windowBackground to `@color/splash_background` (#0F1633) in every
# variant, and add the same windowBackground to the v31 LaunchTheme. Without it,
# the light NormalTheme flashes white between the Android 12 system splash and
# Flutter's first frame. (Android 12+ only shows a masked icon + color, not the
# full logo layout — that's a platform limitation of the SplashScreen API.)
#
# POST-REGEN PATCH 2 (Android 12 icon): flutter_native_splash 2.4.3 writes the
# `drawable-*/android12splash.png` icon ONLY at xxxhdpi and leaves mdpi/hdpi/xhdpi/
# xxhdpi (and all -night) fully transparent, so the splash logo is invisible on
# every device that isn't xxxhdpi. Re-populate all densities from
# assets/branding/splash_logo.png (mark ~68% of the square canvas: mdpi 174/256,
# hdpi 261/384, xhdpi 348/512, xxhdpi 522/768, xxxhdpi 696/1024; night = same).
flutter_native_splash:
  color: "#0F1633"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#0F1633"
    image: "assets/branding/icon_foreground.png"
  android: true
  ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate `AppLocalizations` from the ARB files (see `l10n.yaml`). The
  # generated Dart lands under `lib/l10n/gen/` (gitignored, produced by
  # `flutter gen-l10n` / `flutter pub get`, like the other generated sources).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled public-domain MusicXML scores, grouped by practice level. See
  # assets/scores/CREDITS.md for sources/licences. The directory entries pick up
  # every file beneath them, so new scores need no further pubspec change.
  assets:
    - assets/scores/beginner/
    - assets/scores/intermediate/
    - assets/scores/advanced/
    # Bundled CC0 piano SoundFont rendered by the Rust audio synth. Only the
    # .sf2 is shipped; the licence/readme/credits live beside it in the repo
    # (see assets/soundfonts/CREDITS.md) but are not bundled into the app.
    - assets/soundfonts/UprightPianoKW-20220221.sf2

  # Bravura — the reference SMuFL music font (Steinberg, SIL OFL 1.1). Used by
  # the notation painters to draw real engraving glyphs (note heads, clefs,
  # flags, accidentals, rests, dynamics). See assets/fonts/OFL.txt.
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
