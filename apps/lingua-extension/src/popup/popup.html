<!doctype html>
<!-- No text of its own: every node carries a data-copy key, filled by popup.ts from the catalogue's
     module for the interface language (src/i18n/README.md, Pages); data-copy-pending hides the body
     until then, and lang is set by the script. -->
<html data-copy-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title data-copy="title"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="topbar">
      <h1 data-copy="title"></h1>
      <button id="settings-open" class="icon-btn" data-copy-aria-label="settings" data-copy-title="settings">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          ></path>
        </svg>
      </button>
    </div>

    <div id="main-view">
      <div id="session-lost" class="session-lost" data-copy="sessionLost" hidden></div>
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="enabled" checked />
          <span class="slider"></span>
        </label>
        <span id="enabled-label" data-copy="highlightingOn"></span>
      </div>

      <div id="disabled-note" class="note" data-copy="highlightingOffNote" hidden></div>

      <div id="setup" hidden>
        <div class="note" data-copy="notAnalysed"></div>
        <button class="primary" id="analyse" data-copy="analyse"></button>
        <button class="reset" id="always" data-copy="alwaysHighlight"></button>
      </div>

      <div id="controls" hidden>
        <div id="analysed">
          <div class="pct"><span id="pct" data-copy="noPercent"></span></div>
          <div class="pct-label" id="pct-label" data-copy="knownOnPage"></div>
          <div class="bar"><span id="bar" style="width: 0%"></span></div>

          <div class="row"><span data-copy="wordsAnalysed"></span><b id="counted">0</b></div>
          <div class="row"><span data-copy="wordsUnknown"></span><b id="unknown">0</b></div>
          <div class="row sub"><span data-copy="distinctUnknown"></span><b id="distinct">0</b></div>
        </div>

        <div id="note" class="note" hidden></div>

        <div class="row"><span data-copy="wordsTracked"></span><b id="tracked">0</b></div>

        <button id="level-cta" class="primary" data-copy="chooseLevel" hidden></button>
        <div id="level-indicator" class="level-indicator" hidden>
          <!-- « Niveau de … : B1 »: popup.levelLine, rendered by the script around the level. -->
          <span id="level-line"><b id="level-current">—</b></span>
          <button id="level-edit" class="linklike" data-copy="edit"></button>
        </div>

        <div class="deck"><span data-copy="deck"></span><b id="deck">0</b></div>
        <!-- « Réviser (3) »: popup.review, rendered by the script with the due count. -->
        <button class="primary" id="review"></button>
      </div>

      <!-- Signing in lives in Réglages › Données (mountSettings), the same in every surface: this links there. -->
      <div id="account" class="account">
        <button class="primary" id="account-signin" type="button" data-copy="signInToSync" hidden></button>
        <div id="account-in" hidden>
          <div class="row"><span data-copy="signedIn"></span><b id="account-who"></b></div>
          <button class="linklike" id="account-manage" type="button" data-copy="accountAndSync"></button>
        </div>
      </div>

      <button class="reset" id="open-library" data-copy="library"></button>
      <button class="reset" id="open-stats" data-copy="statistics"></button>
    </div>

    <div id="settings-view" hidden>
      <div class="settings-head">
        <button id="settings-back" class="icon-btn" data-copy-aria-label="back" data-copy-title="back">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>
        <span class="settings-title" data-copy="settings"></span>
      </div>

      <!-- Built by mountSettings — the same Réglages as the side panel and the in-page drawer. -->
      <div id="settings-body" class="settings-body"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
