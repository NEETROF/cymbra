<!doctype html>
<!-- The Cymbra Lingua app's review (add-lingua-apple-review), served by the app from its bundle under
     lingua-app:// (ViewController.swift). No text of its own: every node carries a data-copy key,
     filled by app.ts from the catalogue's `app` module; data-copy-pending hides the body until then. -->
<html data-copy-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title data-copy="title"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="review.css" />
    <link rel="stylesheet" href="stats.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 data-copy="heading"></h1>
        <p class="saved" id="saved" hidden></p>
      </header>

      <!-- Shown while the engine loads the deck; the views take its place once it is ready. -->
      <p class="loading" id="loading" role="status" data-copy="loading"></p>

      <div class="views" id="views" hidden>
        <button data-view="review" class="active" data-copy="review"></button>
        <button data-view="stats" data-copy="stats"></button>
      </div>

      <!-- The extension's own Révision (mountReview): its language filter and due count included. -->
      <section id="view-review" hidden>
        <div id="review-root"></div>
      </section>
      <section id="view-stats" hidden></section>

      <!-- « Traduction étendue » in the app: the offer to download its own models, made once. -->
      <p class="app-models" id="model-offer" role="status" hidden></p>
      <!-- « Traduction en ligne » in the app: its own session, or why it needs one. -->
      <p class="app-account" id="account-line" hidden></p>
    </main>
    <!-- The email sign-in (add-lingua-app-email-signin D2): the extension's own account flow, in its app
         scope, over the review — opened when the app's sheet answers « Continuer avec un email ». -->
    <dialog class="app-email" id="email-panel">
      <div id="email-root"></div>
      <button type="button" class="app-link app-email-cancel" id="email-cancel" data-copy="emailCancel"></button>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
