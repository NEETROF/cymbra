<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Cymbra Lingua — révision</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="review.css" />
    <link rel="stylesheet" href="stats.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <h1>Cymbra Lingua</h1>

    <div class="views" id="views">
      <button data-view="review" class="active">Révision</button>
      <button data-view="stats">Statistiques</button>
      <button data-view="settings">Réglages</button>
    </div>

    <!-- Views are built by their shared mounts (mountReview / mountStats / mountSettings). -->
    <div id="view-review"></div>
    <div id="view-stats" hidden></div>

    <!-- Réglages are built by mountSettings (shared with the in-page drawer). -->
    <div id="view-settings" hidden></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
