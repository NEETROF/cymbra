<!doctype html>
<!-- No text of its own: the title carries a data-copy key, filled by reader.ts from the catalogue's
     module for the interface language (src/i18n/README.md, Pages); data-copy-pending hides the body
     until then, and lang is set by the script. -->
<html data-copy-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title data-copy="pageTitle"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body class="reader-page">
    <main id="reader-root"></main>
    <script type="module" src="reader.js"></script>
  </body>
</html>
