<!doctype html>
<!-- No text of its own: every node carries a data-copy key, filled by onboarding.ts from the
     catalogue's module for the interface language (src/i18n/README.md, Pages); data-copy-pending
     hides the body until then, and lang is set by the script. -->
<html data-copy-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title data-copy="pageTitle"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body class="onboarding">
    <main>
      <h1 data-copy="heading"></h1>
      <p class="lead" data-copy="lead"></p>

      <section id="languages-section" hidden>
        <h2 data-copy="whichLanguages"></h2>
      </section>

      <section id="level-section" hidden>
        <p class="muted" data-copy="levelNote"></p>
        <div id="level-rows"></div>
      </section>

      <section class="start">
        <h2 data-copy="toStart"></h2>
        <ol>
          <li data-copy="stepPin"></li>
          <li data-copy="stepOpen"></li>
          <li data-copy="stepClick"></li>
        </ol>
      </section>

      <section id="account-section" hidden>
        <h2 data-copy="accountTitle"></h2>
        <p class="muted" data-copy="accountLead"></p>
        <div class="chips">
          <button class="lvl" id="account-create" type="button" data-copy="createAccount"></button>
          <button class="lvl" id="account-later" type="button" data-copy="later"></button>
        </div>
      </section>
    </main>
    <script type="module" src="onboarding.js"></script>
  </body>
</html>
