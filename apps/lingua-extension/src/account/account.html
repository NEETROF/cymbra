<!doctype html>
<!-- No text of its own: every node carries a data-copy key, filled by account.ts from the catalogue's
     module for the interface language (src/i18n/README.md, Pages); data-copy-pending hides the body
     until then, and lang is set by the script. -->
<html data-copy-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title data-copy="pageTitle"></title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body class="account-page">
    <main>
      <h1 data-copy="heading"></h1>
      <div id="account-root"></div>
      <p class="account-footnote" data-copy="pageFootnote"></p>
    </main>
    <script type="module" src="account.js"></script>
  </body>
</html>
