# Cymbra object-storage port (change: add-user-score-upload). A tiny
# put/get/delete-by-key surface over an S3-compatible origin with a local-disk
# warm cache (local-first reads, S3 fallback). object_store gives the rustls /
# no-OpenSSL backends (S3, local FS, in-memory) matching the workspace stack.
[package]
name = "cymbra-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra object-storage port: put/get/delete by key over S3 with a local-first read cache (S3 fallback). Fake + in-memory backends for tests."

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bytes = "1"
# `list` returns a stream; StreamExt drives it (same crate the flags module uses).
futures-util = "0.3"
object_store = { version = "0.11", features = ["aws"] }

[dev-dependencies]
tokio = { workspace = true }
