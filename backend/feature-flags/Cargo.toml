[package]
name = "cymbra-feature-flags"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra shared, app-agnostic runtime feature-flag & config store — a code registry of declared keys with typed defaults, a DB source of truth (schema `feature_flags`), an OpenFeature-shaped in-house evaluation API with an L1 in-process snapshot + Redis pub/sub invalidation, backend enforcement, per-app scoping, rollout scope, and an audited admin surface. Reused by every app (music, live, future) via gRPC FlagService."

[dependencies]
async-trait.workspace = true
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
# gRPC FlagService (client read + admin edits), like cymbra-music's ScoreService.
tonic.workspace = true
prost.workspace = true
# Redis pub/sub invalidation bus (L2) — Redis is already a hard dependency for
# rate-limit counters, so this adds no new infra (design D2).
redis.workspace = true
# Poll the Redis pub/sub message stream in the invalidation listener.
futures-util = "0.3"
cymbra-platform = { path = "../platform" }
# Mock the FlagStore / InvalidationBus / AdminScopeResolver seams in unit tests
# (rust-testing default). Gated so mocks never ship in release.
mockall = { workspace = true, optional = true }

[build-dependencies]
tonic-build.workspace = true

[features]
mock = ["dep:mockall"]

[dev-dependencies]
tokio = { workspace = true }
mockall = { workspace = true }
serde_json.workspace = true
