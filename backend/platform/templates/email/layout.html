<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{{ brand }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0B1326; color:#DAE2FD; -webkit-text-size-adjust:100%;">
    <!-- Preheader: hidden preview text -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#0B1326;">{{ preheader }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0B1326;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#131B2E; border-radius:18px; border:1px solid #212A40;">
            <!-- Header / brand -->
            <tr>
              <td align="center" style="padding:32px 40px 8px 40px;">
                {% if !logo_url.is_empty() %}<img src="{{ logo_url }}" width="48" height="48" alt="{{ brand }}" style="display:block; border:0; outline:none; margin:0 auto 12px auto;" />{% endif %}
                <div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:22px; font-weight:700; letter-spacing:0.5px; color:#D2BBFF;">{{ brand }}</div>
              </td>
            </tr>
            <!-- Content -->
            <tr>
              <td style="padding:16px 40px 8px 40px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <h1 style="margin:0 0 16px 0; font-size:20px; line-height:1.3; font-weight:700; color:#DAE2FD;">{{ heading }}</h1>
                <p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#CCC3D8;">{{ intro }}</p>
              </td>
            </tr>
            <!-- Code box -->
            <tr>
              <td style="padding:0 40px;">
                <div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:#9AA1BA; margin-bottom:8px;">{{ code_note }}</div>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="background-color:#0B1326; border:1px solid #7C3AED; border-radius:12px; padding:20px 16px;">
                      <span style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size:26px; font-weight:700; letter-spacing:4px; color:#FFFFFF; word-break:break-all;">{{ code }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Optional CTA slot -->
            {% if !cta_url.is_empty() %}
            <tr>
              <td align="center" style="padding:24px 40px 0 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="background-color:#7C3AED; border-radius:10px;">
                      <a href="{{ cta_url }}" style="display:inline-block; padding:12px 28px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#F3ECFF; text-decoration:none;">{{ cta_label }}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {% endif %}
            <!-- Outro -->
            <tr>
              <td style="padding:24px 40px 8px 40px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0; font-size:13px; line-height:1.6; color:#9AA1BA;">{{ outro }}</p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td style="padding:24px 40px 32px 40px; border-top:1px solid #212A40; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0 0 8px 0; font-size:12px; line-height:1.6; color:#6A7091;">
                  <a href="{{ terms_url }}" style="color:#9AA1BA; text-decoration:underline;">{{ terms_label }}</a>
                  &nbsp;·&nbsp;
                  <a href="{{ privacy_url }}" style="color:#9AA1BA; text-decoration:underline;">{{ privacy_label }}</a>
                </p>
                <p style="margin:0; font-size:12px; line-height:1.6; color:#6A7091;">{{ footer_note }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
