syntax = "proto3";

package cymbra.lingua.v1;

// Syncs whole deck cards across a user's devices, identified by a stable client id
// within a studied language, last-write-wins per card (deletions included). The caller's identity comes from the
// access token, never the body.
//
// PRIVACY ALLOW-LIST: a card carries only the user's own data — the form and the sentence
// they captured. The page it was captured from stays on the device
// (add-lingua-privacy-controls): `source` is deprecated, sent empty and never stored. The
// `media` contents are NEVER
// transported in this change (the schema slot stays local on the originating device);
// there is no bytes field here.
service DeckService {
  rpc PushCards(PushCardsRequest) returns (PushCardsResponse);
  rpc PullCards(PullCardsRequest) returns (PullCardsResponse);
}

// A whole card as one device holds it (or a tombstone when `deleted`).
message CardOp {
  string client_id = 1; // stable card UUID (the LWW key)
  string lemma = 2;
  string surface_form = 3;
  string source_sentence = 4; // the sentence the user captured with the card
  // Deprecated (add-lingua-privacy-controls): the page a card was captured from stays on
  // the device. Clients send it empty; the server ignores any value and returns it empty.
  // Kept (not reserved) so installed clients that still set it keep working.
  string source = 5 [deprecated = true];
  string gloss = 6;
  string fsrs_state = 7; // opaque JSON of the FSRS review state
  bool deleted = 8; // tombstone propagated by LWW
  int64 client_ts = 9; // client op time (epoch millis); clamped on receipt
  string device_id = 10; // stable per-device id (LWW tie-break)
  // The card's studied language (add-lingua-card-language). Empty means "en": clients
  // that predate the field never set it and keep being understood. Normalised on
  // receipt (trimmed, lowercased, primary subtag).
  string language = 11;
  // The language of the card's gloss (add-lingua-native-language-server). Empty means
  // "fr": every pack ever shipped is glossed in French, and clients that predate the
  // field never set it. Normalised on receipt like `language`; returned as stored. Not
  // part of the key: two devices of one account write one card row, and the label
  // travels with the gloss that wins.
  string gloss_language = 12;
}

message PushCardsRequest {
  repeated CardOp cards = 1;
}

message PushCardsResponse {
  uint64 applied = 1;
  int64 cursor = 2;
}

message PullCardsRequest {
  int64 cursor = 1; // 0 = from the start
  // The languages this client accepts cards in (add-lingua-card-language). Empty means
  // English only, so a client that predates card languages never receives a card it
  // would mis-file. Cards in other languages are withheld, not consumed: the cursor
  // returned is the highest sequence among the cards returned.
  repeated string languages = 2;
  // Whether this client reads a card's gloss language and accepts every one
  // (add-lingua-native-language-server). Unset means French-glossed cards only, so a
  // client that predates labels never holds a gloss it would push back unlabelled. Cards
  // glossed in other languages are withheld, not consumed: the cursor returned is the
  // highest sequence among the cards returned.
  bool any_gloss_language = 3;
}

message PullCardsResponse {
  repeated CardOp cards = 1; // includes tombstones (deleted=true)
  int64 cursor = 2;
}
