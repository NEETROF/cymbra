syntax = "proto3";

package cymbra.lingua.v1;

// The back office's Lingua OPS console (change: add-lingua-back-office). Every RPC is
// gated by `admin` in the `lingua` scope (`require_admin_in_scope`), behind the strict
// auth interceptor with the `back-office` audience.
//
// PRIVACY ALLOW-LIST — the scope of this service, not a temporary restriction: it
// serves AGGREGATES ONLY. No response message below carries an account identifier
// (user id, handle, email) or per-account content (a word a person encountered, their
// decks, their individual stats). A per-account view would require changing this
// `.proto` — visible in review and at the `buf` gate. The finest grain is
// day × studied-language, computed from the existing sync data (no new telemetry).
service LinguaAdminService {
  // Aggregate tiles + a breakdown by studied language over a UTC-day window.
  rpc AdminGetLinguaUsage(AdminGetLinguaUsageRequest) returns (AdminGetLinguaUsageResponse);
  // A per-day series for one metric over a window (optionally one studied language).
  rpc AdminGetLinguaUsageSeries(AdminGetLinguaUsageSeriesRequest) returns (AdminGetLinguaUsageSeriesResponse);
  // « Traduction en ligne » usage and its estimated cost over a UTC-day window, from the
  // daily totals the translation service keeps — no account, no text
  // (change: add-lingua-online-translation).
  rpc AdminGetOnlineTranslationUsage(AdminGetOnlineTranslationUsageRequest) returns (AdminGetOnlineTranslationUsageResponse);
  // The anonymous installation funnel (change: add-lingua-usage-counts): per installation
  // week, how many installations reached each step, from week counters that carry no
  // identifier. Versions are summed; the finest grain is week × browser family.
  rpc AdminGetUsageFunnel(AdminGetUsageFunnelRequest) returns (AdminGetUsageFunnelResponse);
  // The leaving page's answers, totalled per reason over the window (same counters' rules).
  rpc AdminGetLeaveReasons(AdminGetLeaveReasonsRequest) returns (AdminGetLeaveReasonsResponse);
}

// A closed UTC-day window, inclusive both ends (yyyy-mm-dd, the /usage convention).
message LinguaWindow {
  string from_day = 1;
  string to_day = 2;
}

message AdminGetLinguaUsageRequest {
  LinguaWindow window = 1;
}

// One studied language's aggregates within the window (counts only, no account data).
message LinguaLanguageUsage {
  string language = 1;         // studied-language code, e.g. "en"
  int64 active_accounts = 2;   // distinct accounts that synced stats in this language
  int64 words_learned = 3;
  int64 reviews = 4;
  int64 words_read = 5;        // words read in blocks seen (refine-lingua-reading-stats)
  int64 new_words_seen = 6;    // among them, words unknown or being learned
}

message AdminGetLinguaUsageResponse {
  int64 active_accounts = 1;   // distinct accounts that synced within the window
  int64 words_learned = 2;     // words learned in the window (summed synced daily stats)
  int64 reviews = 3;           // reviews done in the window (summed synced daily stats)
  repeated LinguaLanguageUsage by_language = 4;
  int64 words_read = 5;        // words read in blocks seen, summed over the window
  int64 new_words_seen = 6;    // among them, words unknown or being learned
}

// Which per-day metric a series returns. Chosen server-side from this enum, never a
// client-supplied column name.
enum LinguaSeriesMetric {
  LINGUA_SERIES_WORDS_LEARNED = 0;
  LINGUA_SERIES_REVIEWS = 1;
  LINGUA_SERIES_EXPOSURES = 2; // words read (the wire name predates the label)
  LINGUA_SERIES_UNKNOWN_SEEN = 3; // new words seen
}

message AdminGetLinguaUsageSeriesRequest {
  LinguaWindow window = 1;
  LinguaSeriesMetric metric = 2;
  string language = 3;         // empty => every studied language
}

// One point of a per-day series (no account data — a day and a count).
message LinguaSeriesPoint {
  string day = 1;              // yyyy-mm-dd
  int64 value = 2;
}

message AdminGetLinguaUsageSeriesResponse {
  repeated LinguaSeriesPoint points = 1;
}

message AdminGetOnlineTranslationUsageRequest {
  LinguaWindow window = 1;
}

// One day × provider × pair of online translation totals (no account, no text).
message OnlineTranslationUsageRow {
  string day = 1;              // yyyy-mm-dd
  string provider = 2;         // `gemini` | `anthropic`
  string pair = 3;             // `<source>-<target>`, e.g. `es-fr`
  int64 answered = 4;
  int64 failed = 5;
  int64 limited = 6;           // refused at the daily limit (no provider asked)
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  int64 cost_micro_usd = 9;    // estimated at request time from the configured prices
}

message AdminGetOnlineTranslationUsageResponse {
  repeated OnlineTranslationUsageRow rows = 1;
  int64 answered = 2;          // totals over the window
  int64 failed = 3;
  int64 limited = 4;
  int64 cost_micro_usd = 5;
}

message AdminGetUsageFunnelRequest {
  // The installation weeks whose days meet the window.
  LinguaWindow window = 1;
  string browser = 2;          // `chromium` | `firefox` | `safari`; empty => every family
}

// One installation week of the funnel: counts only, versions summed.
message UsageFunnelWeek {
  string week = 1;             // yyyy-mm-dd, the Monday that starts the installation week
  int64 installed = 2;
  int64 set_up = 3;
  int64 first_analysis = 4;
  int64 returned_day_1 = 5;
  int64 returned_days_7_to_13 = 6;
  int64 returned_days_30_to_59 = 7;
  bool capped = 8;             // one of this week's counters reached the ceiling
}

message AdminGetUsageFunnelResponse {
  repeated UsageFunnelWeek weeks = 1; // ascending by week
}

message AdminGetLeaveReasonsRequest {
  // The weeks the answers arrived in whose days meet the window.
  LinguaWindow window = 1;
  string browser = 2;          // `chromium` | `firefox` | `safari` | `unknown`; empty => every
}

// One leaving reason's total over the window.
message LeaveReasonTotal {
  // not_using | highlighting | missing_language | slow | unclear | other
  string reason = 1;
  int64 count = 2;
}

message AdminGetLeaveReasonsResponse {
  repeated LeaveReasonTotal reasons = 1; // the six reasons, in their fixed order
  bool capped = 2;             // one of the counters summed reached the ceiling
}
