[package]
name = "cymbra-lingua"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra Lingua backend module — owns the `lingua` schema (word statuses, cards, daily stats sync)."

[dependencies]
async-trait.workspace = true
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
uuid.workspace = true
anyhow.workspace = true
# Admin aggregates window on UTC days; chrono converts the yyyy-mm-dd window (the
# /usage convention) to/from the epoch-day integer key stored in `lingua.daily_stats`.
chrono.workspace = true
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
# The translation providers' HTTPS APIs (change: add-lingua-online-translation).
reqwest.workspace = true
cymbra-platform = { path = "../platform" }
cymbra-user-port = { path = "../user-port" }
# The usage counts' flood guard keys each network by an HMAC under a key drawn at start-up
# (change: add-lingua-usage-counts, D10).
hmac.workspace = true
sha2.workspace = true
getrandom = "0.2"
# `MockUsageCountsRepo` & co. via `#[automock]` under the `mock` feature, so the server can
# double the usage-count seams in its route tests (rust-testing default).
mockall = { workspace = true, optional = true }

[features]
mock = ["dep:mockall"]

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true }
cymbra-user-port = { path = "../user-port", features = ["mock"] }
mockall = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
