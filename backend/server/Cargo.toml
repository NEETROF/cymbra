[package]
name = "cymbra-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra ID composition root — wires platform + auth + user, serves gRPC and the JWKS/health HTTP surface."

[lib]
name = "cymbra_server"
path = "src/lib.rs"

[[bin]]
name = "cymbra-server"
path = "src/main.rs"

# One-off maintenance: recompute catalog titles from stored score bytes.
[[bin]]
name = "backfill-titles"
path = "src/bin/backfill_titles.rs"

# One-off maintenance: enqueue audio-teaser renders for accepted pieces without one.
[[bin]]
name = "backfill-score-previews"
path = "src/bin/backfill_score_previews.rs"

[[bin]]
name = "backfill-instruments"
path = "src/bin/backfill_instruments.rs"

# One-off maintenance: quarantine corpus objects no catalog row references.
[[bin]]
name = "reconcile-corpus"
path = "src/bin/reconcile_corpus.rs"

# One-off ops verification: report soundfont rows whose recorded family their
# preset banks cannot support (read-only; change: add-drum-audio-channel).
[[bin]]
name = "verify-soundfont-families"
path = "src/bin/verify_soundfont_families.rs"

[dependencies]
cymbra-platform = { path = "../platform" }
cymbra-auth = { path = "../auth" }
cymbra-user = { path = "../user" }
cymbra-auth-port = { path = "../auth-port" }
cymbra-user-port = { path = "../user-port" }
# Music module (score catalog + user uploads) + its object store.
cymbra-music = { path = "../music" }
cymbra-storage = { path = "../storage" }
# DeleteAccount enqueues a `purge_user` job via the jobs.enqueue seam.
cymbra-jobs = { path = "../jobs" }
# Shared runtime feature-flag & config service (change: add-runtime-feature-flags).
cymbra-feature-flags = { path = "../feature-flags" }
# Plans (change: add-premium-subscription): PlanService gRPC, plan-aware gates,
# provider notification routes.
cymbra-plans = { path = "../plans" }
chrono.workspace = true
# Analytics module (feature-usage telemetry ingestion; change: add-feature-usage-analytics).
cymbra-analytics = { path = "../analytics" }
# Push-notification platform (token registry / consent / timezone RPCs; change:
# add-push-notifications).
cymbra-notifications = { path = "../notifications" }
# Desktop update feed (change: add-desktop-auto-update): the release store and
# the shared manifest contract the ingest handler re-verifies against.
cymbra-updates = { path = "../updates" }
cymbra-update-manifest = { path = "../../crates/update-manifest" }
async-trait.workspace = true
uuid.workspace = true
tokio.workspace = true
tonic.workspace = true
# gRPC-web + CORS for the browser back office (change: add-moderation-back-office).
tonic-web.workspace = true
tower-http.workspace = true
http.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Structured logging for the standalone maintenance bin (backfill-titles).
tracing-subscriber.workspace = true
jsonwebtoken.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true

[dev-dependencies]
chrono.workspace = true
# Mock the flag store / admin-scope resolver when testing the flag-backed config
# sources (rust-testing default). Test-only: the mocks never ship in release.
cymbra-feature-flags = { path = "../feature-flags", features = ["mock"] }
cymbra-plans = { path = "../plans", features = ["mock"] }
cymbra-user-port = { path = "../user-port", features = ["mock"] }
# Double the release store when testing the update-feed handlers.
cymbra-updates = { path = "../updates", features = ["mock"] }
# Sign fixture envelopes in the update-feed handler tests.
ed25519-dalek = { workspace = true }
base64.workspace = true
mockall.workspace = true
# `ServiceExt::oneshot` drives the Axum router in web-auth handler tests (no socket).
tower.workspace = true
# Implement the `AuthPort` test double (a fake, no signing key) for the handler tests.
async-trait.workspace = true
