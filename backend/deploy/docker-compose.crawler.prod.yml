# Score-crawler fan-out for the production box — PULLS published images (no source
# checkout needed), joins the backend's private network to reach Postgres, and
# writes the corpus DIRECTLY into the served corpus dir (SCORES_DIR), the same
# path the server reads local-first. The crawler writes every .mxl before it
# inserts its catalog_scores rows, so a row visible in the hub is already
# servable — no deferred merge needed. sync-scores.sh then only MIRRORS SCORES_DIR
# off-box to S3 (durability + the S3 read-fallback).
#
# The crawler's OWN files — source checkouts and the per-run artefacts
# (manifest.json/.csv, rejected.log) — go to CRAWL_WORK, a SEPARATE mount. They
# used to be derived from the output root, which meant that pointing the output
# root at SCORES_DIR put 4.4 GB of git checkouts inside the served corpus, one
# nightly `sync-scores.sh` away from the bucket. The crawler now refuses to start
# if its work dir resolves inside the corpus (change: fix-crawler-corpus-isolation).
#
# NOTE: SCORES_DIR and CRAWL_WORK must both be writable by the crawler container
# UID (the server owns the corpus as 1000:1000 —
# `sudo chown -R 1000:1000 $SCORES_DIR $CRAWL_WORK`).
#
# NOTE: /opt/cymbra/backend is NOT a git checkout — merging a change that edits
# this file deploys nothing. Copy it to the box explicitly.
#
# One-time: log in to GHCR (or reuse the deploy pull creds), then pull:
#   docker login ghcr.io
#   docker compose -f docker-compose.crawler.prod.yml pull
#
# Run (from /opt/cymbra/backend/deploy, with the prod .env for the DB password):
#   # smoke test — a few scores per source into the prod catalog:
#   LIMIT=5 docker compose --env-file .env -f docker-compose.crawler.prod.yml up
#   # full run (drop LIMIT); or one source: ... up mutopia
#   docker compose --env-file .env -f docker-compose.crawler.prod.yml up
# Scores are already served locally after the run; mirror them off-box to S3:
#   . /etc/cymbra/backup.env; ./sync-scores.sh
#
# openscore converts MuseScore .mscx via a sibling cymbra-musescore container, so
# it (only) needs the docker socket + a converter temp dir shared at the same path
# in and out of the container (SC_CONVTMP). The other sources need neither.

x-crawler: &crawler
  image: ghcr.io/neetrof/cymbra-score-crawler:${CRAWLER_TAG:-latest}
  environment: &crawler-env
    LIMIT: ${LIMIT:-}
    # Work location, mounted separately below. Per-source so concurrent
    # containers never race on the same checkouts or overwrite each other's
    # manifest export.
    CYMBRA_SCORE_WORK_DIR: /work/crawler
    # The crawler runs its own migrations then ingests, so it needs a role that
    # can create/write the `score` schema. Defaults to the superuser on the
    # private network; override with a dedicated role if you prefer.
    # Defaults to the superuser on the private network — pass `--env-file .env`
    # so POSTGRES_PASSWORD is set, or override the whole URL with a dedicated role.
    CYMBRA_SCORE_DATABASE_URL: ${CYMBRA_SCORE_DATABASE_URL:-postgres://cymbra:${POSTGRES_PASSWORD:-}@postgres:5432/cymbra}
  networks: [cymbra-prod]
  entrypoint: ["/bin/sh", "-c"]
  restart: "no"

services:
  mutopia:
    <<: *crawler
    command: ["score-crawler --sources mutopia $${LIMIT:+--limit $$LIMIT}"]
    volumes:
      - "${SCORES_DIR:-/var/lib/cymbra/scores}:/work/output"
      - "${CRAWL_WORK:-/opt/cymbra/score-crawler/work}/mutopia:/work/crawler"

  musetrainer:
    <<: *crawler
    command: ["score-crawler --sources musetrainer $${LIMIT:+--limit $$LIMIT}"]
    volumes:
      - "${SCORES_DIR:-/var/lib/cymbra/scores}:/work/output"
      - "${CRAWL_WORK:-/opt/cymbra/score-crawler/work}/musetrainer:/work/crawler"

  eduardomourar:
    <<: *crawler
    command: ["score-crawler --sources eduardomourar $${LIMIT:+--limit $$LIMIT}"]
    volumes:
      - "${SCORES_DIR:-/var/lib/cymbra/scores}:/work/output"
      - "${CRAWL_WORK:-/opt/cymbra/score-crawler/work}/eduardomourar:/work/crawler"

  pdmx:
    <<: *crawler
    command: ["score-crawler --sources pdmx $${LIMIT:+--limit $$LIMIT}"]
    volumes:
      - "${SCORES_DIR:-/var/lib/cymbra/scores}:/work/output"
      - "${CRAWL_WORK:-/opt/cymbra/score-crawler/work}/pdmx:/work/crawler"

  openscore:
    <<: *crawler
    command: ["score-crawler --sources openscore $${LIMIT:+--limit $$LIMIT}"]
    environment:
      <<: *crawler-env
      CYMBRA_SCORE_CONVERTER_BACKEND: docker
      CYMBRA_SCORE_MUSESCORE_IMAGE: ghcr.io/neetrof/cymbra-musescore:${CRAWLER_TAG:-latest}
      TMPDIR: ${SC_CONVTMP:-/tmp/cymbra-conv}
    volumes:
      - "${SCORES_DIR:-/var/lib/cymbra/scores}:/work/output"
      - "${CRAWL_WORK:-/opt/cymbra/score-crawler/work}/openscore:/work/crawler"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${SC_CONVTMP:-/tmp/cymbra-conv}:${SC_CONVTMP:-/tmp/cymbra-conv}"

networks:
  # The backend stack's default network (its compose project is named
  # `cymbra-prod`, so Docker names the network `cymbra-prod_default`), joined as
  # external so `postgres` resolves. It must be up (backend stack running) first.
  cymbra-prod:
    external: true
    name: cymbra-prod_default
