[package]
name = "cymbra-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra push-notification platform — the FCM device-token registry, per-user timezone, per-category consent, the host-testable recipient-selection core and the mockable PushSender port with its FCM HTTP v1 implementation (change: add-push-notifications)."

[dependencies]
async-trait.workspace = true
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# NotificationService (client-facing) + the platform identity/error seam.
tonic.workspace = true
prost.workspace = true
cymbra-platform = { path = "../platform" }
# Hot-reloadable kill-switch / per-category enable / schedule hour.
cymbra-feature-flags = { path = "../feature-flags" }
# FCM HTTP v1: service-account OAuth (RS256 assertion) + the send call.
reqwest.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true }
mockall = { workspace = true }
