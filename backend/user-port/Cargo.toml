[package]
name = "cymbra-user-port"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra ID user module — contract crate (port trait, DTOs, protobuf, gRPC client adapter)."

[dependencies]
cymbra-platform = { path = "../platform" }
tonic.workspace = true
prost.workspace = true
async-trait.workspace = true
# Dates for the public-profile age gate (change: add-play-activity-profile):
# `share_eligible_from` + the UTC "today" the eligibility check compares against.
chrono.workspace = true
# Optional: generates `MockUserPort` via `#[automock]` under the `mock` feature,
# so other capabilities (the music PlayService) can double the visibility gate.
mockall = { workspace = true, optional = true }

[features]
mock = ["dep:mockall"]

[build-dependencies]
tonic-build.workspace = true
