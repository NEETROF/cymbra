syntax = "proto3";

package cymbra.user.v1;

// UserService — the user module's public, authenticated account-management
// surface (the caller's identity comes from the internal access token, not the
// request body). Internal port methods (resolve-or-provision, link/unlink,
// effective roles) are in-process Rust APIs used by the auth module, not RPCs.

message Account {
  string user_id = 1;
  optional string display_name = 2;
  string preferences = 3; // JSON object as a string
  int64 version = 4;
  int64 updated_at = 5; // unix seconds
  optional string handle = 6; // unique display handle; null until onboarded
  // Preferred language tag (change: sync-account-language-preference); null until
  // the identity system records one. Backend-owned (kept out of `preferences`).
  optional string locale = 7;
}

message Identity {
  string provider = 1; // local | google | apple
  string subject = 2;
  int64 linked_at = 3;
}

message GetAccountRequest {}

// Set the caller's own preferred language (change: sync-account-language-
// preference). The account whose locale is written is the authenticated caller's,
// resolved from the request identity — never a body-supplied id. An empty locale is
// a no-op that leaves any stored value unchanged. Returns the updated account.
message SetLocaleRequest { string locale = 1; }

message UpdateAccountRequest {
  optional string display_name = 1;
  string preferences = 2;
  int64 expected_version = 3;
  optional string handle = 4; // set/replace the handle; unchanged when absent
}

message ListIdentitiesRequest {}
message ListIdentitiesResponse { repeated Identity identities = 1; }

message DeleteAccountRequest {}
message DeleteAccountResponse {}

// Advisory pre-check for handle onboarding. The write path (UpdateAccount) is the
// authority that guarantees uniqueness; `available` reflects current state only.
message CheckHandleAvailabilityRequest { string handle = 1; }
message CheckHandleAvailabilityResponse { bool available = 1; }

// --- Role administration (change: add-moderation-back-office) ----------------
// Admin-only: an administrator grants/revokes a role (e.g. music/moderator) for an
// account within a scope. The acting admin is the authenticated caller, never the
// body. Every grant/revoke is recorded in an append-only audit trail.

message GrantRoleRequest {
  string user_id = 1; // target account
  string scope = 2;   // global | music | live
  string role = 3;    // user | admin | moderator
}
message GrantRoleResponse {}

message RevokeRoleRequest {
  string user_id = 1;
  string scope = 2;
  string role = 3;
}
message RevokeRoleResponse {}

// One audit entry: who was granted/revoked which role, by which admin, when.
message RoleGrant {
  string target_user_id = 1;
  string scope = 2;
  string role = 3;
  string action = 4; // grant | revoke
  string acting_admin = 5;
  int64 at = 6; // unix seconds
  // Resolved handle of the acting admin (null if the admin has no handle or the
  // account no longer exists); the UI shows this instead of the raw id.
  optional string acting_admin_handle = 7;
}
message ListRoleGrantsRequest { string user_id = 1; }
message ListRoleGrantsResponse { repeated RoleGrant grants = 1; }

// Admin account directory (change: add-admin-account-directory). A paginated list
// of accounts with their music-scope roles, so an admin can browse users and act
// on each row. `query` is an optional filter matching a handle (prefix,
// case-insensitive) or the email of a `local` identity; an empty query lists all.
message ListAccountsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  string query = 3;
}
message AccountRow {
  string user_id = 1;
  optional string handle = 2;
  optional string display_name = 3;
  repeated string roles = 4; // roles held in the `music` scope
}
message ListAccountsResponse {
  repeated AccountRow accounts = 1;
  uint32 total = 2; // total matching accounts (for pagination)
}

// --- Public player profile (change: add-play-activity-profile) ---------------
// A player's profile as seen by ANOTHER player: an explicit allow-list of public
// fields only. It NEVER carries email, curator alignment/reliability, or any
// moderation state (fail-closed — a new sensitive field is private unless added
// here). The play heatmap + songs-played totals are read separately from the
// music PlayService and composed client-side. `visibility` is echoed so the owner
// can render their own control.
message PlayerProfile {
  string user_id = 1;
  optional string handle = 2;
  optional string display_name = 3;
  string visibility = 4; // private | public
}

// View another player's public profile (or one's own, always in full). The
// server honors visibility AND age-eligibility fail-closed: a not-public or
// not-yet-eligible profile is not exposed to anyone but its owner.
message GetPlayerProfileRequest { string user_id = 1; }

// Set the caller's own profile visibility. Making it `public` requires the user
// to be at least the configured minimum age: the neutral age gate sends the date
// of birth ONCE (ISO yyyy-mm-dd) only at opt-in; the server derives + stores only
// the eligibility date and DISCARDS the DOB. The check is server-side, fail-
// closed (a not-yet-eligible request is refused). `date_of_birth` is required the
// first time a user goes public and ignored otherwise.
message SetProfileVisibilityRequest {
  string visibility = 1;              // private | public
  optional string date_of_birth = 2;  // ISO yyyy-mm-dd; only at first public opt-in; discarded
}
message SetProfileVisibilityResponse {
  string visibility = 1; // the visibility now in effect
}

service UserService {
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc UpdateAccount(UpdateAccountRequest) returns (Account);
  // Set the caller's preferred language (change: sync-account-language-preference).
  rpc SetLocale(SetLocaleRequest) returns (Account);
  rpc CheckHandleAvailability(CheckHandleAvailabilityRequest) returns (CheckHandleAvailabilityResponse);
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // Role administration (admin-only).
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Public player profile (change: add-play-activity-profile).
  rpc GetPlayerProfile(GetPlayerProfileRequest) returns (PlayerProfile);
  rpc SetProfileVisibility(SetProfileVisibilityRequest) returns (SetProfileVisibilityResponse);
}
