[package]
name = "cymbra-plans"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra plans — the free/premium entitlement ledger (multi-source, expiring), beta campaigns + memberships (premium trials, feature betas), single-use access codes, and the purchase-channel adapters (Apple, Google, web merchant-of-record). Owns the `plans` schema. Stores identifiers only — never billing personal data. Change: add-premium-subscription."

[dependencies]
async-trait.workspace = true
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono = { workspace = true, features = ["serde"] }
# Access codes: 128-bit CSPRNG, base32-ish clear text, SHA-256 at rest.
getrandom = "0.2"
sha2 = "0.10"
# Provider webhooks / APIs (Apple JWS, Google Play API, web MoR): reqwest + JWT.
reqwest.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
hmac.workspace = true
# Apple signed payloads (App Store Server Notifications v2 / signed transactions):
# x5c chain parsing + ECDSA verification against the pinned Apple Root CA G3
# (P-256 leaf/intermediate, P-384 root) — pure Rust, no OpenSSL.
x509-parser = "0.16"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# gRPC PlanService (client + admin surface).
tonic.workspace = true
prost.workspace = true
cymbra-platform = { path = "../platform" }
# `MockEntitlementRepo` & co. via `#[automock]` under the `mock` feature so the
# server / music crates can double the plan seams (rust-testing default).
mockall = { workspace = true, optional = true }

[build-dependencies]
tonic-build.workspace = true

[features]
mock = ["dep:mockall"]

[dev-dependencies]
tokio = { workspace = true }
mockall = { workspace = true }
# Self-signed test chains for the Apple JWS verifier (root → leaf), signed JWS
# with the leaf key.
rcgen = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
