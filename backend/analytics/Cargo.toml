[package]
name = "cymbra-analytics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra analytics module — first-party feature-usage telemetry: the batched UsageService ingestion RPC, period-salted pseudonymous bucketing, and the tiered analytics store (raw + daily aggregates), owned by the `analytics` schema (change: add-feature-usage-analytics)."

[dependencies]
async-trait.workspace = true
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
# gRPC UsageService (ingestion) + the platform identity/error seam.
tonic.workspace = true
prost.workspace = true
cymbra-platform = { path = "../platform" }
# Period-salted pseudonymous `user_bucket` = HMAC(master_secret, "YYYY-MM").
hmac.workspace = true
sha2.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true }
mockall = { workspace = true }
