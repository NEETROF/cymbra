syntax = "proto3";

package cymbra.auth.v1;

// AuthService — Cymbra ID's sign-in surface. Sign-in carries a target app
// audience; Refresh derives the audience from the (audience-bound) session.

message TokenPair {
  string access_token = 1;  // short-lived, asymmetric-signed, aud-scoped
  string refresh_token = 2;  // long, sliding, rotated on use
}

// `locale` (optional, additive): the client's UI locale (e.g. "fr", "es-ES") so
// transactional email renders in the user's language; empty falls back to English.
message SignUpLocalRequest { string email = 1; string password = 2; string locale = 3; }
message SignUpLocalResponse {}

message VerifyEmailRequest { string token = 1; }
message VerifyEmailResponse {}

message ResendVerificationRequest { string email = 1; string locale = 2; }
message ResendVerificationResponse {}

message SignInLocalRequest { string email = 1; string password = 2; string audience = 3; }
message SignInOidcRequest { string id_token = 1; string audience = 2; }

message RefreshRequest { string refresh_token = 1; }
message LogoutRequest { string refresh_token = 1; }
message LogoutResponse {}

message RequestPasswordResetRequest { string email = 1; string locale = 2; }
message RequestPasswordResetResponse {}
message ResetPasswordRequest { string token = 1; string new_password = 2; }
message ResetPasswordResponse {}

message LinkIdentityRequest { string id_token = 1; }       // link an OIDC provider
message LinkIdentityResponse {}
message UnlinkIdentityRequest { string provider = 1; string subject = 2; }
message UnlinkIdentityResponse {}
// Add a local (email+password) credential to the authenticated account so it can
// also sign in with email (change: add-account-identity-linking). The credential
// is created UNVERIFIED and a verification email is sent — the password is only
// usable once the email is confirmed (mirrors SignUpLocal). Caller from the token.
message SetLocalCredentialRequest { string email = 1; string password = 2; string locale = 3; }
message SetLocalCredentialResponse {}

// Session revocation (change: add-session-management). Caller identity comes from the
// validated access token; no refresh token is ever surfaced.
message RevokeAllSessionsRequest {}                          // sign out everywhere (self)
message RevokeAllSessionsResponse {}
message RevokeAccountSessionsRequest { string user_id = 1; } // admin: cut off a target account
message RevokeAccountSessionsResponse {}

service AuthService {
  rpc SignUpLocal(SignUpLocalRequest) returns (SignUpLocalResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);
  rpc SignInLocal(SignInLocalRequest) returns (TokenPair);
  rpc SignInOidc(SignInOidcRequest) returns (TokenPair);
  rpc Refresh(RefreshRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc LinkIdentity(LinkIdentityRequest) returns (LinkIdentityResponse);
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  rpc SetLocalCredential(SetLocalCredentialRequest) returns (SetLocalCredentialResponse);
  // Session revocation (caller from the access token; the admin one is role-gated).
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
  rpc RevokeAccountSessions(RevokeAccountSessionsRequest) returns (RevokeAccountSessionsResponse);
}
