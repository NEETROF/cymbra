syntax = "proto3";

package cymbra.music.v1;

// ScoreService — a signed-in user's own contributed scores. The caller's
// identity comes from the internal access token (request metadata), never the
// body. All descriptive metadata (title/composer/key/…) is DERIVED server-side
// from the uploaded file — the client only supplies bytes, the chosen level, and
// the rights attestation (see design 2b). Every op is scoped to the caller.

// A contributed score as returned to its owner. Metadata is server-derived.
message ScoreRecord {
  string id = 1;
  optional string title = 2;
  optional string composer = 3;
  string level = 4; // beginner | intermediate | advanced
  int64 created_at = 5; // unix seconds
  int32 measure_count = 6;
  string time_sig = 7;
  int32 key_fifths = 8;
  // Derived facets for a faithful cover (change: score-catalog-facets). Null
  // facets are sent as their unset/zero form; the app treats 0 note_count etc.
  optional int32 min_note_value = 9;
  optional int32 tempo_bpm = 10;
  int32 note_count = 11;
  optional int32 lowest_midi = 12;
  optional int32 highest_midi = 13;
  // Whether this upload is in the caller's favorites (change: favorites-home).
  bool favorite = 14;
}

message SetScoreFavoriteRequest {
  string id = 1;
  bool favorite = 2;
}
message SetScoreFavoriteResponse {}

message UploadScoreRequest {
  bytes data = 1; // raw .musicxml/.xml or zipped .mxl
  string filename = 2; // display/logging only — not trusted as metadata
  string level = 3; // beginner | intermediate | advanced
  string rights_basis = 4; // own_work | public_domain
  bool rights_ack = 5; // the CGU confirmation; must be true
  // FALLBACK title/composer, used by the server ONLY when the parsed file
  // carries none (design 2b): a present parsed value always wins, so these can
  // never override/spoof real metadata.
  optional string fallback_title = 6;
  optional string fallback_composer = 7;
}

message ListMyScoresRequest {}
message ListMyScoresResponse { repeated ScoreRecord scores = 1; }

message DeleteScoreRequest { string id = 1; }
message DeleteScoreResponse {}

// Fetch the (decoded/canonical) bytes of a contributed score the caller owns —
// served local-first with an S3 fallback — to open it in the player.
message GetScoreBytesRequest { string id = 1; }
message GetScoreBytesResponse { bytes data = 1; }

// --- Score Hub: public-catalog search + per-user saved library ---------------
// (change: score-hub-search). All authenticated (identity from the interceptor,
// never the body). Search/bytes are catalog-wide; save/remove/list are owner-
// scoped. The corpus is public/redistributable — the crawler ingests it.

// A public-catalog score as surfaced by search or the saved list: attribution-
// complete (licence + source), WITHOUT bytes (fetched separately by id).
message CatalogHit {
  string id = 1;
  optional string title = 2;
  optional string composer = 3;
  optional string level = 4; // beginner | intermediate | advanced | (unset)
  string license = 5;        // normalised code, e.g. CC-BY-4.0
  string source = 6;         // origin dataset/repo (crawler attribution)
  // Attribution + musical facets for the generated cover (change: score-catalog-
  // facets-cover). Facets are null until backfilled; the cover falls back to the
  // difficulty when absent.
  optional string arranger = 7;
  optional int32 min_note_value = 8;  // fastest value denominator (8=eighth, 16=…)
  optional int32 tempo_bpm = 9;
  optional int32 note_count = 10;
  optional int32 lowest_midi = 11;
  optional int32 highest_midi = 12;
  string time_sig = 13;               // e.g. "4/4" ("" when unknown)
  int32 key_fifths = 14;              // circle-of-fifths (negative = flats)
}

// Full-text search over title+composer, with optional author/difficulty filters.
message SearchCatalogRequest {
  string query = 1;           // free-text over title + composer; empty = browse
  optional string author = 2; // structured composer filter (composes with query)
  optional string level = 3;  // difficulty filter: beginner|intermediate|advanced
  int32 limit = 4;            // page size; clamped to a server maximum
  int32 offset = 5;           // page offset
  // Musical facet filters (change: score-catalog-facets). Each optional; unset =
  // no constraint. A set filter excludes rows whose facet is unknown.
  optional bool is_piano = 6;              // keyboard/grand-staff only
  optional int32 max_note_value = 7;       // fastest allowed value (4=quarter,8=eighth,16=…)
  optional bool has_chords = 8;
  optional bool has_tuplets = 9;
  optional bool has_dotted = 10;
  optional int32 max_ambitus_semitones = 11; // max hand span
  optional int32 staff_count = 12;         // 1 or 2
  optional int32 min_bpm = 13;             // tempo range (marked BPM)
  optional int32 max_bpm = 14;
  // PRIVILEGED, back-office-only moderation-status filter (change: add-score-
  // moderation-gating): pending | accepted | rejected. The server honours it ONLY
  // for an admin/moderator identity and rejects it (PERMISSION_DENIED) otherwise.
  // The Flutter app never sets it; unset = the normal accepted-only visibility.
  optional string moderation_status = 15;
}
message SearchCatalogResponse {
  repeated CatalogHit hits = 1;
  int32 next_offset = 2; // offset to request the next page (offset + hits.len)
  int32 total = 3;       // total rows matching the query+filters, independent of limit/offset
}

message SaveCatalogScoreRequest { string catalog_id = 1; }
message SaveCatalogScoreResponse {}

message RemoveSavedCatalogScoreRequest { string catalog_id = 1; }
message RemoveSavedCatalogScoreResponse {}

message ListSavedCatalogScoresRequest {}
message ListSavedCatalogScoresResponse { repeated CatalogHit hits = 1; }

message GetCatalogScoreBytesRequest { string catalog_id = 1; }
message GetCatalogScoreBytesResponse { bytes data = 1; }

service ScoreService {
  rpc UploadScore(UploadScoreRequest) returns (ScoreRecord);
  rpc ListMyScores(ListMyScoresRequest) returns (ListMyScoresResponse);
  rpc DeleteScore(DeleteScoreRequest) returns (DeleteScoreResponse);
  rpc GetScoreBytes(GetScoreBytesRequest) returns (GetScoreBytesResponse);
  rpc SetScoreFavorite(SetScoreFavoriteRequest) returns (SetScoreFavoriteResponse);

  // Score Hub (change: score-hub-search).
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse);
  rpc SaveCatalogScore(SaveCatalogScoreRequest) returns (SaveCatalogScoreResponse);
  rpc RemoveSavedCatalogScore(RemoveSavedCatalogScoreRequest) returns (RemoveSavedCatalogScoreResponse);
  rpc ListSavedCatalogScores(ListSavedCatalogScoresRequest) returns (ListSavedCatalogScoresResponse);
  rpc GetCatalogScoreBytes(GetCatalogScoreBytesRequest) returns (GetCatalogScoreBytesResponse);
}
