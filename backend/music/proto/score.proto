syntax = "proto3";

package cymbra.music.v1;

// ScoreService — a signed-in user's own contributed scores. The caller's
// identity comes from the internal access token (request metadata), never the
// body. All descriptive metadata (title/composer/key/…) is DERIVED server-side
// from the uploaded file — the client only supplies bytes, the chosen level, and
// the rights attestation (see design 2b). Every op is scoped to the caller.

// A contributed score as returned to its owner. Metadata is server-derived.
message ScoreRecord {
  string id = 1;
  optional string title = 2;
  optional string composer = 3;
  string level = 4; // beginner | intermediate | advanced
  int64 created_at = 5; // unix seconds
  int32 measure_count = 6;
  string time_sig = 7;
  int32 key_fifths = 8;
  // Derived facets for a faithful cover (change: score-catalog-facets). Null
  // facets are sent as their unset/zero form; the app treats 0 note_count etc.
  optional int32 min_note_value = 9;
  optional int32 tempo_bpm = 10;
  int32 note_count = 11;
  optional int32 lowest_midi = 12;
  optional int32 highest_midi = 13;
  // Whether this upload is in the caller's favorites (change: favorites-home).
  bool favorite = 14;
  // Public-catalog proposal state (change: add-score-catalog-proposal): unset = not
  // proposed, else pending | accepted | rejected. `rejection_reason` carries the
  // moderator's motive when the proposal was rejected, so the owner knows why.
  optional string proposal_status = 15;
  optional string rejection_reason = 16;
}

message SetScoreFavoriteRequest {
  string id = 1;
  bool favorite = 2;
}
message SetScoreFavoriteResponse {}

message UploadScoreRequest {
  bytes data = 1; // raw .musicxml/.xml or zipped .mxl
  string filename = 2; // display/logging only — not trusted as metadata
  string level = 3; // beginner | intermediate | advanced
  string rights_basis = 4; // own_work | public_domain
  bool rights_ack = 5; // the CGU confirmation; must be true
  // FALLBACK title/composer, used by the server ONLY when the parsed file
  // carries none (design 2b): a present parsed value always wins, so these can
  // never override/spoof real metadata.
  optional string fallback_title = 6;
  optional string fallback_composer = 7;
}

message ListMyScoresRequest {}
message ListMyScoresResponse { repeated ScoreRecord scores = 1; }

message DeleteScoreRequest { string id = 1; }
message DeleteScoreResponse {}

// Fetch the (decoded/canonical) bytes of a contributed score the caller owns —
// served local-first with an S3 fallback — to open it in the player.
message GetScoreBytesRequest { string id = 1; }
message GetScoreBytesResponse { bytes data = 1; }

// --- Score Hub: public-catalog search + per-user saved library ---------------
// (change: score-hub-search). All authenticated (identity from the interceptor,
// never the body). Search/bytes are catalog-wide; save/remove/list are owner-
// scoped. The corpus is public/redistributable — the crawler ingests it.

// A public-catalog score as surfaced by search or the saved list: attribution-
// complete (licence + source), WITHOUT bytes (fetched separately by id).
message CatalogHit {
  string id = 1;
  optional string title = 2;
  optional string composer = 3;
  optional string level = 4; // beginner | intermediate | advanced | (unset)
  string license = 5;        // normalised code, e.g. CC-BY-4.0
  string source = 6;         // origin dataset/repo (crawler attribution)
  // Attribution + musical facets for the generated cover (change: score-catalog-
  // facets-cover). Facets are null until backfilled; the cover falls back to the
  // difficulty when absent.
  optional string arranger = 7;
  optional int32 min_note_value = 8;  // fastest value denominator (8=eighth, 16=…)
  optional int32 tempo_bpm = 9;
  optional int32 note_count = 10;
  optional int32 lowest_midi = 11;
  optional int32 highest_midi = 12;
  string time_sig = 13;               // e.g. "4/4" ("" when unknown)
  int32 key_fifths = 14;              // circle-of-fifths (negative = flats)
  // Moderation facets, populated ONLY for a privileged (moderator/admin) back-office
  // read (a normal app caller gets the defaults). `needs_review` is the hybrid
  // re-review flag from #2 (change: add-app-score-rating): an `accepted` score the
  // community has rated down enough to warrant a moderator's second look. Lets the
  // console badge flagged rows in the review queue/catalog.
  bool needs_review = 15;
  optional string moderation_status = 16; // pending | accepted | rejected (BO reads)
  // Proposal attribution (change: add-score-catalog-proposal). PRIVILEGED (moderator/
  // admin reads only): `proposed_by` (proposer id), `proposer_display_name` (pseudo),
  // `review_reason` (moderator's rejection motive), `resubmission_note` (proposer's
  // re-proposal justification). PUBLIC: `contributor_credit` — the opt-in "proposé par
  // @pseudo", present only for an accepted, user-proposed score whose proposer opted
  // into a public profile. A normal caller gets none of the privileged fields.
  optional string proposed_by = 17;
  optional string proposer_display_name = 18;
  optional string contributor_credit = 19;
  optional string review_reason = 20;
  optional string resubmission_note = 21;
}

// Full-text search over title+composer, with optional author/difficulty filters.
message SearchCatalogRequest {
  string query = 1;           // free-text over title + composer; empty = browse
  optional string author = 2; // structured composer filter (composes with query)
  optional string level = 3;  // difficulty filter: beginner|intermediate|advanced
  int32 limit = 4;            // page size; clamped to a server maximum
  int32 offset = 5;           // page offset
  // Musical facet filters (change: score-catalog-facets). Each optional; unset =
  // no constraint. A set filter excludes rows whose facet is unknown.
  optional bool is_piano = 6;              // keyboard/grand-staff only
  optional int32 max_note_value = 7;       // fastest allowed value (4=quarter,8=eighth,16=…)
  optional bool has_chords = 8;
  optional bool has_tuplets = 9;
  optional bool has_dotted = 10;
  optional int32 max_ambitus_semitones = 11; // max hand span
  optional int32 staff_count = 12;         // 1 or 2
  optional int32 min_bpm = 13;             // tempo range (marked BPM)
  optional int32 max_bpm = 14;
  // PRIVILEGED, back-office-only moderation-status filter (change: add-score-
  // moderation-gating): pending | accepted | rejected. The server honours it ONLY
  // for an admin/moderator identity and rejects it (PERMISSION_DENIED) otherwise.
  // The Flutter app never sets it; unset = the normal accepted-only visibility.
  optional string moderation_status = 15;
  // Optional structured sort (change: add-moderation-back-office): an ORDERED list
  // of keys — the first is primary, the rest break ties — applied server-side so it
  // is correct across the whole paginated set. Each `field` is validated against a
  // server allow-list; an unknown field is rejected. Moderation-oriented keys
  // (`status_rank`, `needs_review`) are privileged (moderator/admin only). When the
  // list is EMPTY the existing default ordering is preserved unchanged, so the app
  // hub (which sends none) is unaffected.
  repeated SortKey sort = 16;
  // PRIVILEGED, back-office-only review-queue mode (change: add-moderation-back-
  // office): when true the result set is the moderation work list — `pending` scores
  // PLUS `accepted` scores flagged `needs_review` by community ratings (#2) — instead
  // of a single moderation status. Combine with a `needs_review`-first `sort` to
  // surface flagged re-reviews at the top. Overrides `moderation_status`. Honoured
  // ONLY for an admin/moderator identity (PERMISSION_DENIED otherwise); the app never
  // sets it.
  optional bool review_queue = 17;
  // PRIVILEGED, back-office-only "all statuses" mode (change: add-score-catalog-
  // proposal): when true the catalog view returns every moderation status
  // (pending/accepted/rejected) instead of the accepted-only default. Honoured ONLY for
  // an admin/moderator identity; the app never sets it.
  optional bool all_statuses = 18;
  // Origin filter (change: add-score-catalog-proposal): restrict to a single `source`
  // (e.g. `user-proposal` vs a crawler dataset). Composes with the status gate; unset =
  // any source.
  optional string source = 19;
}

// One sort key: a column/alias from the search allow-list, ascending unless
// `descending` is set. Order in the repeated `sort` list = precedence.
message SortKey {
  string field = 1;
  bool descending = 2;
}
message SearchCatalogResponse {
  repeated CatalogHit hits = 1;
  int32 next_offset = 2; // offset to request the next page (offset + hits.len)
  int32 total = 3;       // total rows matching the query+filters, independent of limit/offset
}

message SaveCatalogScoreRequest { string catalog_id = 1; }
message SaveCatalogScoreResponse {}

message RemoveSavedCatalogScoreRequest { string catalog_id = 1; }
message RemoveSavedCatalogScoreResponse {}

message ListSavedCatalogScoresRequest {}
message ListSavedCatalogScoresResponse { repeated CatalogHit hits = 1; }

message GetCatalogScoreBytesRequest { string catalog_id = 1; }
message GetCatalogScoreBytesResponse { bytes data = 1; }

// Rating-preview bytes (change: rate-pending-scores): serves a `pending` or
// `accepted` score's bytes to a signed-in rater for the deck's read-only preview.
// Never a `rejected`/unknown score. Separate from the player-open bytes so that
// gate (accepted-only) and library save stay unchanged.
message GetRatingPreviewBytesRequest { string catalog_id = 1; }
message GetRatingPreviewBytesResponse { bytes data = 1; }

// Fetch a single catalog score's metadata by id (change: add-moderation-back-
// office), so a detail/deep-link view is self-sufficient (not dependent on a prior
// list). Gated like the bytes fetch: a normal caller resolves only `accepted`
// scores (non-`accepted` id → not-found), a moderator/admin resolves any status.
message GetCatalogScoreRequest { string catalog_id = 1; }

// Evaluate a catalog score (change: add-moderation-back-office). Sets its
// moderation status to accepted | rejected (or back to pending to re-queue) and
// stamps reviewed_by = caller + reviewed_at = now in the same write. Restricted to
// moderator/admin; an unknown score id is rejected.
message SetModerationStatusRequest {
  string score_id = 1;
  string status = 2; // pending | accepted | rejected
  // The moderator's rejection motive (change: add-score-catalog-proposal), recorded on
  // `rejected` (cleared on any other status) and surfaced back to the proposer.
  optional string reason = 3;
}
message SetModerationStatusResponse {}

// Propose one of the caller's private scores to the public catalog (change:
// add-score-catalog-proposal) — the only bridge from a private upload into the
// moderation review queue. Owner-scoped; the identity is the authenticated caller.
// A `resubmission_note` is required only when re-proposing a previously-rejected score
// (which reopens its catalog row); the initial moderation status is derived from the
// caller's role (admin -> accepted, else pending), never from the body.
message ProposeScoreRequest {
  string score_id = 1;          // one of the caller's ListMyScores ids
  string license = 2;           // licence declaration (required)
  bool rights_ack = 3;          // right-to-distribute attestation; must be true
  optional string attribution = 4;       // optional free-text attribution
  optional string resubmission_note = 5; // required when re-proposing a rejected score
}
message ProposeScoreResponse {}

// Edit a public-corpus catalog score's CURATORIAL metadata (change:
// add-catalog-metadata-editing). Moderator/admin only. ONLY these descriptive fields
// are editable — the MusicXML-derived facts (time signature, note/measure/staff counts,
// tempo, facets) stay read-only and authoritative from the score bytes. A present field
// replaces the stored value (empty composer/arranger/level clears it; an empty title is
// rejected — a title is mandatory); an ABSENT field is left unchanged. The server
// recomputes the derived search keys (title_norm/composer_norm/work_key) via the same
// normalize_text the ingest uses, records the edit in the append-only audit trail, and
// marks the row as manually edited. `catalog_scores` has no owner, so this is corpus-only.
message UpdateCatalogScoreRequest {
  string score_id = 1;
  optional string title = 2;
  optional string composer = 3;
  optional string arranger = 4;
  optional string level = 5; // beginner | intermediate | advanced (empty clears)
}
message UpdateCatalogScoreResponse {}

// Submit (or update) the caller's rating of an `accepted` catalog score (change:
// add-app-score-rating). Carries a swipe `verdict` (dislike | like | love) and an
// OPTIONAL 1–5 `stars` value; re-rating the same score upserts (one rating per
// user per score). The identity is the authenticated caller, never the body.
// Rating a non-`accepted` or unknown score is rejected.
message SubmitScoreRatingRequest {
  string catalog_id = 1;
  string verdict = 2;         // dislike | like | love (the swipe)
  optional int32 stars = 3;   // explicit 1..5 star value; unset = verdict only
}

// The freshly-recomputed per-score aggregate, so the app can update its optimistic
// UI without a second round-trip. `rating_avg` is the average effective value on
// the 1–5 scale (explicit stars, else the verdict's implied value); the verdict
// breakdown counts each swipe kind across all of the score's ratings.
message SubmitScoreRatingResponse {
  double rating_avg = 1;
  int32 rating_count = 2;
  int32 dislike_count = 3;
  int32 like_count = 4;
  int32 love_count = 5;
  // Coverage points earned by THIS rating (change: add-curation-rewards): a
  // diminishing, daily-capped, engagement-gated award, so the app can show an
  // immediate "+N" cue. 0 when nothing was awarded (capped / not engaged /
  // already rated / a fully-covered score).
  int32 points_awarded = 6;
}

// Source the swipe-rating deck (change: improve-rating-deck-sourcing): the caller's
// UN-RATED `accepted` scores, least-rated first (fewest existing ratings), so a
// score they already rated is never offered again and the deck empties once
// everything is rated. Identity is the authenticated caller.
message ListRatingDeckRequest {
  int32 limit = 1;  // page size; clamped to a server maximum
  int32 offset = 2; // page offset
}
message ListRatingDeckResponse {
  repeated CatalogHit hits = 1;
  int32 next_offset = 2; // offset to request the next page (offset + hits.len)
}

// A selectable playback SoundFont in the server-owned catalog (change:
// add-soundfont-catalog-db). `attribution` is empty when none is required;
// `instrument` is the instrument family (e.g. "piano").
message SoundFont {
  string id = 1;
  string label = 2;
  string license = 3;
  string attribution = 4;
  string instrument = 5;
}

message ListSoundFontsRequest {}

message ListSoundFontsResponse {
  repeated SoundFont soundfonts = 1;
}

// Admin view of a catalog font (change: add-soundfont-back-office-management):
// carries the storage-facing fields the user listing omits. `has_object` reports
// whether the bytes are present in the private store. Moderation fields
// (change: add-soundfont-moderation): `moderation_status` is one of
// "pending"/"accepted"/"rejected"; `reviewed_by`/`reviewed_at` are empty until a
// decision is made; `uploaded_by` is who contributed the font; `content_sha256` is
// the exact-byte digest used for identical-content detection. `has_preview` reports
// whether a server-rendered preview clip exists (change:
// add-soundfont-entitlement-previews) — drives the back-office play/"Generate sample"
// control and is required before a font can be accepted.
message AdminSoundFont {
  string id = 1;
  string label = 2;
  string object_key = 3;
  string instrument = 4;
  string license = 5;
  string attribution = 6;
  int64 size_bytes = 7;
  bool has_object = 8;
  string moderation_status = 9;
  string reviewed_by = 10;
  string reviewed_at = 11;
  string uploaded_by = 12;
  string content_sha256 = 13;
  bool has_preview = 14;
}

// Paginated admin listing (change: add-soundfont-moderation). `moderation_status`
// filters to a single status ("" = all); `limit`/`offset` page the results.
message AdminListSoundFontsRequest {
  int32 limit = 1;                 // page size; clamped to a server maximum
  int32 offset = 2;                // page offset
  string moderation_status = 3;    // "" = all, else pending/accepted/rejected
}

message AdminListSoundFontsResponse {
  repeated AdminSoundFont soundfonts = 1;
  int32 next_offset = 2;   // offset to request the next page (offset + soundfonts.len)
  int32 total = 3;         // total rows matching the status filter, independent of paging
  // Catalog-wide counts (ALL statuses, independent of the filter/page) for the
  // dashboard KPI cards.
  int32 pending_count = 4;
  int32 accepted_count = 5;
  int32 rejected_count = 6;
  int32 total_count = 7;
}

// Metadata-only edit (id and object_key are immutable; bytes are replaced by
// re-upload through the HTTP route).
message UpdateSoundFontRequest {
  string id = 1;
  string label = 2;
  string license = 3;
  string attribution = 4;
}

message UpdateSoundFontResponse {}

message DeleteSoundFontRequest {
  string id = 1;
}

message DeleteSoundFontResponse {}

// Set a catalog font's moderation status (change: add-soundfont-moderation).
// Music-scope moderator/admin only. `status` is "pending"/"accepted"/"rejected".
message SetSoundFontModerationStatusRequest {
  string id = 1;
  string status = 2;
}

message SetSoundFontModerationStatusResponse {}

// --- Curation rewards (change: add-curation-rewards) -------------------------
// The signed-in curator's points economy: coverage points (immediate,
// diminishing, daily-capped, engagement-gated) + a deferred honesty bonus settled
// against ground truth; levels + earned badges from LIFETIME points; a spendable
// balance (lifetime − redeemed) spent in a reward shop. All authenticated; the
// reliability read is moderator/admin only.

message GetCuratorRewardsRequest {}

// One badge in the full grid: earned or locked (with its milestone hint).
message CuratorBadge {
  string key = 1;       // stable key, e.g. "curator_1"
  string metric = 2;    // rating_count | aligned_count | first_rater_count
  int64 threshold = 3;  // the milestone that earns it (the locked hint)
  bool earned = 4;      // whether the caller has earned it
}

// One recent points event, for the profile activity feed (esp. deferred honesty).
message RewardActivity {
  string kind = 1;              // coverage | honesty | adjustment | redeem
  int32 amount = 2;            // signed (redeem is negative)
  optional string catalog_id = 3;
  optional string reward_key = 4;
  optional string source = 5;  // consensus | moderator (honesty/adjustment only)
  int64 created_at = 6;        // unix millis
}

message CuratorRewards {
  int64 lifetime_points = 1;
  int64 spendable_balance = 2;
  int64 level = 3;
  int64 level_floor = 4;    // lifetime that started the current level (progress floor)
  int64 next_level_at = 5;  // lifetime needed for the next level (progress ceiling)
  // Curator stats (the self-view mirror of the back-office reliability indicator).
  int64 total_ratings = 6;
  int64 coverage_contribution = 7;
  double alignment_rate = 8;          // aligned / settled (0 when none settled)
  repeated CuratorBadge badges = 9;   // full grid: earned + locked
  repeated RewardActivity recent = 10; // newest first
}

message ListRewardShopRequest {}

// A reward-shop item — a priced (or coming-soon) SoundFont from the catalog.
message RewardShopItem {
  string key = 1;        // soundfont id (the redeem key)
  string label = 2;
  string instrument = 3;
  string license = 4;
  string attribution = 5;
  int32 point_cost = 6;
  bool redeemable = 7;   // false = coming soon (listed, not redeemable yet)
  bool owned = 8;        // already granted (or free/default)
}

message ListRewardShopResponse { repeated RewardShopItem items = 1; }

message RedeemRewardRequest { string reward_key = 1; }

message RedeemRewardResponse {
  bool owned = 1;         // true on success (incl. an idempotent re-redeem)
  int64 new_balance = 2;  // the caller's spendable balance after the redemption
}

// Per-user curator reliability (design D7). MODERATOR/ADMIN only — informs manual
// promotion, never auto-promotes; a non-moderator/admin caller is refused.
message GetCuratorReliabilityRequest { string user_id = 1; }

message CuratorReliability {
  int64 total_ratings = 1;
  int64 coverage_contribution = 2;
  double alignment_rate = 3;  // over SETTLED ratings only
  int64 settled_count = 4;
  int64 aligned_count = 5;
}

service ScoreService {
  rpc UploadScore(UploadScoreRequest) returns (ScoreRecord);

  // SoundFont catalog listing (change: add-soundfont-catalog-db): the available
  // playback SoundFonts from the server-owned catalog, so the client offers only
  // fonts that actually exist. Authenticated; bytes are fetched separately via the
  // GET /soundfonts/{id} delivery route.
  rpc ListSoundFonts(ListSoundFontsRequest) returns (ListSoundFontsResponse);

  // SoundFont catalog administration (change: add-soundfont-back-office-management).
  // Music-scope moderator/admin only. Metadata list/edit/delete; adding a font (with
  // its bytes) goes through the admin HTTP upload route. Delete removes row + object.
  rpc AdminListSoundFonts(AdminListSoundFontsRequest) returns (AdminListSoundFontsResponse);
  rpc UpdateSoundFont(UpdateSoundFontRequest) returns (UpdateSoundFontResponse);
  rpc DeleteSoundFont(DeleteSoundFontRequest) returns (DeleteSoundFontResponse);
  // Set a font's moderation status (change: add-soundfont-moderation). Music-scope
  // moderator/admin only; stamps reviewer + time.
  rpc SetSoundFontModerationStatus(SetSoundFontModerationStatusRequest) returns (SetSoundFontModerationStatusResponse);

  rpc ListMyScores(ListMyScoresRequest) returns (ListMyScoresResponse);
  // Opt-in proposal of a private score to the public catalog (change: add-score-catalog-proposal).
  rpc ProposeScore(ProposeScoreRequest) returns (ProposeScoreResponse);
  rpc DeleteScore(DeleteScoreRequest) returns (DeleteScoreResponse);
  rpc GetScoreBytes(GetScoreBytesRequest) returns (GetScoreBytesResponse);
  rpc SetScoreFavorite(SetScoreFavoriteRequest) returns (SetScoreFavoriteResponse);

  // Score Hub (change: score-hub-search).
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse);
  rpc SaveCatalogScore(SaveCatalogScoreRequest) returns (SaveCatalogScoreResponse);
  rpc RemoveSavedCatalogScore(RemoveSavedCatalogScoreRequest) returns (RemoveSavedCatalogScoreResponse);
  rpc ListSavedCatalogScores(ListSavedCatalogScoresRequest) returns (ListSavedCatalogScoresResponse);
  rpc GetCatalogScoreBytes(GetCatalogScoreBytesRequest) returns (GetCatalogScoreBytesResponse);
  rpc GetCatalogScore(GetCatalogScoreRequest) returns (CatalogHit);

  // Moderation back office (change: add-moderation-back-office). Moderator/admin only.
  rpc SetModerationStatus(SetModerationStatusRequest) returns (SetModerationStatusResponse);

  // Curatorial metadata editing (change: add-catalog-metadata-editing). Moderator/admin
  // only; corpus scores only. Edits title/composer/arranger/level, recomputes the search
  // keys, and audits the change.
  rpc UpdateCatalogScore(UpdateCatalogScoreRequest) returns (UpdateCatalogScoreResponse);

  // Score rating (change: add-app-score-rating). Any signed-in user rates an
  // `accepted` catalog score; one updatable rating per user per score.
  rpc SubmitScoreRating(SubmitScoreRatingRequest) returns (SubmitScoreRatingResponse);

  // Rating deck source (change: improve-rating-deck-sourcing, widened by
  // rate-pending-scores): the caller's un-rated pending + accepted scores,
  // least-rated first.
  rpc ListRatingDeck(ListRatingDeckRequest) returns (ListRatingDeckResponse);

  // Rating-preview bytes (change: rate-pending-scores): a signed-in rater fetches a
  // `pending` OR `accepted` score's bytes to preview it read-only in the deck before
  // rating. Distinct from GetCatalogScoreBytes (player open, accepted-only): it serves
  // pending too, but never rejected; it is not a player open and not a library save.
  // Also records the engagement signal that gates coverage points (change:
  // add-curation-rewards).
  rpc GetRatingPreviewBytes(GetRatingPreviewBytesRequest) returns (GetRatingPreviewBytesResponse);

  // Curation rewards (change: add-curation-rewards). Authenticated.
  rpc GetCuratorRewards(GetCuratorRewardsRequest) returns (CuratorRewards);
  rpc ListRewardShop(ListRewardShopRequest) returns (ListRewardShopResponse);
  rpc RedeemReward(RedeemRewardRequest) returns (RedeemRewardResponse);
  // Per-user reliability indicator — MODERATOR/ADMIN only (informs manual promotion).
  rpc GetCuratorReliability(GetCuratorReliabilityRequest) returns (CuratorReliability);
}
