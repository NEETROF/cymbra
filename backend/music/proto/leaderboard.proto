syntax = "proto3";

package cymbra.music.v1;

// LeaderboardService — per-piece, per-mode rankings derived from the play data
// #5 ingests (change: add-play-leaderboards). Reads only: the personal bests are
// maintained on the `RecordPlaySession` ingest path, not here. The caller's
// identity comes from the internal access token (request metadata), never the
// body. Lives in the `music` crate/schema alongside the pieces it ranks.

// One ranked entry on a board. Carries only NON-SENSITIVE public fields (handle +
// display name) — never an email, curator alignment/reliability, or moderation
// state. `tiebreak_metric` is normalised so smaller is better (|mean tempo
// offset| on the tempo board, mean reaction ms on the reaction board).
message LeaderboardEntry {
  int32 rank = 1;             // 1-based rank among the public entries
  string user_id = 2;         // the ranked player's id (opaque)
  string handle = 3;          // public handle, empty if none
  string display_name = 4;    // public display name, empty if none
  float subscore = 5;         // the per-mode synchronization sub-score 0..100 (rank primary)
  float tiebreak_metric = 6;  // normalised timing tie-break, smaller = better
  int64 achieved_at_ms = 7;   // when this best was achieved (unix epoch ms)
}

// Read one board: the ranked PUBLIC + age-eligible entries for `score_id` in
// `mode`, plus the caller's own standing. `mode` is "tempo" or "reaction".
message GetLeaderboardRequest {
  string score_id = 1;  // the piece (an accepted catalog score id)
  string mode = 2;      // "tempo" | "reaction"
  int32 offset = 3;     // paging offset into the ranked public entries
  int32 limit = 4;      // page size (server clamps to a sane maximum)
}
message GetLeaderboardResponse {
  // The requested page of ranked PUBLIC entries (private/ineligible players are
  // never listed to others).
  repeated LeaderboardEntry entries = 1;
  // Total number of public entries on this board (for paging).
  int32 total = 2;
  // The CALLER's own best + rank among the public entries, always returned when
  // the caller has a best on this board — even if the caller is private/ineligible
  // (they see themselves without being listed to others). Absent (message-presence
  // false) when the caller has never scored on this board.
  optional LeaderboardEntry own = 3;
}

// Batch read of the CALLER's own standing on many pieces at once (change:
// add-play-leaderboards) — one call for a whole page of score cards, instead of
// one GetLeaderboard per card. Returns only the pieces where the caller is ranked
// (a card with no entry shows a bare trophy).
message GetMyStandingsRequest {
  repeated string score_ids = 1; // the visible pieces (accepted catalog score ids)
}
// The caller's BEST standing on one piece across the two modes — the smaller rank
// wins, and `mode` says which board it came from (so a tap opens the right board).
message MyStanding {
  string score_id = 1;
  int32 rank = 2;      // best (smallest) rank across the two boards
  float subscore = 3;  // the sub-score behind that rank
  string mode = 4;     // "tempo" | "reaction" — the board of the best rank
}
message GetMyStandingsResponse {
  repeated MyStanding standings = 1; // only pieces the caller is ranked on
}

service LeaderboardService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetMyStandings(GetMyStandingsRequest) returns (GetMyStandingsResponse);
}
