[package]
name = "cymbra-music"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra music-domain module — the public score catalog (crawler-ingested) plus authenticated user uploads (user_scores + gRPC ScoreService), owned by the `music` schema."

[dependencies]
async-trait.workspace = true
# Per-row progress/skip logging for the title backfill maintenance path.
tracing.workspace = true
sqlx.workspace = true
serde = { workspace = true }
# Parses the immutable session-result record (JSON) on the leaderboard ingest path
# to derive the per-mode sub-scores + tie-break metrics (change: add-play-leaderboards).
serde_json = { workspace = true }
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
# Per-user IANA zone → local day for the practice-streak reminder's at-risk set
# (change: add-practice-streak): "has not played TODAY" is only meaningful in the
# player's own timezone, exactly like the push platform's local-hour gate.
chrono-tz.workspace = true
sha2 = "0.10"
# Headless SoundFont synthesis for server-rendered preview clips (change:
# add-soundfont-entitlement-previews). Same version vendored client-side
# (apps/music/rust) so licensing/versioning is known-good; used device-free.
rustysynth = "1.3"
# CSPRNG for the per-user offline-cache secret (change: add-offline-score-cache).
getrandom = "0.2"
# gRPC ScoreService (user uploads). The catalog surface stays anyhow-based; only
# the upload path needs the platform error type + storage + shared validation.
tonic.workspace = true
prost.workspace = true
cymbra-platform = { path = "../platform" }
cymbra-storage = { path = "../storage" }
cymbra-musicxml-core = { path = "../../crates/musicxml-core" }
# Play-activity visibility gate (change: add-play-activity-profile): the music
# PlayService checks a target's profile visibility in-process via the user PORT
# (contract crate — an impl→port dependency, like cymbra-auth uses it), never
# reaching into the `user_account` schema directly.
cymbra-user-port = { path = "../user-port" }
cymbra-jobs = { path = "../jobs" }
# Plan seams (change: add-premium-subscription): the daily-access `SubscriptionSource`,
# the shop `owned` input and the per-plan quotas consume `PlanSource`/`Unlock` from the
# plans crate — a port dependency; `plans` never depends on `music`.
cymbra-plans = { path = "../plans" }

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true }
# `MockUserPort` for the play-activity visibility gate (rust-testing default).
cymbra-user-port = { path = "../user-port", features = ["mock"] }
# `MockBadgeRepo` for the badge awarding module (rust-testing default).
mockall = { workspace = true }
# `MockPlanSource` for the plan-aware gates (rust-testing default).
cymbra-plans = { path = "../plans", features = ["mock"] }
