name: "Flutter + Rust native setup"
description: >-
  Shared setup for the native build jobs: Rust toolchain, Flutter, protoc, and app
  codegen (gRPC stubs + riverpod/freezed). The caller must run actions/checkout
  before this composite (needed to resolve this local action).

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - uses: subosito/flutter-action@v2
      with:
        # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
        # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
        # migration; keep in sync with the local toolchain.
        flutter-version: 3.41.8
        channel: stable
    - name: Set up protoc (gRPC codegen)
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
    - name: Generate gRPC stubs (protoc)
      working-directory: apps/music
      shell: bash
      run: |
        flutter pub get
        bash tool/gen_grpc.sh
    # The shared cymbra_flags package (a path dependency of apps/music) owns its
    # own gRPC stubs + riverpod codegen. build_runner only generates the package
    # it runs in, so the app build fails unless the package is generated first.
    - name: Generate shared cymbra_flags package (stubs + codegen)
      working-directory: packages/cymbra_flags
      shell: bash
      run: |
        flutter pub get
        bash tool/gen_grpc.sh
        dart run build_runner build --delete-conflicting-outputs
    - name: Generate code (riverpod_generator + freezed)
      working-directory: apps/music
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
