# Build the Cymbra backend image and push it to GHCR.
# The single-box deploy pulls `ghcr.io/neetrof/cymbra-backend:latest` (or a tag).
name: backend-image

on:
  push:
    branches: [main]
    # release-please tags the backend component `backend-vX.Y.Z`. Its release
    # commit modifies backend/CHANGELOG.md (under backend/**), so the tag build
    # matches the paths filter below and fires.
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/neetrof/cymbra-backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            # Strip the release-please `backend-v` prefix → clean semver image tags
            # (e.g. tag backend-v0.1.0 → image :0.1.0 and :0.1).
            type=match,pattern=backend-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=backend-v(\d+\.\d+),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
