name: release-build

# Builds the music app for desktop + Android + iOS and attaches the artifacts to
# the GitHub Release that release-please created for a `music-v*` tag.
#
# Triggered automatically when a `music-v*` tag is pushed (i.e. when the
# release-please "Release PR" is merged), or manually via workflow_dispatch —
# either on an existing tag, or with an empty `tag` input to dry-run the branch
# you dispatched from (builds + signs everything, uploads nothing). Dispatching
# WITH a tag checks out that tag, so it validates workflow changes only; a source
# change has to be dry-run from its branch.
#
# App config comes from apps/music/config/prod.json (--dart-define-from-file):
# api.cymbra.app:443 over TLS + the OIDC client IDs (mobile, and the desktop
# Google client id for the Windows/Linux loopback flow).
#
# Required GitHub secrets for the signed mobile jobs:
#   Desktop (Windows/Linux Google sign-in):
#     DESKTOP_GOOGLE_CLIENT_ID      the "Desktop app" OAuth client id (public).
#                                   Absent ⇒ Google stays hidden on desktop.
#     DESKTOP_GOOGLE_CLIENT_SECRET  the "Desktop app" client secret; Google
#                                   requires it at the token exchange even with
#                                   PKCE. Absent ⇒ desktop Google sign-in fails
#                                   the exchange (the button still shows if the
#                                   client id is set).
#   Desktop auto-update (change: add-desktop-auto-update):
#     DESKTOP_UPDATE_SIGNING_KEY    base64 Ed25519 SECRET key that signs the
#                                   release manifest. Generated once by
#                                   `cargo run -p cymbra-update-manifest --bin
#                                   update-keygen`; it exists ONLY here and in an
#                                   out-of-band backup — the backend never holds
#                                   it, which is what makes a backend compromise
#                                   unable to forge a release. Absent ⇒ the
#                                   `manifest` job FAILS rather than publishing
#                                   an unsigned release. Losing it means clients
#                                   stop accepting new releases until a build
#                                   ships trusting a new key.
#     DESKTOP_UPDATE_INGEST_SECRET  shared secret for POST /updates/desktop.
#                                   Absent ⇒ the envelope is still attached to the
#                                   Release, just not ingested (warning, not a
#                                   failure). Carries little authority on its own:
#                                   the backend re-verifies the signature.
#   Repository VARIABLE (not a secret):
#     DESKTOP_UPDATE_INGEST_URL     the ingest endpoint; defaults to
#                                   https://api.cymbra.app/updates/desktop
#   Android (Play upload key):
#     ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD    store password
#     ANDROID_KEY_ALIAS            key alias (e.g. upload)
#     ANDROID_KEY_PASSWORD         key password
#   iOS (App Store distribution):
#     IOS_DIST_CERT_BASE64         base64 of the Apple Distribution cert (.p12)
#     IOS_DIST_CERT_PASSWORD       .p12 export password
#     IOS_PROVISIONING_PROFILE_BASE64   base64 of the App Store .mobileprovision
#     IOS_PROVISIONING_PROFILE_NAME     the profile's name (as in the portal)
#     IOS_TEAM_ID                  Apple Developer team id (VMFJ6KRW77)
#     GOOGLE_CLIENT_ID             iOS OAuth client id (reversed URL scheme)
#   macOS (Mac App Store distribution):
#     MAC_INSTALLER_CERT_BASE64    base64 of the Mac Installer Distribution cert
#                                  (.p12). Signs the .pkg. No iOS equivalent —
#                                  this one is always required.
#     MAC_INSTALLER_CERT_PASSWORD  .p12 export password
#     MAC_DIST_CERT_BASE64         OPTIONAL. Signs the .app. "Apple Distribution"
#                                  is multi-platform, so this defaults to
#                                  IOS_DIST_CERT_BASE64 — set it only to make the
#                                  two roles diverge.
#     MAC_DIST_CERT_PASSWORD       OPTIONAL, defaults to IOS_DIST_CERT_PASSWORD
#     MAC_PROVISIONING_PROFILE_BASE64  base64 of the Mac App Store .provisionprofile
#     MAC_PROVISIONING_PROFILE_NAME    the profile's name (as in the portal)
#     IOS_TEAM_ID / GOOGLE_CLIENT_ID   shared with the iOS job
#   App Store Connect upload (optional — auto-deliver on tag push; absent ⇒ skipped;
#   shared by the iOS and macOS jobs):
#     ASC_API_KEY_ID               App Store Connect API key id
#     ASC_API_ISSUER_ID            App Store Connect API issuer id
#     ASC_API_KEY_P8               base64 of the API private key (AuthKey_*.p8)
#
# Absent Android secrets → the release build falls back to debug signing (the
# gradle config degrades gracefully), but this job requires them and fails loudly.
# macOS publishes NO GitHub Release asset: a `method: app-store` .pkg is a
# submission artifact that users cannot install, and the unsigned .app it replaced
# was Gatekeeper-blocked anyway. The macOS download returns with Developer ID
# notarized distribution (see openspec/changes/prepare-macos-app-store, non-goals).
on:
  push:
    tags:
      - "music-v*"
  workflow_dispatch:
    inputs:
      tag:
        # Optional on purpose. With a tag, the run checks out that tag and
        # attaches assets to its release. WITHOUT one, it checks out the branch
        # you dispatched from and uploads nothing — the only way to validate a
        # source change (not just a workflow change) before it is tagged, since
        # `ref: <tag>` would otherwise build the tag's tree with the branch's YAML.
        description: "Existing music-v* tag. Leave empty to dry-run the branch (builds + signs, uploads nothing)."
        required: false
      deliver_macos:
        # Opt-in, because a dispatch consumes a TestFlight build number the same
        # way a real release does — and version+build is unique per platform, so
        # a delivered build cannot be re-delivered.
        # macOS only on purpose: iOS delivery stays tag-only, so ticking this box
        # can never push branch code to the iOS TestFlight by surprise.
        description: "Also deliver the macOS .pkg to App Store Connect / TestFlight."
        required: false
        type: boolean
        default: false

permissions:
  contents: write # upload assets to the release

env:
  # Artifact label — NOT the checkout ref (that stays `inputs.tag || ref_name`).
  # On a branch dry-run `ref_name` is a branch name, and a branch name with a `/`
  # in it turns `cymbra-${TAG}-macos.pkg` into a path under a directory that does
  # not exist, which is how every job failed at its packaging step. Fall back to a
  # fixed, slash-free label instead; `startsWith(env.TAG, 'music-v')` then also
  # correctly skips the release uploads.
  TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || 'dryrun' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build libgtk-3-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
          # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
          # migration; keep in sync with the local toolchain.
          flutter-version: 3.41.8
          channel: stable
      - name: Set up protoc (gRPC codegen)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code (bootstrap workspace + gRPC + riverpod + freezed)
        # Bootstrap the whole Melos workspace, not just apps/music, so shared
        # packages (e.g. packages/cymbra_flags) also get their gitignored gRPC
        # stubs + build_runner output. Mirrors flutter.yml: doing pub-get/codegen
        # only inside apps/music silently dropped cymbra_flags and broke the
        # release archive (music-v1.16.0). `dart pub global run melos` avoids
        # relying on the pub-cache bin being on PATH (it isn't on Windows).
        shell: bash
        run: |
          dart pub global activate melos
          dart pub global run melos bootstrap
          dart pub global run melos run gen-grpc
          dart pub global run melos run generate
      - name: Build
        working-directory: apps/music
        # prod.json carries the gRPC endpoint; the desktop Google client id +
        # secret come from repo secrets (the secret is required by Google's
        # Desktop client even with PKCE). Empty client id ⇒ Google stays hidden
        # on desktop (the app guards on a non-empty client id).
        run: >-
          flutter build linux --release
          --dart-define-from-file=config/prod.json
          --dart-define=DESKTOP_GOOGLE_CLIENT_ID=${{ secrets.DESKTOP_GOOGLE_CLIENT_ID }}
          --dart-define=DESKTOP_GOOGLE_CLIENT_SECRET=${{ secrets.DESKTOP_GOOGLE_CLIENT_SECRET }}
      - name: Package (portable tarball)
        working-directory: apps/music/build/linux/x64/release/bundle
        run: tar czf "$GITHUB_WORKSPACE/cymbra-${TAG}-linux-x64.tar.gz" .
      # The self-updating artifact (change: add-desktop-auto-update, design D5):
      # a single file that can replace itself in place. The tarball above stays
      # published — it takes the notify-only update path.
      - name: Package (AppImage)
        run: |
          set -euo pipefail
          bash apps/music/linux/appimage/build_appdir.sh \
            apps/music/build/linux/x64/release/bundle \
            "$RUNNER_TEMP/Cymbra.AppDir"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          # GitHub runners have no reliable FUSE, so appimagetool must unpack
          # itself instead of mounting (design: Risks).
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$RUNNER_TEMP/Cymbra.AppDir" \
            "$GITHUB_WORKSPACE/cymbra-${TAG}-linux-x86_64.AppImage"
      # A packaging regression must fail the job here, not on a user's desktop.
      - name: Smoke-check the AppImage
        run: |
          set -euo pipefail
          APP="cymbra-${TAG}-linux-x86_64.AppImage"
          test -x "$APP" || { echo "AppImage is not executable"; exit 1; }
          # Unpack rather than mount (no FUSE) and assert the recipe is intact.
          "./$APP" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/cymbra-music.desktop
          test -f squashfs-root/cymbra-music.png
          test -x squashfs-root/usr/bin/music
          test -d squashfs-root/usr/bin/data/flutter_assets
          echo "AppImage version: $(sed -n 's/^version: //p' apps/music/pubspec.yaml)"
          rm -rf squashfs-root
      - name: Upload the desktop artifact for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: cymbra-${{ env.TAG }}-linux-x86_64.AppImage
          retention-days: 1
      # Release assets only for a real tag. A branch dry-run (empty `tag`
      # input) must not create a release named after the branch.
      - name: Attach to the GitHub Release
        if: startsWith(env.TAG, 'music-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            cymbra-${{ env.TAG }}-linux-x64.tar.gz
            cymbra-${{ env.TAG }}-linux-x86_64.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
          # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
          # migration; keep in sync with the local toolchain.
          flutter-version: 3.41.8
          channel: stable
      - name: Set up protoc (gRPC codegen)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code (bootstrap workspace + gRPC + riverpod + freezed)
        # Bootstrap the whole Melos workspace, not just apps/music, so shared
        # packages (e.g. packages/cymbra_flags) also get their gitignored gRPC
        # stubs + build_runner output. Mirrors flutter.yml: doing pub-get/codegen
        # only inside apps/music silently dropped cymbra_flags and broke the
        # release archive (music-v1.16.0). `dart pub global run melos` avoids
        # relying on the pub-cache bin being on PATH (it isn't on Windows).
        shell: bash
        run: |
          dart pub global activate melos
          dart pub global run melos bootstrap
          dart pub global run melos run gen-grpc
          dart pub global run melos run generate
      - name: Inject Google OAuth client ID (optional)
        working-directory: apps/music
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            # Reversed-client-id suffix = client ID without the Google domain suffix.
            suffix="${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
            printf 'GOOGLE_OAUTH_CLIENT_SUFFIX = %s\n' "$suffix" \
              > macos/Runner/Configs/Secrets.xcconfig
            echo "Injected reversed client-id suffix into Secrets.xcconfig."
          else
            echo "GOOGLE_CLIENT_ID secret not set — building with Google sign-in disabled."
          fi
      - name: Check macOS signing secrets
        env:
          DIST_CERT: ${{ secrets.MAC_DIST_CERT_BASE64 || secrets.IOS_DIST_CERT_BASE64 }}
          INSTALLER_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -n "${DIST_CERT:-}" ] || missing="$missing MAC_DIST_CERT_BASE64 (or IOS_DIST_CERT_BASE64)"
          [ -n "${INSTALLER_CERT:-}" ] || missing="$missing MAC_INSTALLER_CERT_BASE64"
          [ -n "${PROFILE:-}" ] || missing="$missing MAC_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::macOS signing secrets missing:$missing. See apps/music/README.md (macOS signing)."
            exit 1
          fi
      # Mac App Store submission signs twice with two different identities: the
      # .app with Apple Distribution, the .pkg with Mac Installer Distribution.
      # "Apple Distribution" is the modern multi-platform cert, so it is literally
      # the same certificate the ios job uses — hence the fallback to
      # IOS_DIST_CERT_* above and here, rather than a second copy of one .p12 that
      # would silently drift apart at the next renewal. Setting MAC_DIST_CERT_*
      # still wins, for the day the two roles need to diverge. The installer cert
      # has no iOS equivalent and is always its own secret.
      # Same throwaway-keychain sequence as the ios job. The profile is copied to
      # BOTH profile directories: Xcode 16 moved the search path from
      # ~/Library/MobileDevice/Provisioning Profiles to
      # ~/Library/Developer/Xcode/UserData/Provisioning Profiles, and macos-latest
      # tracks whatever Xcode the image ships. Copying to both costs nothing and
      # removes a silent "no profile found" failure when the image rolls forward.
      - name: Import distribution certs + provisioning profile
        env:
          DIST_CERT_BASE64: ${{ secrets.MAC_DIST_CERT_BASE64 || secrets.IOS_DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.MAC_DIST_CERT_PASSWORD || secrets.IOS_DIST_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIST_PATH="$RUNNER_TEMP/mac_dist.p12"
          INSTALLER_PATH="$RUNNER_TEMP/mac_installer.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.provisionprofile"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$DIST_CERT_BASE64" | base64 --decode > "$DIST_PATH"
          echo "$INSTALLER_CERT_BASE64" | base64 --decode > "$INSTALLER_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$DIST_PATH" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_PATH" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/"
          done
      - name: Switch Release to Mac App Store signing + export options
        working-directory: apps/music/macos
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.MAC_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # Switch the Runner target's Release configuration to Mac App Store
          # signing. This has to be a project-file edit, not an xcconfig and not
          # `xcodebuild SETTING=value` — the script's docstring records why both
          # fail (and why letting the archive go unsigned silently drops every
          # entitlement). CI-only: the committed project keeps automatic
          # development signing so contributors build without a dist cert.
          python3 tool/ci_release_signing.py Runner.xcodeproj/project.pbxproj \
            --profile "${PROFILE_NAME}" --team "${TEAM_ID}"
          cat > ExportOptions-ci.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cymbra.music</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
      # `flutter build macos` stops at the .app — there is no macOS equivalent of
      # `flutter build ipa --export-options-plist`. It still has to run first: the
      # dart-defines live in Flutter's generated xcconfig, which only the Flutter
      # tool writes, so archiving without this pass would ship a build pointing at
      # the dev gRPC endpoint. prod.json carries api.cymbra.app:443 over TLS; the
      # reversed Google client id comes from Secrets.xcconfig injected above.
      # Apple build number: iOS and macOS share one App Store Connect record
      # (universal purchase), and App Store Connect requires every uploaded
      # CFBundleVersion to be HIGHER than the last one across BOTH platforms — a
      # macOS upload numbered like the iOS one of the same release is rejected
      # ("must be higher than the previously uploaded version"). Derive it from
      # the workflow run number instead of pubspec's `+N`: iOS = run×10,
      # macOS = run×10+1 — strictly increasing across releases and platforms, and
      # a re-dispatch (new run) can deliver again. Android keeps pubspec's `+N`
      # (its own store, its own monotonic versionCode).
      - name: Build (release, prod config)
        working-directory: apps/music
        run: >-
          flutter build macos --release
          --build-number=$(( GITHUB_RUN_NUMBER * 10 + 1 ))
          --dart-define-from-file=config/prod.json
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
      - name: Archive + export .pkg (app-store)
        working-directory: apps/music
        run: |
          set -euo pipefail
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist macos/ExportOptions-ci.plist \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP"/export/*.pkg "$GITHUB_WORKSPACE/cymbra-${TAG}-macos.pkg"
      # A workflow artifact, NOT a GitHub Release asset: private to repo
      # collaborators and short-lived. This is how a branch dry-run yields a
      # .pkg you can hand to Transporter — the job always builds with
      # config/prod.json, so a dry-run package is production-configured and
      # store-signed, which a locally rebuilt one cannot be trusted to be
      # (the gRPC endpoint is a compile-time define, not inspectable after
      # the fact).
      - name: Upload the .pkg as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cymbra-${{ env.TAG }}-macos-pkg
          path: cymbra-${{ env.TAG }}-macos.pkg
          retention-days: 7
          if-no-files-found: error
      # No GitHub Release asset on purpose — see the header comment. A
      # `method: app-store` .pkg cannot be installed by a user; the artifact of
      # record is the build in App Store Connect.
      #
      # Deliver on a real release (tag push), or on a dispatch that explicitly
      # asked for it via the deliver_macos input. A plain dispatch still only
      # builds + signs, so validating the chain never re-sends a build number.
      - name: Upload to App Store Connect (API key)
        if: ${{ github.event_name == 'push' || inputs.deliver_macos }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::warning::App Store Connect API secrets missing — skipping macOS upload."
            exit 0
          fi
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          xcrun altool --upload-app --type macos \
            --file "cymbra-${TAG}-macos.pkg" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
          # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
          # migration; keep in sync with the local toolchain.
          flutter-version: 3.41.8
          channel: stable
      - name: Set up protoc (gRPC codegen)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code (bootstrap workspace + gRPC + riverpod + freezed)
        # Bootstrap the whole Melos workspace, not just apps/music, so shared
        # packages (e.g. packages/cymbra_flags) also get their gitignored gRPC
        # stubs + build_runner output. Mirrors flutter.yml: doing pub-get/codegen
        # only inside apps/music silently dropped cymbra_flags and broke the
        # release archive (music-v1.16.0). `dart pub global run melos` avoids
        # relying on the pub-cache bin being on PATH (it isn't on Windows).
        shell: bash
        run: |
          dart pub global activate melos
          dart pub global run melos bootstrap
          dart pub global run melos run gen-grpc
          dart pub global run melos run generate
      - name: Build
        working-directory: apps/music
        # See the linux job: prod.json + the desktop client id/secret enable
        # Google sign-in on the shipped Windows build.
        run: >-
          flutter build windows --release
          --dart-define-from-file=config/prod.json
          --dart-define=DESKTOP_GOOGLE_CLIENT_ID=${{ secrets.DESKTOP_GOOGLE_CLIENT_ID }}
          --dart-define=DESKTOP_GOOGLE_CLIENT_SECRET=${{ secrets.DESKTOP_GOOGLE_CLIENT_SECRET }}
      - name: Package (portable zip)
        shell: pwsh
        run: Compress-Archive -Path apps/music/build/windows/x64/runner/Release/* -DestinationPath "cymbra-$env:TAG-windows-x64.zip"
      # The self-updating artifact (change: add-desktop-auto-update, design D4):
      # a PER-USER installer, which is the entire reason an update can be applied
      # silently with no UAC prompt. The portable zip above stays published — it
      # has no install marker and therefore takes the notify-only update path.
      - name: Package (per-user installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno is preinstalled on windows-latest; install it only if it is not.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          # Inno's VersionInfoVersion wants the numeric triple only, not `+build`.
          $pubspec = Select-String -Path apps/music/pubspec.yaml -Pattern '^version:\s*(.+)$'
          $full = $pubspec.Matches[0].Groups[1].Value.Trim()
          $numeric = $full.Split('+')[0]
          Write-Host "installer version: $numeric (pubspec $full)"
          & $iscc `
            "/DAppVersion=$numeric" `
            "/DBuildDir=$PWD\apps\music\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD" `
            "/DOutputBaseFilename=cymbra-$env:TAG-windows-x64-setup" `
            apps\music\windows\installer\cymbra.iss
          if (-not (Test-Path "cymbra-$env:TAG-windows-x64-setup.exe")) {
            throw "the installer was not produced"
          }
      - name: Upload the desktop artifact for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: cymbra-${{ env.TAG }}-windows-x64-setup.exe
          retention-days: 1
      # Release assets only for a real tag. A branch dry-run (empty `tag`
      # input) must not create a release named after the branch.
      - name: Attach to the GitHub Release
        if: startsWith(env.TAG, 'music-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            cymbra-${{ env.TAG }}-windows-x64.zip
            cymbra-${{ env.TAG }}-windows-x64-setup.exe

  # --- signed update manifest (change: add-desktop-auto-update, group 6) -------
  # Produces the release identity that the desktop updater trusts. Deliberately
  # separate from the backend: the Ed25519 key exists ONLY here, so a compromised
  # backend can withhold or stall an update (visible, recoverable) but cannot
  # fabricate one. Runs ONLY for a real `music-v*` tag — a branch dry-run builds
  # and packages both artifacts but signs, uploads and ingests nothing.
  manifest:
    needs: [windows, linux]
    if: startsWith(github.event.inputs.tag || github.ref_name, 'music-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Build the manifest
        shell: bash
        run: |
          set -euo pipefail
          # The version is read from pubspec.yaml, the SAME source the built app
          # reports at runtime — deriving it from the tag instead would let a
          # mistagged release offer an update the client then refuses as
          # non-newer, silently and forever.
          VERSION="$(sed -n 's/^version: //p' apps/music/pubspec.yaml | tr -d '[:space:]')"
          CHANNEL="$(jq -r '.channel' apps/music/config/desktop_release.json)"
          MIN="$(jq -r '.min_supported_version' apps/music/config/desktop_release.json)"
          WIN="dist/cymbra-${TAG}-windows-x64-setup.exe"
          LNX="dist/cymbra-${TAG}-linux-x86_64.AppImage"
          test -f "$WIN" && test -f "$LNX"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          jq -n \
            --argjson schema 1 \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg min "$MIN" \
            --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${{ github.repository }}/releases/tag/${TAG}" \
            --arg win_url "$BASE/$(basename "$WIN")" \
            --argjson win_size "$(stat -c %s "$WIN")" \
            --arg win_sha "$(sha256sum "$WIN" | cut -d" " -f1)" \
            --arg lnx_url "$BASE/$(basename "$LNX")" \
            --argjson lnx_size "$(stat -c %s "$LNX")" \
            --arg lnx_sha "$(sha256sum "$LNX" | cut -d" " -f1)" \
            '{
               schema: $schema,
               product: "music",
               channel: $channel,
               version: $version,
               released_at: $released,
               notes_url: $notes,
               targets: {
                 "windows-x64": { kind: "inno-setup", url: $win_url, size: $win_size, sha256: $win_sha },
                 "linux-x64":   { kind: "appimage",   url: $lnx_url, size: $lnx_size, sha256: $lnx_sha }
               }
             }
             + (if $min == "" then {} else { min_supported_version: $min } end)' \
            > manifest.json
          cat manifest.json
      - name: Sign the manifest
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::DESKTOP_UPDATE_SIGNING_KEY is not set — refusing to publish an unsigned release"
            exit 1
          fi
          KEY_ID="$(jq -r '.key_id' apps/music/config/desktop_release.json)"
          # rollout 0 on purpose (design, migration plan step 3): the release is
          # published and verifiable but offered to nobody until an operator
          # raises the percentage. That is also the kill-switch's resting state.
          cargo run -q -p cymbra-update-manifest --bin update-sign -- \
            --key-id "$KEY_ID" --rollout 0 < manifest.json > "cymbra-${TAG}-update-manifest.json"
          jq . "cymbra-${TAG}-update-manifest.json"
      # An audit trail independent of the backend: the envelope on the Release is
      # what CI signed, whatever the feed later serves.
      - name: Attach the signed envelope to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: cymbra-${{ env.TAG }}-update-manifest.json
      - name: Publish to the update feed
        env:
          INGEST_SECRET: ${{ secrets.DESKTOP_UPDATE_INGEST_SECRET }}
          INGEST_URL: ${{ vars.DESKTOP_UPDATE_INGEST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${INGEST_URL:-https://api.cymbra.app/updates/desktop}"
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "::warning::DESKTOP_UPDATE_INGEST_SECRET unset — envelope published on the Release but not ingested"
            exit 0
          fi
          # The backend re-verifies the signature before storing, so this
          # credential decides WHETHER something is stored, never WHAT.
          code="$(curl -sS -o /tmp/ingest.out -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H 'Content-Type: application/json' \
            --data-binary @"cymbra-${TAG}-update-manifest.json")"
          echo "ingest HTTP $code"
          cat /tmp/ingest.out || true
          case "$code" in
            204|200) ;;
            *) echo "::error::update ingest failed with HTTP $code"; exit 1 ;;
          esac

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
          # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
          # migration; keep in sync with the local toolchain.
          flutter-version: 3.41.8
          channel: stable
      - name: Set up protoc (gRPC codegen)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code (bootstrap workspace + gRPC + riverpod + freezed)
        # Bootstrap the whole Melos workspace, not just apps/music, so shared
        # packages (e.g. packages/cymbra_flags) also get their gitignored gRPC
        # stubs + build_runner output. Mirrors flutter.yml: doing pub-get/codegen
        # only inside apps/music silently dropped cymbra_flags and broke the
        # release archive (music-v1.16.0). `dart pub global run melos` avoids
        # relying on the pub-cache bin being on PATH (it isn't on Windows).
        shell: bash
        run: |
          dart pub global activate melos
          dart pub global run melos bootstrap
          dart pub global run melos run gen-grpc
          dart pub global run melos run generate
      - name: Set up release signing (Play upload key)
        working-directory: apps/music/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 not set — cannot produce a Play-signed build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          # key.properties lives at android/ (rootProject); storeFile is relative to android/app/.
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
      - name: Build AAB + APK (release, prod config)
        working-directory: apps/music
        run: |
          flutter build appbundle --release --dart-define-from-file=config/prod.json
          flutter build apk       --release --dart-define-from-file=config/prod.json
      - name: Rename artifacts
        run: |
          cp apps/music/build/app/outputs/bundle/release/app-release.aab "cymbra-${TAG}.aab"
          cp apps/music/build/app/outputs/flutter-apk/app-release.apk "cymbra-${TAG}.apk"
      # Release assets only for a real tag. A branch dry-run (empty `tag`
      # input) must not create a release named after the branch.
      - name: Attach to the GitHub Release
        if: startsWith(env.TAG, 'music-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            cymbra-${{ env.TAG }}.aab
            cymbra-${{ env.TAG }}.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter stable 3.47 (Dart 3.13) breaks analyzer 7.x codegen
          # (dot-shorthands in the SDK). Unpin after the Riverpod 3 / analyzer 8
          # migration; keep in sync with the local toolchain.
          flutter-version: 3.41.8
          channel: stable
      - name: Set up protoc (gRPC codegen)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code (bootstrap workspace + gRPC + riverpod + freezed)
        # Bootstrap the whole Melos workspace, not just apps/music, so shared
        # packages (e.g. packages/cymbra_flags) also get their gitignored gRPC
        # stubs + build_runner output. Mirrors flutter.yml: doing pub-get/codegen
        # only inside apps/music silently dropped cymbra_flags and broke the
        # release archive (music-v1.16.0). `dart pub global run melos` avoids
        # relying on the pub-cache bin being on PATH (it isn't on Windows).
        shell: bash
        run: |
          dart pub global activate melos
          dart pub global run melos bootstrap
          dart pub global run melos run gen-grpc
          dart pub global run melos run generate
      - name: Check iOS signing secrets
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "${CERT:-}" ] || [ -z "${PROFILE:-}" ]; then
            echo "::error::iOS signing secrets missing (IOS_DIST_CERT_BASE64 / IOS_PROVISIONING_PROFILE_BASE64). See apps/music/README.md."
            exit 1
          fi
      - name: Import distribution cert + provisioning profile
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Inject Google OAuth reversed client-id (URL scheme)
        working-directory: apps/music
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          suffix="${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
          printf 'GOOGLE_OAUTH_CLIENT_SUFFIX = %s\n' "$suffix" > ios/Flutter/Secrets.xcconfig
      - name: Configure manual signing + export options
        working-directory: apps/music/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # Drive the archive phase to manual signing (Flutter's Runner target
          # leaves CODE_SIGN_STYLE unset, so the xcconfig value applies).
          # APS_ENVIRONMENT: the checked-in default is 'development' (the only
          # value a development profile allows), so the production value is set
          # HERE, where the build is already distribution-signed — App Store
          # Connect rejects an upload that claims 'development'.
          # NOTE: everything below lands in an .xcconfig, where a leading '#' is
          # a preprocessor directive, not a comment ('//' is). Keep the block to
          # bare assignments and keep the rationale in these shell comments.
          cat >> Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = Apple Distribution
          APS_ENVIRONMENT = production
          EOF
          # CI export options: manual, map the bundle id to the profile by name.
          cat > ExportOptions-ci.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cymbra.music</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
      # Build number = run×10 (see the macOS job: iOS and macOS share one App
      # Store Connect record and their build numbers must increase across both).
      - name: Build IPA (release, prod config)
        working-directory: apps/music
        run: |
          flutter build ipa --release \
            --build-number=$(( GITHUB_RUN_NUMBER * 10 )) \
            --dart-define-from-file=config/prod.json \
            --export-options-plist ios/ExportOptions-ci.plist
      - name: Rename
        run: cp apps/music/build/ios/ipa/*.ipa "cymbra-${TAG}.ipa"
      # Release assets only for a real tag. A branch dry-run (empty `tag`
      # input) must not create a release named after the branch.
      - name: Attach to the GitHub Release
        if: startsWith(env.TAG, 'music-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: cymbra-${{ env.TAG }}.ipa
      # Push the signed IPA to TestFlight on real releases (tag push) only —
      # manual workflow_dispatch runs build + sign to validate, but don't upload
      # (avoids re-uploading an already-delivered build number). Skips cleanly if
      # the App Store Connect API secrets are absent.
      - name: Upload to TestFlight (App Store Connect API key)
        if: ${{ github.event_name == 'push' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::warning::App Store Connect API secrets missing — skipping TestFlight upload."
            exit 0
          fi
          # altool resolves the signing key from ~/private_keys/AuthKey_<KEYID>.p8
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          xcrun altool --upload-app --type ios \
            --file "cymbra-${TAG}.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
