name: site-deploy

# Build + deploy the public web site (apps/site, Astro) to Cloudflare Pages
# (cymbra.app), the same wrangler pattern as `back-office-deploy.yml`.
#
# MANUAL ONLY (`workflow_dispatch`). Deliberately NOT triggered by the `site-vX.Y.Z`
# tag: release-please uses a single Release PR for all four packages
# (`separate-pull-requests: false`), so a tag-driven deploy meant merging a release
# for one product shipped the public site too. Releasing and deploying are now two
# decisions. Cut the release as usual, then run this workflow when the site is
# actually meant to go out.
#
# Dormant until configured: gated on the `CF_PAGES_SITE_PROJECT` repo variable, so
# until the Pages project is (re)pointed at this monorepo the job is skipped.
#
# Required repo VARIABLES: CF_PAGES_SITE_PROJECT (Cloudflare Pages project name),
# PUBLIC_API_URL / PUBLIC_GOOGLE_CLIENT_ID / PUBLIC_APPLE_CLIENT_ID (+ PUBLIC_PADDLE_*)
# Required repo SECRETS:  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (shared with
#                         the back-office deploy)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CF_PAGES_SITE_PROJECT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        # Public build-time config of the islands (change: add-site-account-pages):
        # repo VARIABLES (not secrets — they are inlined in the bundle). Same client
        # ids as the back office; a missing id hides that sign-in button.
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_APPLE_CLIENT_ID: ${{ vars.PUBLIC_APPLE_CLIENT_ID }}
          PUBLIC_PADDLE_ENV: ${{ vars.PUBLIC_PADDLE_ENV }}
          PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PUBLIC_PADDLE_CLIENT_TOKEN }}
        run: yarn build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          # Pin the production branch: on a tag push github.ref_name is the tag,
          # which Cloudflare would otherwise treat as a preview deploy.
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_SITE_PROJECT }} --branch=main
