name: lingua-extension-check

# Gate for apps/lingua-extension (framework-free TS MV3 browser extension, Yarn Berry).
# Builds the lingua wasm bindings from Rust, then lints, typechecks, runs the Vitest
# suite (jsdom), and verifies the extension bundles. The wasm glue is gitignored like
# the back office's, so CI produces it with wasm-pack.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the translation engine is another workflow's artefact (tool/fetch_engine.sh)

concurrency:
  group: lingua-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ext: ${{ steps.f.outputs.ext }}
      data: ${{ steps.f.outputs.data }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            ext:
              - 'apps/lingua-extension/**'
              # The Safari host app's activation page, read by test/apple-activation-page.spec.ts. Each `?`
              # stands for one of the folder's parentheses, which picomatch (dorny/paths-filter) reads
              # as a regex group: 'Shared (App)' would match « Shared App » and never the folder.
              - 'apps/lingua-apple/Shared ?App?/Resources/**'
              # The protos `yarn gen:proto` generates the extension's clients from.
              - 'backend/auth-port/proto/**'
              - 'backend/user-port/proto/**'
              - 'backend/lingua/proto/**'
              - 'crates/lingua-wasm/**'
              - 'crates/lingua-core/**'
              # The pack builder the reviewer's archive runs (`yarn gen:pack`).
              - 'crates/lingua-pack/**'
              - 'scripts/lingua-data/**'
              # The figures gloss_coverage.py publishes for the site: test_gloss_coverage.py,
              # in the `check` job, holds them to the committed tables and to packs.json.
              - 'apps/site/src/data/lingua-coverage.json'
              - '.github/workflows/lingua-extension-check.yml'
              # Its Reduce step's script is run by test_reduce_loops.py, in the `check` job.
              - '.github/workflows/lingua-pack-update.yml'
              # Music's locales: test/account-locale.spec.ts holds the languages Cymbra speaks (the
              # account locale the extension sends, localise-lingua-account-onboarding D2) against
              # these files, so a language added to Music fails here.
              - 'apps/music/lib/l10n/app_*.arb'
            # The pairs' tables, their pinned sources and the rules and tools that reduce them: the
            # `reduce` job re-reduces every pair from its pinned sources. The workflow itself too: a
            # pull request that edits the job runs it.
            data:
              - 'scripts/lingua-data/**'
              - '.github/workflows/lingua-extension-check.yml'

  check:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ext == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lingua-extension
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # First, because it needs nothing and it is the one failure a store reports back at
      # you after the tag is pushed: package.json and manifest.json out of step, or a
      # version shape no browser accepts.
      - name: Version guard
        run: yarn check:version
      # The reducer's pure rules, the pinned-source record and the update report, unit-tested.
      - name: Pack reducer tests
        run: python3 -m unittest discover -s ../../scripts/lingua-data -p "test_*.py"
      # The real pack, from the committed tables (pin-lingua-pack-sources D5): a pull request that
      # changes the builder, the tables or a dependency so that the pack no longer matches
      # pin.json — or no longer fits its budget, which the builder enforces — fails here, not on
      # release day. Offline: no upstream source is read.
      - name: Build the real pack from the committed tables
        run: |
          set -euo pipefail
          # Every pair with committed tables (generalise-lingua-pack-reducer): the folders named
          # <studied>-<native>; tables/<studied>/ holds a studied language's side, read by its pairs
          # (split-lingua-pack-tables-by-language).
          for tables in ../../scripts/lingua-data/tables/*-*/; do
            pair="$(basename "$tables")"
            # Tables reduced by other rules than the repository's — the pair's reducer or a shared
            # reduce_*.py module, or, for a pair that is not its studied language's reference, the
            # reference's, whose reduction writes the studied tables it reads: reduce them again from
            # the pinned sources (build.sh --reduce, or lingua-pack-update with mode=reduce). Before
            # the build: a studied table that moved under a reader pair is named here, where the
            # build would only say that the pack's sha256 moved (add-lingua-pack-es-en D3).
            python3 ../../scripts/lingua-data/pack_sources.py check-reducer \
              --pin "$tables/pin.json" --reducer "../../scripts/lingua-data/reduce-$pair.py"
            bash ../../scripts/lingua-data/build.sh "$pair" "$RUNNER_TEMP/pack-$pair.lingua"
          done
      # The invariance baselines: what the engine gives the extension over a fixed corpus, with
      # the real packs — en-fr (the Spanish programme's S0, docs/lingua/spanish-programme.md),
      # es-fr (docs/lingua/language-matrix-programme.md, change 3), es-en (change 23: the
      # Spanish scenario glossed in English, whose grammar probes the extension's
      # test/word-card-es-en.spec.ts renders and pins) and en-es (change 24: the English scenario
      # glossed in Spanish, pinned by test/word-card-en-es.spec.ts). A pull request that moves one
      # re-blesses it (LINGUA_BLESS=1) and says why: a dictionary update, or an analyser change
      # that bumps that language's analyser version. Here too, not only in `rust`, because a
      # tables-only pull request (lingua-pack-update) does not start `rust`. fr-en (change 39,
      # add-lingua-french-baseline) freezes French's analysis over the pack built from its committed
      # tables (add-lingua-pack-fr-en: tables/fr/ and tables/fr-en/, whose change re-blesses it),
      # beside the real es-en pack, whose update moves its `beside es-en` line alone; fr-es
      # (change 51, add-lingua-french-word-card: the French scenario glossed in Spanish, beside
      # en-es) equals it on the studied side. The French card's lines over both are pinned by
      # test/word-card-fr-en.spec.ts and test/word-card-fr-es.spec.ts.
      - name: Invariance baselines (en-fr, es-fr, es-en, en-es, fr-en, fr-es)
        run: cargo test -q -p lingua-wasm --test english_baseline --test spanish_baseline --test es_en_baseline --test en_es_baseline --test french_baseline --test fr_es_baseline
      # What a pack studies does not depend on how it glosses (add-lingua-pack-lexical-layer):
      # a studied language's tables — its pinned tag pool, studied tables and dictionary words —
      # are kept once, in tables/<studied>/, and read by every pair of that language
      # (split-lingua-pack-tables-by-language); the shipped packs built from them keep their pinned
      # bytes; and a pack glossed in another native language answers every baseline probe alike,
      # glosses aside. Here for the same reason.
      - name: Cross-native invariance
        run: cargo test -q -p lingua-pack --test committed_tables && cargo test -q -p lingua-wasm --test cross_native
      # Both the wasm glue (statically imported by the service worker) and the gRPC-web
      # protobuf stubs (imported by the sync transport) are gitignored and generated, so
      # typecheck needs them present — produce both before lint/typecheck, not only at
      # bundle time. eslint + prettier already ignore src/wasm/pkg and src/gen.
      - name: Generate wasm bindings
        run: yarn gen:wasm
      - name: Generate proto stubs
        run: yarn gen:proto
      - name: Lint (ESLint)
        run: yarn lint
      - name: Format check (Prettier)
        run: yarn format:check
      - name: Typecheck
        run: yarn typecheck
      # `yarn test` runs with coverage and fails under the repo's 80% line gate, so the
      # number CI enforces is the one a developer sees locally.
      - name: Unit tests (Vitest)
        run: yarn test
      # The Chromium and Firefox packages carry the translation engine, built by the
      # lingua-engine-build workflow and kept only if it matches engine-pin.json. Fetched rather
      # than built here: eight minutes of Emscripten on every pull request would verify nothing
      # the pin does not.
      - name: Fetch the translation engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn fetch:engine
      # Full build: testdata pack + esbuild bundle of every variant (chromium, firefox,
      # safari; the wasm bindings were generated above). Proves the loadable extension
      # assembles, not just that it typechecks.
      - name: Build extension
        run: |
          yarn gen:pack
          yarn build
      # Each manifest carries what its browser needs, and each bundle kept only its own
      # capability branches (a misplaced __TARGET__ check type-checks but not this).
      - name: Verify browser variants
        run: yarn check:variants
      # The archive Mozilla's reviewer receives has to build the add-on from itself alone.
      # It is assembled outside the monorepo and the commands of REVIEWERS.md are run in it:
      # a new input from outside apps/lingua-extension (a crate, a .proto, a workspace
      # table) otherwise breaks the reviewer's build while the monorepo build above passes.
      # The one step not rerun is the engine's: the reviewer builds it with tool/build_engine.sh
      # (eight minutes, and exactly what lingua-engine-build runs); here the fetched copy — the
      # same pinned bytes — stands in for it.
      - name: Rebuild from the reviewer's source archive
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/lingua-source"
          tool/make_source_archive.sh "$src"
          cp -R engine "$src/apps/lingua-extension/engine"
          cd "$src/apps/lingua-extension"
          yarn install --immutable
          yarn gen:wasm
          yarn gen:proto
          # The real pack, as the reviewer builds it: from the archive's committed tables, with no
          # network, checked against pin.json — and so the very bytes the release ships.
          yarn gen:pack:real
          for pair in $(node tool/packs.mjs pairs); do
            cmp "assets/packs/$pair.lingua" "$RUNNER_TEMP/pack-$pair.lingua"
          done
          LINGUA_GRPC_WEB_URL=https://api.cymbra.app yarn build:firefox
          test -f dist-firefox/manifest.json

  # The committed tables are what the rules make of the pinned sources (lingua-data-packs,
  # generalise-lingua-gloss-reducer D4): every pair reduced again from its pinned sources, with the
  # pinned interpreter and dependencies, must give the committed tables, manifest.json and pin.json
  # byte for byte. The `check` job only compares the rules' digest with pin.json, which a person can
  # write by hand; this reduces. It reads upstream (the snapshots' release assets and the sources
  # pinned at a commit, each checked by its sha256), so it runs only when scripts/lingua-data or
  # this workflow changes. Its first run, on generalise-lingua-gloss-reducer's pull request, is the
  # first time tables reduced on macOS are reproduced on Linux.
  reduce:
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The reducer's interpreter and its one dependency are pinned: the same raw bytes give the
      # same tables (requirements-reduce.txt, hash-checked) — as lingua-pack-update installs them.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the reducer's pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r scripts/lingua-data/requirements-reduce.txt
          sudo apt-get install -y --no-install-recommends zstd >/dev/null
      - name: Reduce every pair again from its pinned sources
        env:
          LINGUA_PYTHON: python
        run: |
          set -euo pipefail
          # Each studied language's reference pair first: it writes tables/<studied>/, which the
          # language's other pairs build on (split-lingua-pack-tables-by-language).
          # Listed by a plain assignment, which `set -e` stops on: a failing `$(…)` in a `for` list
          # would run the loop zero times and leave this step green, having reduced nothing.
          pairs="$(python scripts/lingua-data/pack_sources.py pairs --tables scripts/lingua-data/tables)"
          if [ -z "$pairs" ]; then
            echo "::error::No pair to reduce under scripts/lingua-data/tables."
            exit 1
          fi
          for pair in $pairs; do
            scripts/lingua-data/build.sh --reduce "$pair" "$RUNNER_TEMP/pack-$pair.lingua"
            # The raw sources weigh about 1.5 GB per pair; the next pair needs the room. Each pair
            # is reduced from its own pin, after the references: es-en after es-fr, en-es after
            # en-fr (add-lingua-pack-en-es), fr-es after fr-en (add-lingua-pack-fr-es); the release
            # assets fetched stay in work/cache/<sha256>
            # (build.sh), so an asset two pins name is fetched once per job (add-lingua-pack-es-en
            # D2).
            rm -rf "scripts/lingua-data/work/$pair"
          done
      - name: The committed tables are what the rules make of them
        run: |
          set -euo pipefail
          moved="$(git status --porcelain -- scripts/lingua-data/tables)"
          if [ -n "$moved" ]; then
            # Each file named with the pair whose reduction writes it: a studied language's tables
            # (tables/<studied>/) are written by the reference pair its studied.json names.
            echo "::error::Reduced again from their pinned sources, these files are not the committed ones (pair: folder/file):"
            printf '%s\n' "$moved" | python scripts/lingua-data/pack_sources.py moved --tables scripts/lingua-data/tables
            git diff --stat -- scripts/lingua-data/tables
            echo "Reduce the pair again (scripts/lingua-data/build.sh --reduce <pair> <out>, Python 3.12 and"
            echo "requirements-reduce.txt, or lingua-pack-update with mode=reduce) and commit what it writes."
            exit 1
          fi
          echo "Every pair's tables, manifest.json and pin.json are what the rules make of the pinned sources."
      # A pair not yet shipped is measured against a floor without being published
      # (add-lingua-pack-es-en D6): es-en's glosses cover at least es-fr's published share of the
      # 5,000, 10,000 and 20,000 commonest lemmas when es-en was proposed (gloss_coverage.py
      # FLOORS). en-es, the thin pair the programme's risk 5 names, is held to a floor the owner
      # sets on its pull request (add-lingua-pack-en-es D3): the study's figures less two points
      # are proposed in FLOORS, the one place the owner settles (task 5.1) before merge — no
      # `--floor` here, so the job and the `check` job's tests cannot drift apart. fr-en
      # (add-lingua-pack-fr-en D4) is held to en-es's rule, the study's figures less two points,
      # until change 52 ships it. fr-es (add-lingua-pack-fr-es D8, the programme's M6), reduced
      # after fr-en, to the same rule, fixed before its first committed measurement: a pull request
      # that reduces it under its floor — its sources, its rules, the Spanish edition's or French's
      # studied tables moved — fails here, naming the pair, the top and the figure. The site's
      # figures (`gloss_coverage.py --write`, the `check` job) list the shipped pairs alone.
      - name: Gloss coverage of es-en, en-es, fr-en and fr-es, against their floors
        run: |
          set -euo pipefail
          python scripts/lingua-data/gloss_coverage.py --pair es-en
          python scripts/lingua-data/gloss_coverage.py --pair en-es
          python scripts/lingua-data/gloss_coverage.py --pair fr-en
          python scripts/lingua-data/gloss_coverage.py --pair fr-es
