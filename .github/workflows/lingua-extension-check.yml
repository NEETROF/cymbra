name: lingua-extension-check

# Gate for apps/lingua-extension (framework-free TS MV3 browser extension, Yarn Berry).
# Builds the lingua wasm bindings from Rust, then lints, typechecks, runs the Vitest
# suite (jsdom), and verifies the extension bundles. The wasm glue is gitignored like
# the back office's, so CI produces it with wasm-pack.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the translation engine is another workflow's artefact (tool/fetch_engine.sh)

concurrency:
  group: lingua-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ext: ${{ steps.f.outputs.ext }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            ext:
              - 'apps/lingua-extension/**'
              # The protos `yarn gen:proto` generates the extension's clients from.
              - 'backend/auth-port/proto/**'
              - 'backend/user-port/proto/**'
              - 'backend/lingua/proto/**'
              - 'crates/lingua-wasm/**'
              - 'crates/lingua-core/**'
              # The pack builder the reviewer's archive runs (`yarn gen:pack`).
              - 'crates/lingua-pack/**'
              - 'scripts/lingua-data/**'
              - '.github/workflows/lingua-extension-check.yml'

  check:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ext == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lingua-extension
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # First, because it needs nothing and it is the one failure a store reports back at
      # you after the tag is pushed: package.json and manifest.json out of step, or a
      # version shape no browser accepts.
      - name: Version guard
        run: yarn check:version
      # The reducer's pure rules, the pinned-source record and the update report, unit-tested.
      - name: Pack reducer tests
        run: python3 -m unittest discover -s ../../scripts/lingua-data -p "test_*.py"
      # The real pack, from the committed tables (pin-lingua-pack-sources D5): a pull request that
      # changes the builder, the tables or a dependency so that the pack no longer matches
      # pin.json — or no longer fits its budget, which the builder enforces — fails here, not on
      # release day. Offline: no upstream source is read.
      - name: Build the real pack from the committed tables
        run: |
          set -euo pipefail
          bash ../../scripts/lingua-data/build.sh en-fr "$RUNNER_TEMP/pack.lingua"
          # Tables reduced by other rules than the repository's: reduce them again from the
          # pinned sources (build.sh --reduce, or lingua-pack-update with mode=reduce).
          python3 ../../scripts/lingua-data/pack_sources.py check-reducer \
            --pin ../../scripts/lingua-data/tables/en-fr/pin.json --reducer ../../scripts/lingua-data/reduce-en-fr.py
      # Both the wasm glue (statically imported by the service worker) and the gRPC-web
      # protobuf stubs (imported by the sync transport) are gitignored and generated, so
      # typecheck needs them present — produce both before lint/typecheck, not only at
      # bundle time. eslint + prettier already ignore src/wasm/pkg and src/gen.
      - name: Generate wasm bindings
        run: yarn gen:wasm
      - name: Generate proto stubs
        run: yarn gen:proto
      - name: Lint (ESLint)
        run: yarn lint
      - name: Format check (Prettier)
        run: yarn format:check
      - name: Typecheck
        run: yarn typecheck
      # `yarn test` runs with coverage and fails under the repo's 80% line gate, so the
      # number CI enforces is the one a developer sees locally.
      - name: Unit tests (Vitest)
        run: yarn test
      # The Chromium and Firefox packages carry the translation engine, built by the
      # lingua-engine-build workflow and kept only if it matches engine-pin.json. Fetched rather
      # than built here: eight minutes of Emscripten on every pull request would verify nothing
      # the pin does not.
      - name: Fetch the translation engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn fetch:engine
      # Full build: testdata pack + esbuild bundle of every variant (chromium, firefox,
      # safari; the wasm bindings were generated above). Proves the loadable extension
      # assembles, not just that it typechecks.
      - name: Build extension
        run: |
          yarn gen:pack
          yarn build
      # Each manifest carries what its browser needs, and each bundle kept only its own
      # capability branches (a misplaced __TARGET__ check type-checks but not this).
      - name: Verify browser variants
        run: yarn check:variants
      # The archive Mozilla's reviewer receives has to build the add-on from itself alone.
      # It is assembled outside the monorepo and the commands of REVIEWERS.md are run in it:
      # a new input from outside apps/lingua-extension (a crate, a .proto, a workspace
      # table) otherwise breaks the reviewer's build while the monorepo build above passes.
      # The one step not rerun is the engine's: the reviewer builds it with tool/build_engine.sh
      # (eight minutes, and exactly what lingua-engine-build runs); here the fetched copy — the
      # same pinned bytes — stands in for it.
      - name: Rebuild from the reviewer's source archive
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/lingua-source"
          tool/make_source_archive.sh "$src"
          cp -R engine "$src/apps/lingua-extension/engine"
          cd "$src/apps/lingua-extension"
          yarn install --immutable
          yarn gen:wasm
          yarn gen:proto
          # The real pack, as the reviewer builds it: from the archive's committed tables, with no
          # network, checked against pin.json — and so the very bytes the release ships.
          yarn gen:pack:real
          cmp assets/pack.lingua "$RUNNER_TEMP/pack.lingua"
          LINGUA_GRPC_WEB_URL=https://api.cymbra.app yarn build:firefox
          test -f dist-firefox/manifest.json
