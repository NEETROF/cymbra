name: openspec-archive

# Auto-archives OpenSpec changes once they are 100% complete (all tasks checked)
# and have landed on main. `openspec archive` is a deterministic CLI op — it folds
# each change's delta into openspec/specs/ and removes it from openspec/changes/ —
# so no review/AI is needed: this just runs the same command `/opsx:archive` wraps.
#
# Triggers:
#   - push to main (after a merge) touching openspec/changes/ — the common path
#   - workflow_dispatch — manual safety valve to archive on demand
#
# Writes the result straight to main using RELEASE_PLEASE_TOKEN (a PAT already
# allowed to bypass branch protection, reused from release-please). The commit
# carries [skip ci] so the bot's own push doesn't re-trigger this workflow.
on:
  push:
    branches: [main]
    paths: ['openspec/changes/**']
  workflow_dispatch:

permissions:
  contents: write

# Avoid racing with an overlapping run (e.g. a fast second merge).
concurrency:
  group: openspec-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install -g @fission-ai/openspec@1.4.1

      - name: Archive completed changes
        run: |
          set -euo pipefail
          changes=$(openspec list --json | jq -r '.changes[] | select(.status == "complete") | .name')
          if [ -z "$changes" ]; then
            echo "No completed changes to archive."
            exit 0
          fi
          # `openspec archive` exits 0 when it aborts — a MODIFIED delta naming a
          # requirement the spec has since renamed prints "not found / Aborted. No files
          # were changed." and stops there. Believing its exit code left a finished change
          # sitting in openspec/changes through two green runs, listed in the commit
          # message below as if it had been archived. The directory is the only honest
          # answer: archiving removes it.
          #
          # A change may modify a requirement that another change, still open, adds: it then
          # archives after that one (add-lingua-expression-table after add-lingua-phrase-gloss).
          # The archive would abort on it exactly as on a renamed requirement, so the order is
          # read first (scripts/openspec_archive_order.py, exit 10 = waits). Archiving goes in
          # passes: a change waiting for one archived in this very run is taken on the next.
          archived=""
          failed=""
          waiting=""
          pending="$changes"
          while :; do
            next=""
            progress=0
            for c in $pending; do
              order=0
              python3 scripts/openspec_archive_order.py "$c" > /dev/null || order=$?
              if [ "$order" -eq 10 ]; then
                next="$next $c"
                continue
              fi
              echo "::group::archive $c"
              openspec archive "$c" -y
              echo "::endgroup::"
              if [ -d "openspec/changes/$c" ]; then
                failed="$failed $c"
              else
                archived="$archived $c"
                progress=1
              fi
            done
            pending="$next"
            if [ -z "${pending// /}" ] || [ "$progress" -eq 0 ]; then break; fi
          done
          for c in $pending; do
            after=$(python3 scripts/openspec_archive_order.py "$c" | paste -sd, - || true)
            echo "::notice::$c is complete and archives after ${after}, still open."
            waiting="$waiting $c"
          done
          {
            echo "names<<EOF"
            # shellcheck disable=SC2086
            printf '%s\n' $archived
            echo "EOF"
            echo "failed=$failed"
            echo "waiting=$waiting"
          } >> "$GITHUB_ENV"

      - name: Commit archived changes
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          list=$(printf '%s\n' "$names" | sed 's/^/- /')
          git commit -m "chore(openspec): archive completed changes" \
                     -m "$list" \
                     -m "[skip ci]"
          git push

      # Last, so whatever did archive is already committed: a change left behind is a
      # stale delta to repair, not a reason to hold the others back.
      - name: Report changes the archive left behind
        if: always()
        run: |
          set -euo pipefail
          failed="${failed:-}"
          waiting="${waiting:-}"
          if [ -z "${failed// /}" ]; then
            if [ -n "${waiting// /}" ]; then
              echo "Every completed change was archived, except those waiting for a change still open:${waiting}."
            else
              echo "Every completed change was archived."
            fi
            exit 0
          fi
          echo "::error::openspec archive left these changes in openspec/changes:${failed}. \
          Read their group above — a MODIFIED delta usually names a requirement the spec \
          has renamed. Retarget the delta; the next run archives it."
          exit 1
