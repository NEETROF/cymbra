# Build the score-crawler images and push them to GHCR, so the box can run the
# crawler by *pulling* (no source checkout on the server) — same model as the
# backend image. Two images:
#   * cymbra-score-crawler   — the crawler binary + git/python-ly + docker CLI
#   * cymbra-musescore       — headless MuseScore 4 (for OpenScore .mscx)
name: crawler-image

on:
  push:
    branches: [main]
    # The crawler embeds cymbra-score and ships with the backend, so its images
    # are versioned in LOCKSTEP with the backend: release-please tags the backend
    # `backend-vX.Y.Z`, and its release commit bumps .release-please-manifest.json
    # (listed below), so that tag push matches the paths filter and the crawler
    # images get the same semver as cymbra-backend (see the tags block).
    tags: ["backend-v*"]
    paths:
      - "crates/score-crawler/**"
      - "crates/musicxml-core/**"
      - "backend/score/**"
      - ".release-please-manifest.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/crawler-image.yml"
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/neetrof/cymbra-score-crawler
            file: crates/score-crawler/Dockerfile
            context: .
          - image: ghcr.io/neetrof/cymbra-musescore
            file: crates/score-crawler/musescore.Dockerfile
            context: crates/score-crawler
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            # Same version as cymbra-backend: strip the release-please `backend-v`
            # prefix → clean semver image tags (backend-v0.5.0 → :0.5.0 and :0.5).
            type=match,pattern=backend-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=backend-v(\d+\.\d+),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
