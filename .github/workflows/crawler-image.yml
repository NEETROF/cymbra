# Build the score-crawler images and push them to GHCR, so the box can run the
# crawler by *pulling* (no source checkout on the server) — same model as the
# backend image. Two images:
#   * cymbra-score-crawler   — the crawler binary + git/python-ly + docker CLI
#   * cymbra-musescore       — headless MuseScore 4 (for OpenScore .mscx)
name: crawler-image

on:
  push:
    branches: [main]
    paths:
      - "crates/score-crawler/**"
      - "crates/musicxml-core/**"
      - "backend/score/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/crawler-image.yml"
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/neetrof/cymbra-score-crawler
            file: crates/score-crawler/Dockerfile
            context: .
          - image: ghcr.io/neetrof/cymbra-musescore
            file: crates/score-crawler/musescore.Dockerfile
            context: crates/score-crawler
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
