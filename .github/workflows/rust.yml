name: rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect whether any Rust-relevant path changed. A skipped job (below) reports
  # "success" and satisfies the required check, so PRs that touch no Rust don't
  # burn minutes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            rust:
              - 'backend/**'
              - 'crates/**'
              - 'apps/*/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/rust.yml'

  rust:
    needs: changes
    # Gate PRs only; pushes to main always build.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA (midir backend) + protoc (backend tonic-build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          # wasm32 so the notation-render wrapper (and thus musicxml-core) is
          # proven to still compile for the browser — the shared-musicxml-crate
          # wasm-buildability contract. A native-only dep creeping into the core
          # fails this build.
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Module boundaries (no impl->impl deps)
        run: python3 backend/scripts/check_boundaries.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # cargo-llvm-cov runs the tests AND measures coverage, failing the job under
      # 80% line coverage. The generated bridge, the Android JNI entrypoint (lib.rs),
      # the hardware/thread MIDI glue (api/midi.rs), the thin MusicXML FFI seam
      # (api/musicxml.rs) and the cpal/rustysynth audio glue (api/audio.rs) can't
      # run on a headless CI host, so they're excluded. The pure, testable logic
      # lives in api/midi_core.rs, api/musicxml_core.rs and api/audio_core.rs (still
      # measured), alongside score.rs and simple.rs.
      # Coverage gate (>=80% lines). Excluded: the frb bridge + FFI/hardware glue
      # on the client; and on the Cymbra ID backend, generated protobuf and the
      # thin I/O adapters (gRPC servers/clients, SQLx repos, Redis, JWKS/OIDC HTTP,
      # SMTP, OTLP/metrics) — domain logic and the *_core helpers stay measured.
      - name: Test + coverage (fail under 80%)
        # Exclusions live in .github/coverage-ignore-regex.txt — one source shared with
        # sonar.yml, which had already drifted from this list.
        run: |
          cargo llvm-cov --workspace --lcov --output-path target/lcov.info \
            --fail-under-lines 80 \
            --ignore-filename-regex "$(cat .github/coverage-ignore-regex.txt)"
      - name: Build
        run: cargo build --workspace
      # Regression guard for the shared-musicxml-crate wasm-buildability requirement:
      # the notation-render wrapper (and its cymbra-musicxml-core dependency) must keep
      # compiling for the browser target that the back-office preview ships.
      - name: Build wasm modules (wasm32)
        run: |
          cargo build -p cymbra-musicxml-wasm --target wasm32-unknown-unknown
          cargo build -p cymbra-audio-wasm --target wasm32-unknown-unknown
