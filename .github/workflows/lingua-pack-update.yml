name: lingua-pack-update

# Proposes new tables for one of Cymbra Lingua's data packs — the `pair` input, en→fr by default; the
# monthly run checks every pair (pin-lingua-pack-sources D6, D7; the pair since
# generalise-lingua-pack-reducer, es→fr since add-lingua-spanish-forms-tables).
#
# Releases never read upstream: they build the pack from the tables committed under
# scripts/lingua-data/tables/<pair>/ and its studied language's tables/<studied>/, and check it
# against tables/<pair>/pin.json. This workflow is the only place the upstream sources are read, and
# nothing it produces reaches a release without a person:
#
# - dispatch, mode `update`: today's sources (CEFR-J, Octanove, ESDB, UD Spanish-GSD at their pinned
#   commits; kaikki live), kept as a new snapshot, reduced, and pushed to the branch
#   lingua-pack/<pair>/<snapshot>. kaikki is read as its dumps of whole Wiktionary editions alone —
#   the English, French and Spanish Wiktionaries', one address each (pack_sources.py EDITIONS,
#   migrate-lingua-pack-sources-to-raw-dumps D1): the files the pair reads are derived from them in
#   one pass per edition and published as the release lingua-pack-sources-<pair>-<snapshot>, never
#   replaced, whose notes name each dump by its address, regeneration date and decompressed sha256;
#   no dump is kept (the English edition's alone is 2.78 GiB gzipped, above the 2 GiB a release
#   asset may weigh). A studied language's reference pair (tables/<studied>/studied.json) writes that
#   language's tables, so on the same branch it brings every other pair of the language, reduced
#   again from its own pinned sources (split-lingua-pack-tables-by-language D5). Each pair pins its
#   own fetch (add-lingua-pack-es-en D2): the release is the named pair's own and holds its own
#   assets only, and a pair brought along publishes nothing and reads no dump. A pin written before
#   the dumps — en-fr's, es-fr's and es-en's name kaikki's per-language extracts — is read as it is
#   recorded, and moves to the dumps at the pair's next update (D5). A pair's first update — its
#   folder holds no tables yet — proposes the folder whole.
# - dispatch, mode `reduce`: the PINNED sources reduced again, after the reduction rules changed —
#   the branch's diff is the rules' effect alone; no dump is read. With pair `all`, every pair with
#   committed tables is reduced in one run and proposed on one branch,
#   lingua-pack/all/<snapshot>-reduce, with the invariance baselines re-blessed once
#   (generalise-lingua-gloss-reducer D4).
# - expect `identical`: the rules moved, not what they make. The run fails, naming the pair and the
#   file (a studied language's file with its reference pair: `es-fr: es/level.tsv`), and proposes no
#   branch, when a table, a kept input or NOTICE differs by one byte,
#   manifest.json anywhere but `pack_version`, pin.json anywhere but the pack's sha256 and the rules'
#   record (pack_report.py --identical), the site's coverage figures at all, a baseline anywhere
#   but the lines naming the packs (`### pack`, `### beside`), or an extension snapshot at all.
# - monthly, or dispatch mode `dry`: `update` into scratch folders. Nothing is committed or
#   published; the run reports how far upstream has drifted and FAILS when a source cannot be
#   fetched, a reduction fails, or a table collapses (an upstream format change shows as lost rows,
#   not as an error). The monthly run (and a `dry` dispatch with pair `all`) checks every pair in
#   ONE job, in `pairs` order (D4): each edition's dump is fetched and read once a month, its whole
#   catalogue derived at the first pair that reads it and copied by the later ones — about 3.6 GiB
#   for the three dumps, where a job per pair would fetch the English one once per pair reading it.
#   Each pair reduces into a dry root of its own (work/dry/<pair>), so a later pair never lays the
#   committed studied folder over the drift its reference wrote; a pair that fails is named, the
#   loop goes on, and the job fails at the end.
#   Its duration, the dumps' sizes and the disk it uses are measured in scripts/lingua-data/SOURCES.md
#   (*The editions' dumps*).
#
# It never opens the pull request: the repository setting that would allow it also lets workflows
# approve pull requests, and a pull request opened with this token would run none of its required
# checks. The run summary carries the report and the link that opens it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update = today's sources, new snapshot; reduce = the pinned sources, after a change to the reduction rules; dry = today's sources into scratch folders, nothing committed or published (the monthly check)."
        type: choice
        options: [update, reduce, dry]
        default: update
      pair:
        description: "The language pair whose tables to propose (a <studied>-<native> folder of scripts/lingua-data/tables); a studied language's reference brings the pairs that read it; all = every pair, mode reduce or dry."
        type: choice
        options: [en-fr, es-fr, es-en, en-es, all]
        default: en-fr
      expect:
        description: "any = report what moved; identical = fail on any byte the rules were not meant to move (mode reduce only)."
        type: choice
        options: [any, identical]
        default: any
  schedule:
    - cron: "17 5 3 * *" # the 3rd of every month, 05:17 UTC — dry run of every pair, one job

permissions:
  contents: write # push the branch lingua-pack/<snapshot>, publish the pair's sources release

# One run at a time per studied language: an update of a reference pair rewrites the studied
# folder its readers build on and brings them along — es-fr writes tables/es/ and reduces es-en
# again, en-fr writes tables/en/ and reduces en-es again (add-lingua-pack-en-es D1: en-es reads
# tables/en/ as committed and pins its digest) — so a reference's and its reader's dispatches
# never propose the reader's folder on two branches at once: the `es` group for es-fr and es-en,
# the `en` group for en-fr and en-es. `all` (modes reduce and dry) and the monthly dry run have a
# group each.
concurrency:
  group: lingua-pack-update-${{ startsWith(inputs.pair, 'es-') && 'es' || startsWith(inputs.pair, 'en-') && 'en' || inputs.pair || 'monthly' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      # The monthly run checks every pair in one job (D4); a dispatch names its mode and pair.
      MODE: ${{ github.event_name == 'schedule' && 'dry' || inputs.mode }}
      PAIR: ${{ github.event_name == 'schedule' && 'all' || inputs.pair }}
      EXPECT: ${{ inputs.expect || 'any' }}
      # A monthly run fails when a table loses more than this share of its rows (D7). A starting
      # value, to set from the first runs.
      MAX_LOSS: "0.2"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The reducer's interpreter and its one dependency are pinned: the same raw bytes give the
      # same tables (requirements-reduce.txt, hash-checked).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the reducer's pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r scripts/lingua-data/requirements-reduce.txt
          sudo apt-get install -y --no-install-recommends zstd >/dev/null

      # Every pair is reduced from its pinned sources only: an update reads today's sources and
      # publishes them as one pair's snapshot release.
      - name: Check the inputs
        run: |
          set -euo pipefail
          if [ "$PAIR" = all ] && [ "$MODE" = update ]; then
            echo "::error::pair=all reduces every pair again (mode=reduce) or checks every pair against today's sources (mode=dry); an update names its pair."
            exit 1
          fi
          if [ "$EXPECT" = identical ] && [ "$MODE" != reduce ]; then
            echo "::error::expect=identical checks a change of the rules alone: dispatch it with mode=reduce."
            exit 1
          fi

      - name: Reduce
        env:
          LINGUA_PYTHON: python
        run: |
          set -euo pipefail
          snapshot=$(date -u +%Y.%m.%d)
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          started=$(date +%s)
          # Each studied language's reference pair first: it writes tables/<studied>/, which the
          # language's other pairs build on. A named reference brings the pairs that read its studied
          # folder along, reduced again from their own pinned sources after it
          # (split-lingua-pack-tables-by-language).
          tables=scripts/lingua-data/tables
          work=scripts/lingua-data/work
          # Listed by a plain assignment, which `set -e` stops on: a failing process substitution
          # feeding the array would leave it empty and this step green, having reduced nothing.
          if [ "$PAIR" = all ]; then
            list="$(python scripts/lingua-data/pack_sources.py pairs --tables "$tables")"
          elif [ "$MODE" = dry ]; then
            list="$PAIR" # a dry run of one pair checks that pair alone
          else
            list="$(python scripts/lingua-data/pack_sources.py pairs --tables "$tables" --after "$PAIR")"
          fi
          pairs=()
          while IFS= read -r pair; do [ -z "$pair" ] || pairs+=("$pair"); done <<<"$list"
          if [ "${#pairs[@]}" -eq 0 ]; then
            echo "::error::No pair to reduce under $tables."
            exit 1
          fi
          echo "PAIRS=${pairs[*]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/committed"
          failed=()
          for pair in "${pairs[@]}"; do
            studied="${pair%%-*}"
            cp -r "$tables/$pair" "$RUNNER_TEMP/committed/$pair"
            [ -d "$RUNNER_TEMP/committed/$studied" ] || cp -r "$tables/$studied" "$RUNNER_TEMP/committed/$studied"
            mode="$MODE"
            # The pairs a named reference brings along: their pinned sources, reduced again.
            [ "$PAIR" != all ] && [ "$pair" != "$PAIR" ] && mode=reduce
            if [ "$MODE" = dry ]; then
              # Each pair into a dry root of its own (D4): build.sh lays the committed studied
              # folder down again under its root, which in a shared root would hide the drift the
              # language's reference wrote before the report reads it. A pair that fails is named and
              # the loop goes on: one pair's failure hides no other pair's report.
              pair_started=$(date +%s)
              if ! LINGUA_DRY_ROOT="$work/dry/$pair" LINGUA_SNAPSHOT=$snapshot \
                scripts/lingua-data/build.sh --dry "$pair" "$RUNNER_TEMP/pack-$pair.lingua"; then
                echo "::error::$pair: the dry run failed; the other pairs go on, and the job fails at the end."
                failed+=("$pair")
              fi
              echo "$pair: $(( $(date +%s) - pair_started )) s; disk used, free: $(df -h --output=used,avail / 2>/dev/null | tail -n1)"
            else
              LINGUA_SNAPSHOT=$snapshot scripts/lingua-data/build.sh --"$mode" "$pair" "$RUNNER_TEMP/pack-$pair.lingua"
            fi
            # What a reducer measures of its own tables and stores in no pack — en-es's
            # translation-table share (add-lingua-pack-en-es D4) — kept for the report.
            if [ -f "$work/$pair/measures.json" ]; then
              cp "$work/$pair/measures.json" "$RUNNER_TEMP/measures-$pair.json"
            fi
            # A re-reduction and a dry run keep nothing of their raw sources (an update publishes the
            # named pair's below); the next pair needs the room (D8). Each pair by its own mode: the
            # pairs an update brings along are re-reductions too.
            if [ "$mode" != update ]; then rm -rf "${work:?}/$pair"; fi
          done
          # Each edition's catalogue was the run's alone (D4); its dumps were deleted after their pass.
          rm -rf "${work:?}/editions" "${work:?}/dumps"
          # Empty arrays expanded with a default: `set -u` refuses them on bash before 4.4.
          echo "FAILED=${failed[*]-}" >> "$GITHUB_ENV"
          echo "Reduced ${pairs[*]} in $(( $(date +%s) - started )) s."

      - name: Report against the committed tables
        run: |
          set -euo pipefail
          status=0
          : > "$RUNNER_TEMP/report.md"
          # Each pair's native side, then each studied language's side its reference wrote — whose
          # report names every pair reading it whose pack moves. A dry run wrote each pair under a
          # root of its own: a pair's folder is under its root, a studied language's under the root
          # of the language's first pair in `pairs` order — its reference, whose drift it holds.
          root_of() {
            local folder="$1" pair
            if [ "$MODE" != dry ]; then echo "scripts/lingua-data/tables"; return; fi
            for pair in $PAIRS; do
              if [ "$pair" = "$folder" ] || [ "${pair%%-*}" = "$folder" ]; then
                echo "scripts/lingua-data/work/dry/$pair"
                return
              fi
            done
          }
          for folder in $PAIRS $(for pair in $PAIRS; do echo "${pair%%-*}"; done | sort -u); do
            root="$(root_of "$folder")"
            # A dry run's pair that failed wrote nothing worth reporting, nor did its studied language's
            # folder when that pair is the root it lies under: the Reduce step named it.
            case " $FAILED " in *" ${root##*/} "*) continue ;; esac
            new="$root/$folder"
            [ -d "$new" ] || continue
            identical=()
            # Named after the folder, or, for a studied language's, after the reference that writes it.
            [ "$EXPECT" = identical ] && identical=(--identical)
            pack=()
            [ -f "$RUNNER_TEMP/pack-$folder.lingua" ] && pack=(--pack "$RUNNER_TEMP/pack-$folder.lingua")
            # The reducer's own measurements, when it wrote any (the Reduce step kept them).
            measures=()
            [ -f "$RUNNER_TEMP/measures-$folder.json" ] && measures=(--measures "$RUNNER_TEMP/measures-$folder.json")
            printf '\n**%s**\n\n' "$folder" >> "$RUNNER_TEMP/report.md"
            # Each optional argument array expanded only when set: `set -u` refuses an empty one on
            # bash before 4.4.
            python scripts/lingua-data/pack_report.py "$RUNNER_TEMP/committed/$folder" "$new" \
              ${pack[@]+"${pack[@]}"} ${measures[@]+"${measures[@]}"} --max-loss "$MAX_LOSS" \
              ${identical[@]+"${identical[@]}"} >> "$RUNNER_TEMP/report.md" || status=1
          done
          if [ -n "$FAILED" ]; then
            printf '\n**Failed**: %s — see the Reduce step.\n' "$FAILED" >> "$RUNNER_TEMP/report.md"
            echo "::error::These pairs failed: $FAILED."
            status=1
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The extension's snapshots follow the goldens and the tables (add-lingua-english-card-wording
      # D2, D4): re-blessed with Node by the push step below, as `lingua-extension-check` runs them.
      # Installed once the inputs are checked and the tables reduced and reported, and before the
      # snapshot's release is published, so a failed install leaves no release behind. Nothing is
      # blessed in dry mode.
      - uses: actions/setup-node@v5
        if: env.MODE != 'dry'
        with:
          node-version: "22"
      - name: Enable Corepack (Yarn Berry)
        if: env.MODE != 'dry'
        run: corepack enable
      - name: Install the extension's dependencies
        if: env.MODE != 'dry'
        working-directory: apps/lingua-extension
        run: yarn install --immutable

      - name: Keep kaikki's bytes as the snapshot's release
        if: env.MODE == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="scripts/lingua-data/tables/$PAIR/pin.json"
          # The pair's own release of this snapshot (release_tag): an update records every source it
          # fetched under it — each pair pins its own fetch (add-lingua-pack-es-en D2).
          tag=$(python scripts/lingua-data/pack_sources.py release-tag --pin "$pin")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; a snapshot is never replaced. Dispatch again tomorrow."
            exit 1
          fi
          # The pair's own assets: each file it derives from a whole Wiktionary edition's dump
          # (pack_sources.py DUMPS) — the records whose release is this one — and the dumps they come
          # from, for the notes (D7). Listed by plain assignments, which `set -e` stops on: a failing
          # process substitution feeding the loop would leave the list empty and this step green,
          # having published nothing.
          list="$(python scripts/lingua-data/pack_sources.py assets --pin "$pin" --release "$tag")"
          dumps="$(python scripts/lingua-data/pack_sources.py dumps --pin "$pin" --release "$tag")"
          files=()
          while IFS= read -r asset; do
            [ -z "$asset" ] || files+=("scripts/lingua-data/work/$PAIR/$asset")
          done <<<"$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::$PAIR's pin.json names no asset under $tag: the update fetched nothing of its own."
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          The kaikki.org data read for Cymbra Lingua's $PAIR data pack, as it was on $SNAPSHOT: the files the
          pair derives from kaikki's dumps of whole Wiktionary editions. The dumps are not kept — the
          English edition's alone is above the 2 GiB a release asset may weigh — and each is named here by its
          address, the date kaikki regenerated it and the sha256 of its decompressed bytes:

          $dumps

          The assets are the pack's raw sources, kept because upstream regenerates them every day. Each is
          zstd-compressed; decompressed, its sha256 is in \`scripts/lingua-data/tables/$PAIR/pin.json\`.

          Licence: Wiktionary content, CC BY-SA 4.0 and GFDL — https://kaikki.org, https://www.wiktionary.org.
          EOF
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Lingua pack sources $PAIR $SNAPSHOT" --notes-file "$RUNNER_TEMP/notes.md" --latest=false

      - name: Push the tables to a branch
        if: env.MODE != 'dry'
        run: |
          set -euo pipefail
          # One branch, also for pair=all: every pair's tables, manifests and pins together.
          branch="lingua-pack/$PAIR/$SNAPSHOT"
          [ "$MODE" = reduce ] && branch="lingua-pack/$PAIR/$SNAPSHOT-reduce"
          # Tracked files that moved, and the untracked ones a pair's first update writes into a
          # folder that held no tables yet (add-lingua-pack-es-en D2, the bootstrap).
          if [ -z "$(git status --porcelain -- scripts/lingua-data/tables)" ]; then
            echo "The tables did not change: nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # The invariance baselines follow the dictionary (docs/lingua/spanish-programme.md,
          # docs/lingua/language-matrix-programme.md): re-blessed here, so the pull request shows
          # what the update changes in English and Spanish output. All three, whatever the pair:
          # the Spanish ladder borrows English's figures from the en-fr pack, and es-en's golden
          # moves with es-fr's studied tables (change 23). Once, whatever the pairs.
          # The French one too: its engine holds the real es-en pack beside the fr-en fixture
          # (add-lingua-french-baseline D5), so an es-en update moves its `beside es-en` line.
          LINGUA_BLESS=1 cargo test -q -p lingua-wasm --test english_baseline --test spanish_baseline --test es_en_baseline --test french_baseline
          # The extension's snapshots follow them (add-lingua-english-card-wording D2, D4): the
          # English card's lines over the es-en golden's grammar probes, and the selection card's
          # rows over the committed French glosses. `-u` after the files: vitest's `-u, --update
          # [type]` takes an optional value, so `-u <file>` would read the first file as that value
          # and run the second alone, leaving the first snapshot as it was.
          (cd apps/lingua-extension && yarn vitest run test/word-card-es-en.spec.ts test/row-gloss-tables.spec.ts -u)
          # The site's coverage figures follow the tables (add-site-lingua-spanish-pages D3).
          python scripts/lingua-data/gloss_coverage.py --write
          if [ "$EXPECT" = identical ]; then
            # The rules moved, not what they make: the site's figures stay, a baseline moves only
            # in the lines naming the packs (`### pack`, `### beside`), whose pack_version names the
            # new rules, and the extension's snapshots do not move.
            if ! git diff --quiet -- apps/site/src/data/lingua-coverage.json; then
              echo "::error::Expected no change, but the site's coverage figures moved:"
              git diff -- apps/site/src/data/lingua-coverage.json
              exit 1
            fi
            moved="$(git diff -U0 -- crates/lingua-wasm/tests/baseline apps/lingua-extension/test/baseline | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
              | grep -vE '^[-+][a-z]{2}-[a-z]{2}, [0-9]+ bytes, pack_version "[^"]*", analyzer_version "[^"]*"$' || true)"
            if [ -n "$moved" ]; then
              echo "::error::Expected no change, but a baseline moved beyond the lines naming the packs, or a snapshot moved:"
              printf '%s\n' "$moved"
              exit 1
            fi
          fi
          git add scripts/lingua-data/tables crates/lingua-wasm/tests/baseline apps/lingua-extension/test/baseline apps/site/src/data/lingua-coverage.json
          message="chore(lingua): $PAIR dictionary tables $SNAPSHOT"
          [ "$MODE" = reduce ] && message="chore(lingua): reduce the $PAIR dictionary tables again ($SNAPSHOT)"
          [ "$PAIR" = all ] && message="chore(lingua): reduce every pair's dictionary tables again ($SNAPSHOT)"
          git commit -q -m "$message" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "$branch"
          {
            echo ""
            echo "Branch **$branch** is pushed. Nothing reaches a release until a person opens and merges its pull request:"
            echo "https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
