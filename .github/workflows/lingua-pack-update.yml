name: lingua-pack-update

# Proposes new tables for one of Cymbra Lingua's data packs — the `pair` input, en→fr by default; the
# monthly run checks every pair (pin-lingua-pack-sources D6, D7; the pair since
# generalise-lingua-pack-reducer, es→fr since add-lingua-spanish-forms-tables).
#
# Releases never read upstream: they build the pack from the tables committed under
# scripts/lingua-data/tables/<pair>/ and its studied language's tables/<studied>/, and check it
# against tables/<pair>/pin.json. This workflow is the only place the upstream sources are read, and
# nothing it produces reaches a release without a person:
#
# - dispatch, mode `update`: today's sources (kaikki live; AGID, CEFR-J, Octanove at their pinned
#   commits), kept as a new snapshot — kaikki's bytes published as the release
#   lingua-pack-sources-<pair>-<snapshot>, never replaced — reduced, and pushed to the branch
#   lingua-pack/<pair>/<snapshot>. A studied language's reference pair (tables/<studied>/studied.json)
#   writes that language's tables, so on the same branch it brings every other pair of the language,
#   reduced again from its own pinned sources (split-lingua-pack-tables-by-language D5). A release
#   is the named pair's own and holds the pair's own assets only: a pair whose pin names another
#   pair's release for a source they share (es-en reads es-fr's extract, add-lingua-pack-es-en D2)
#   publishes nothing for it. A pair's first update — its folder holds no tables yet — proposes
#   the folder whole.
# - dispatch, mode `reduce`: the PINNED sources reduced again, after the reduction rules changed —
#   the branch's diff is the rules' effect alone. With pair `all`, every pair with committed tables
#   is reduced in one run and proposed on one branch, lingua-pack/all/<snapshot>-reduce, with the
#   invariance baselines re-blessed once (generalise-lingua-gloss-reducer D4).
# - expect `identical`: the rules moved, not what they make. The run fails, naming the pair and the
#   file (a studied language's file with its reference pair: `es-fr: es/level.tsv`), and proposes no
#   branch, when a table, a kept input or NOTICE differs by one byte,
#   manifest.json anywhere but `pack_version`, pin.json anywhere but the pack's sha256 and the rules'
#   record (pack_report.py --identical), the site's coverage figures at all, or a baseline anywhere
#   but the lines naming the packs (`### pack`, `### beside`).
# - monthly: `update` in dry mode. Nothing is committed or published; the run reports how far
#   upstream has drifted and FAILS when a source cannot be fetched, the reduction fails, or a table
#   collapses (an upstream format change shows as lost rows, not as an error).
#
# It never opens the pull request: the repository setting that would allow it also lets workflows
# approve pull requests, and a pull request opened with this token would run none of its required
# checks. The run summary carries the report and the link that opens it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update = today's sources, new snapshot; reduce = the pinned sources, after a change to the reduction rules."
        type: choice
        options: [update, reduce]
        default: update
      pair:
        description: "The language pair whose tables to propose (a <studied>-<native> folder of scripts/lingua-data/tables); a studied language's reference brings the pairs that read it; all = every pair, mode reduce only."
        type: choice
        options: [en-fr, es-fr, es-en, all]
        default: en-fr
      expect:
        description: "any = report what moved; identical = fail on any byte the rules were not meant to move (mode reduce only)."
        type: choice
        options: [any, identical]
        default: any
  schedule:
    - cron: "17 5 3 * *" # the 3rd of every month, 05:17 UTC — dry run

permissions:
  contents: write # push the branch lingua-pack/<snapshot>, publish the kaikki snapshot release

concurrency:
  group: lingua-pack-update-${{ inputs.pair || 'monthly' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # A dispatch proposes the pair it names; the monthly dry run checks every pair with tables.
        pair: ${{ github.event_name == 'schedule' && fromJSON('["en-fr", "es-fr", "es-en"]') || fromJSON(format('["{0}"]', inputs.pair)) }}
    env:
      MODE: ${{ github.event_name == 'schedule' && 'dry' || inputs.mode }}
      PAIR: ${{ matrix.pair }}
      EXPECT: ${{ inputs.expect || 'any' }}
      # A monthly run fails when a table loses more than this share of its rows (D7). A starting
      # value, to set from the first runs.
      MAX_LOSS: "0.2"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The reducer's interpreter and its one dependency are pinned: the same raw bytes give the
      # same tables (requirements-reduce.txt, hash-checked).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the reducer's pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r scripts/lingua-data/requirements-reduce.txt
          sudo apt-get install -y --no-install-recommends zstd >/dev/null

      # Every pair is reduced from its pinned sources only: an update reads today's sources and
      # publishes them as one pair's snapshot release.
      - name: Check the inputs
        run: |
          set -euo pipefail
          if [ "$PAIR" = all ] && [ "$MODE" != reduce ]; then
            echo "::error::pair=all reduces every pair again from its pinned sources: dispatch it with mode=reduce."
            exit 1
          fi
          if [ "$EXPECT" = identical ] && [ "$MODE" != reduce ]; then
            echo "::error::expect=identical checks a change of the rules alone: dispatch it with mode=reduce."
            exit 1
          fi

      - name: Reduce
        env:
          LINGUA_PYTHON: python
        run: |
          set -euo pipefail
          snapshot=$(date -u +%Y.%m.%d)
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          # Each studied language's reference pair first: it writes tables/<studied>/, which the
          # language's other pairs build on. A named reference brings the pairs that read its studied
          # folder along, reduced again from their own pinned sources after it
          # (split-lingua-pack-tables-by-language).
          tables=scripts/lingua-data/tables
          # Listed by a plain assignment, which `set -e` stops on: a failing process substitution
          # feeding the array would leave it empty and this step green, having reduced nothing.
          if [ "$PAIR" = all ]; then
            list="$(python scripts/lingua-data/pack_sources.py pairs --tables "$tables")"
          elif [ "$MODE" = dry ]; then
            list="$PAIR" # the monthly matrix checks every pair on its own
          else
            list="$(python scripts/lingua-data/pack_sources.py pairs --tables "$tables" --after "$PAIR")"
          fi
          pairs=()
          while IFS= read -r pair; do [ -z "$pair" ] || pairs+=("$pair"); done <<<"$list"
          if [ "${#pairs[@]}" -eq 0 ]; then
            echo "::error::No pair to reduce under $tables."
            exit 1
          fi
          echo "PAIRS=${pairs[*]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/committed"
          for pair in "${pairs[@]}"; do
            studied="${pair%%-*}"
            cp -r "$tables/$pair" "$RUNNER_TEMP/committed/$pair"
            [ -d "$RUNNER_TEMP/committed/$studied" ] || cp -r "$tables/$studied" "$RUNNER_TEMP/committed/$studied"
            mode="$MODE"
            # The pairs a named reference brings along: their pinned sources, reduced again.
            [ "$PAIR" != all ] && [ "$pair" != "$PAIR" ] && mode=reduce
            LINGUA_SNAPSHOT=$snapshot scripts/lingua-data/build.sh --"$mode" "$pair" "$RUNNER_TEMP/pack-$pair.lingua"
            # A re-reduction keeps nothing of its raw sources (an update publishes the named pair's
            # below); the next pair needs the room. Each pair by its own mode: the pairs an update
            # brings along are re-reductions too.
            if [ "$mode" = reduce ]; then rm -rf "scripts/lingua-data/work/$pair"; fi
          done

      - name: Report against the committed tables
        run: |
          set -euo pipefail
          status=0
          : > "$RUNNER_TEMP/report.md"
          new="scripts/lingua-data/tables"
          [ "$MODE" = dry ] && new="scripts/lingua-data/work/dry"
          # Each pair's native side, then each studied language's side its reference wrote — whose
          # report names every pair reading it whose pack moves.
          for folder in $PAIRS $(for pair in $PAIRS; do echo "${pair%%-*}"; done | sort -u); do
            [ -d "$new/$folder" ] || continue
            identical=()
            # Named after the folder, or, for a studied language's, after the reference that writes it.
            [ "$EXPECT" = identical ] && identical=(--identical)
            pack=()
            [ -f "$RUNNER_TEMP/pack-$folder.lingua" ] && pack=(--pack "$RUNNER_TEMP/pack-$folder.lingua")
            printf '\n**%s**\n\n' "$folder" >> "$RUNNER_TEMP/report.md"
            python scripts/lingua-data/pack_report.py "$RUNNER_TEMP/committed/$folder" "$new/$folder" \
              "${pack[@]}" --max-loss "$MAX_LOSS" "${identical[@]}" \
              >> "$RUNNER_TEMP/report.md" || status=1
          done
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep kaikki's bytes as the snapshot's release
        if: env.MODE == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="scripts/lingua-data/tables/$PAIR/pin.json"
          # The pair's own release of this snapshot (release_tag) — never a source's `release`,
          # which for a pair reading its reference's extract is the reference's (add-lingua-pack-es-en D2).
          tag=$(python scripts/lingua-data/pack_sources.py release-tag --pin "$pin")
          url=$(python scripts/lingua-data/pack_sources.py get --pin "$pin" sources.kaikki.url)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; a snapshot is never replaced. Dispatch again tomorrow."
            exit 1
          fi
          # The pair's own assets: the extract when this run fetched it, then each file the pair
          # derives from a whole Wiktionary dump (pack_sources.py DUMPS) — the records whose release
          # is this one. An asset another pair's release holds is not published again.
          files=()
          while IFS= read -r asset; do
            [ -z "$asset" ] || files+=("scripts/lingua-data/work/$PAIR/$asset")
          done < <(python scripts/lingua-data/pack_sources.py assets --pin "$pin" --release "$tag")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Every source of $PAIR is held by another pair's release: nothing to publish under $tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          The kaikki.org data read for Cymbra Lingua's $PAIR data pack, as it was on $SNAPSHOT: the
          extract ($url) when this pair fetched it (a pair sharing its reference's reads that pair's
          release for it, named in its pin), and the files derived from whole Wiktionary dumps, if
          the pair reads any. They are the pack's raw sources, kept because upstream regenerates them
          every day. Each is zstd-compressed; decompressed, its sha256 is in
          \`scripts/lingua-data/tables/$PAIR/pin.json\`.

          Licence: Wiktionary content, CC BY-SA 4.0 and GFDL — https://kaikki.org, https://www.wiktionary.org.
          EOF
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Lingua pack sources $PAIR $SNAPSHOT" --notes-file "$RUNNER_TEMP/notes.md" --latest=false

      - name: Push the tables to a branch
        if: env.MODE != 'dry'
        run: |
          set -euo pipefail
          # One branch, also for pair=all: every pair's tables, manifests and pins together.
          branch="lingua-pack/$PAIR/$SNAPSHOT"
          [ "$MODE" = reduce ] && branch="lingua-pack/$PAIR/$SNAPSHOT-reduce"
          # Tracked files that moved, and the untracked ones a pair's first update writes into a
          # folder that held no tables yet (add-lingua-pack-es-en D2, the bootstrap).
          if [ -z "$(git status --porcelain -- scripts/lingua-data/tables)" ]; then
            echo "The tables did not change: nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # The invariance baselines follow the dictionary (docs/lingua/spanish-programme.md,
          # docs/lingua/language-matrix-programme.md): re-blessed here, so the pull request shows
          # what the update changes in English and Spanish output. Both, whatever the pair: the
          # Spanish ladder borrows English's figures from the en-fr pack. Once, whatever the pairs.
          LINGUA_BLESS=1 cargo test -q -p lingua-wasm --test english_baseline --test spanish_baseline
          # The site's coverage figures follow the tables (add-site-lingua-spanish-pages D3).
          python scripts/lingua-data/gloss_coverage.py --write
          if [ "$EXPECT" = identical ]; then
            # The rules moved, not what they make: the site's figures stay, and a baseline moves only
            # in the lines naming the packs (`### pack`, `### beside`), whose pack_version names the
            # new rules.
            if ! git diff --quiet -- apps/site/src/data/lingua-coverage.json; then
              echo "::error::Expected no change, but the site's coverage figures moved:"
              git diff -- apps/site/src/data/lingua-coverage.json
              exit 1
            fi
            moved="$(git diff -U0 -- crates/lingua-wasm/tests/baseline | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
              | grep -vE '^[-+][a-z]{2}-[a-z]{2}, [0-9]+ bytes, pack_version "[^"]*", analyzer_version "[^"]*"$' || true)"
            if [ -n "$moved" ]; then
              echo "::error::Expected no change, but a baseline moved beyond the lines naming the packs:"
              printf '%s\n' "$moved"
              exit 1
            fi
          fi
          git add scripts/lingua-data/tables crates/lingua-wasm/tests/baseline apps/site/src/data/lingua-coverage.json
          message="chore(lingua): $PAIR dictionary tables $SNAPSHOT"
          [ "$MODE" = reduce ] && message="chore(lingua): reduce the $PAIR dictionary tables again ($SNAPSHOT)"
          [ "$PAIR" = all ] && message="chore(lingua): reduce every pair's dictionary tables again ($SNAPSHOT)"
          git commit -q -m "$message" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "$branch"
          {
            echo ""
            echo "Branch **$branch** is pushed. Nothing reaches a release until a person opens and merges its pull request:"
            echo "https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
