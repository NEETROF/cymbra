name: build

# Native-build gate. Compiles the app for every native target (Android + the
# three desktops) — the only CI that exercises cargokit per-platform and code
# gated behind `#[cfg(target_os = ...)]`.
#
# One job PER target (not a matrix) so each has a STATIC check-run name
# (android/linux/macos/windows). That matters for branch protection: a matrix job
# skipped via `if:` reports a single "matrix.label" check instead of the four
# contexts, leaving the required checks "Expected" forever and blocking the PR. As
# separate static jobs, a skipped job reports "success" for its context. Shared
# setup lives in .github/actions/flutter-native-setup. Pushes to main always build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            native:
              - 'apps/music/**'
              - 'melos.yaml'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/build.yml'
              - '.github/actions/flutter-native-setup/action.yml'

  android:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-native-setup
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build (apk)
        working-directory: apps/music
        run: flutter build apk --debug

  linux:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build libgtk-3-dev libsecret-1-dev
      - uses: ./.github/actions/flutter-native-setup
      - name: Build (linux)
        working-directory: apps/music
        run: flutter build linux --debug

  macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-native-setup
      # The Sign in with Apple entitlement is profile-restricted; this compile-only
      # gate disables signing so xcodebuild does an ad-hoc (unsigned) build. Applied
      # only in the ephemeral CI checkout — never committed.
      - name: Disable macOS code signing (unsigned compile gate)
        working-directory: apps/music/macos
        shell: bash
        run: printf '\nCODE_SIGNING_ALLOWED = NO\n' >> Runner/Configs/Debug.xcconfig
      - name: Build (macos)
        working-directory: apps/music
        run: flutter build macos --debug

  windows:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-native-setup
      - name: Build (windows)
        working-directory: apps/music
        run: flutter build windows --debug
