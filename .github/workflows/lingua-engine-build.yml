name: lingua-engine-build

# Builds the Bergamot translation engine from source and publishes it as an artefact
# (add-lingua-translation-engine). The Chromium and Firefox packages carry it
# (add-lingua-translation-delivery D1): lingua-extension-check and lingua-extension-release fetch
# this artefact with apps/lingua-extension/tool/fetch_engine.sh, which keeps it only if every file
# matches apps/lingua-extension/engine-pin.json.
#
# The build is the reviewer's recipe, tool/build_engine.sh, run as it is — so what Mozilla's
# reviewers are told to run is what CI runs. And it is REPRODUCIBLE: three runs a day apart gave
# byte-identical files, which is what lets the pin be a hash. A run that no longer reproduces the
# pinned bytes fails here, loudly, rather than ship something else.
#
# It runs when the pin or the recipe changes, on demand, and once a month: artefacts are kept 90
# days, and the lanes that package the engine need one to exist. It does not run on every pull
# request: it takes about eight minutes and verifies nothing the extension's own gate does not.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lingua-engine-build.yml"
      - "apps/lingua-extension/engine-pin.json"
      - "apps/lingua-extension/tool/build_engine.sh"
      - "apps/lingua-extension/tool/engine_pin.mjs"
  pull_request:
    paths:
      - ".github/workflows/lingua-engine-build.yml"
      - "apps/lingua-extension/engine-pin.json"
      - "apps/lingua-extension/tool/build_engine.sh"
      - "apps/lingua-extension/tool/engine_pin.mjs"
  schedule:
    - cron: "17 4 1 * *" # monthly, so an artefact is always younger than its 90-day retention
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingua-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux only. The upstream build script itself warns that it breaks on macOS AArch64, and a
    # runner is already the clean container the script otherwise insists on (ALLOW_RUN_ON_HOST).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The engine is PINNED (engine-pin.json): the upstream commit, and the sha256 of each file it
      # must produce. Every measurement taken on it — size, memory, latency, that the tag survives
      # translation — holds for those bytes and no others; moving the pin means re-taking them.
      # mozilla/translations at the pinned commit is Bergamot v0.6.0, emsdk 3.1.8. On a mismatch
      # the script names the hash it got, which is what a deliberate move of the pin records.
      - name: Build the engine and check it against the pin
        env:
          ENGINE_WORK_DIR: ${{ runner.temp }}/engine-work
        run: apps/lingua-extension/tool/build_engine.sh "$RUNNER_TEMP/engine"

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-translation-engine
          path: |
            ${{ runner.temp }}/engine/bergamot-translator.js
            ${{ runner.temp }}/engine/bergamot-translator.wasm
            ${{ runner.temp }}/engine/TRANSLATIONS_COMMIT
          if-no-files-found: error
          retention-days: 90
