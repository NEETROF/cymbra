name: site-check

# Web-site gate (apps/site, Astro): `astro check` + production build on PRs and
# main pushes that touch the site (dorny/paths-filter), always on manual dispatch.
# The site is deployed by `site-deploy.yml` on a `site-v*` tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.f.outputs.site }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/web-auth/**'
              - '.github/workflows/site-check.yml'

  build:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type check (Astro)
        run: yarn check
      - name: Type check (Vue islands)
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build
