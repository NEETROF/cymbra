name: lingua-apple-build

# Builds the Apple host app of the Safari extension (apps/lingua-apple) for the iOS
# simulator and macOS, unsigned. The app bundles the extension's safari build through a
# copy phase, so the extension is built first; a change to the extension or its engine is
# therefore a change to this app too. Signing and TestFlight are a separate release lane.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the translation engine is another workflow's artefact (tool/fetch_engine.sh)

concurrency:
  group: lingua-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.f.outputs.apple }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            apple:
              - 'apps/lingua-apple/**'
              - 'apps/lingua-extension/**'
              - 'crates/lingua-wasm/**'
              - 'crates/lingua-core/**'
              - '.github/workflows/lingua-apple-build.yml'

  build:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.apple == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test the id_token hand-off (LinguaSignIn)
        working-directory: apps/lingua-apple/LinguaSignIn
        run: swift test
      - name: Test the release tools (lingua-apple-release)
        working-directory: apps/lingua-apple/tool
        run: python3 -m unittest -v test_ci_release_signing test_release_version
      - name: Test the languages phase (tool/app_localizations.sh)
        working-directory: apps/lingua-apple
        run: bash tool/test_app_localizations.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up protoc (gRPC-web stubs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
      - name: Build the extension's safari variant
        working-directory: apps/lingua-extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yarn install --immutable
          yarn gen:wasm
          yarn gen:proto
          yarn gen:pack
          # The Safari package carries the pinned translation engine (add-lingua-translation-safari).
          yarn fetch:engine
          yarn build:safari
      - name: Build the iOS app (simulator, unsigned)
        working-directory: apps/lingua-apple
        run: |
          xcodebuild -project "Cymbra Lingua.xcodeproj" -scheme "Cymbra Lingua (iOS)" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: Build the macOS app (unsigned)
        working-directory: apps/lingua-apple
        run: |
          xcodebuild -project "Cymbra Lingua.xcodeproj" -scheme "Cymbra Lingua (macOS)" \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: Verify the extension is bundled and the languages declared
        run: |
          ios_app="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/Cymbra Lingua.app"
          mac_app="$RUNNER_TEMP/dd/Build/Products/Release/Cymbra Lingua.app"
          test -f "$ios_app/PlugIns/Cymbra Lingua Extension.appex/manifest.json"
          test -f "$mac_app/Contents/PlugIns/Cymbra Lingua Extension.appex/Contents/Resources/manifest.json"
          # The activation page's copy table (localise-lingua-apple-host, D2) ships in both apps.
          test -f "$ios_app/copy.js"
          test -f "$mac_app/Contents/Resources/copy.js"
          # Every built plist already declares the shipped natives (D1): the phase ran, and running
          # it again on a copy changes nothing.
          packs=apps/lingua-extension/dist-safari/assets/packs
          for plist in "$ios_app/Info.plist" "$mac_app/Contents/Info.plist"; do
            cp "$plist" "$RUNNER_TEMP/declared.plist"
            bash apps/lingua-apple/tool/app_localizations.sh "$packs" "$RUNNER_TEMP/declared.plist"
            cmp "$plist" "$RUNNER_TEMP/declared.plist"
          done
          for plist in "$ios_app/PlugIns/Cymbra Lingua Extension.appex/Info.plist" "$mac_app/Contents/PlugIns/Cymbra Lingua Extension.appex/Contents/Info.plist"; do
            cp "$plist" "$RUNNER_TEMP/declared.plist"
            bash apps/lingua-apple/tool/app_localizations.sh "$packs" "$RUNNER_TEMP/declared.plist" generated
            cmp "$plist" "$RUNNER_TEMP/declared.plist"
          done
