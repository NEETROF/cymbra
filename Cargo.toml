# Cymbra — Rust workspace (monorepo).
# Members are added as the project grows: shared engine crates under crates/,
# the modular-monolith backend under backend/, and per-app FFI crates under apps/*/rust.
[workspace]
resolver = "2"
members = [
    "apps/*/rust",
    "backend/*",
    "crates/*",       # shared engine crates (e.g. cymbra-musicxml-core)
]
# Non-crate dirs under backend/ (dev infra, configs, course content) that the
# `backend/*` glob would otherwise try to load as packages.
exclude = [
    "backend/content",
    "backend/db",
    "backend/deploy",
    "backend/observability",
    "backend/scripts",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["NEETROF"]

# midir 0.11.0's Android (AMidi) backend never checks for `receive() == 0`, which
# means "no message pending" and leaves the out-params untouched. After the first
# key press the reader thread re-delivers that press forever, at full speed: the
# Flutter sink is flooded, the UI thread starves and Android raises an ANR (iOS is
# unaffected — CoreMIDI is callback-driven). Pinned to our one-commit fork until
# the fix lands upstream (https://github.com/Boddlnagg/midir).
[patch.crates-io]
midir = { git = "https://github.com/NEETROF/midir", rev = "fcafd065ac2c308e6d146ec752e88b6c0a01f5dd" }

# Audio DSP must hold real time even in dev builds: cargokit compiles the app's
# Rust in `dev` for a debug APK, and an unoptimized rustysynth render eats a
# large share of the ~23 ms/block budget on device. Optimizing only this package
# keeps `cargo build` of our own crates fast.
[profile.dev.package.rustysynth]
opt-level = 3

# Shared dependency versions for the Cymbra ID backend (change: add-cymbra-id).
# Declaring them here keeps versions consistent; a crate only compiles a dep when
# it opts in via `dep.workspace = true`. The OpenTelemetry stack versions are
# validated when the observability group (6) wires them.
[workspace.dependencies]
# gRPC + HTTP
tonic = "0.12"
tonic-build = "0.12"
# gRPC-web + CORS for the browser back office (change: add-moderation-back-office).
tonic-web = "0.12"
tower-http = { version = "0.6", features = ["cors"] }
prost = "0.13"
axum = "0.7"
tower = "0.5"
http = "1"
# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# persistence + cache
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# async-job substrate (change: add-job-infrastructure). rustls to match sqlx's
# TLS stack (no native-tls/OpenSSL).
sqlxmq = { version = "0.6", default-features = false, features = ["runtime-tokio-rustls"] }
# time + cron for the recurring scheduler
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cron = "0.15"
# auth + crypto
# v10 requires an explicit crypto backend; rust_crypto is pure-Rust (no C
# toolchain) and covers the EdDSA (internal tokens) + RS256 (OIDC) we verify.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
# SHA-256 for hashing refresh tokens at rest (durable sessions).
sha2 = "0.10"
# Ed25519 for the CI-signed desktop update manifest (change:
# add-desktop-auto-update). The signing key lives only in CI; the backend and the
# app only ever verify.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# HMAC-SHA256 for the period-salted pseudonymous analytics `user_bucket`
# (change: add-feature-usage-analytics) — salt = HMAC(master_secret, "YYYY-MM").
hmac = "0.12"
# config + errors + ids + serde
config = "0.14"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
base64 = "0.22"
# JWKS / OIDC discovery fetch (rustls, no openssl)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# transactional-email HTML templating (compile-time, typed)
askama = "0.12"
# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
# 0.28+ dropped the async-runtime batch model (rt-tokio / runtime::Tokio) for a
# background-thread processor, so no runtime feature is needed here.
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-appender-tracing = "0.32"
tokio-metrics = "0.3"
sysinfo = "0.32"
# testing — default test-double is mockall generated mocks (#[automock]).
# A crate opts in under [dev-dependencies] with `mockall = { workspace = true }`.
# See the `rust-testing` skill.
mockall = "0.13"
