# SonarCloud configuration. Adjust organization/projectKey to your SonarCloud setup.
sonar.organization=neetrof
sonar.projectKey=NEETROF_cymbra
sonar.projectName=Cymbra

# Blocking gate: the `sonar` job passes `-Dsonar.qualitygate.wait=true`, so the
# job waits for SonarCloud's Quality Gate and FAILS if it does not pass. To make
# it block merges, add the `sonar` check to the required status checks in branch
# protection (the hard >=80% line gate also lives in rust.yml / flutter.yml).

# Sources (Rust + Dart + TS): the Flutter app, its FFI crate, the backend modules,
# the shared engine crates (cymbra-musicxml-core, score-crawler) under crates/, and
# the Vue moderation back office.
sonar.sources=apps/music/lib,apps/music/rust/src,backend,crates,apps/back-office/src

# Exclude generated bindings and build/vendor dirs, plus backend non-source
# (dev infra, the observability stack, helper scripts, and SQL migrations — the
# `jobs` ones vendor sqlxmq's mq_* migrations, whose upstream "fix" files
# re-declare whole function bodies; that's vendored DDL, not our logic).
sonar.exclusions=**/frb_generated.rs,**/lib/src/rust/**,**/cargokit/**,**/build/**,**/target/**,**/*.g.dart,**/*.freezed.dart,backend/db/**,backend/observability/**,backend/scripts/**,backend/*/migrations/**,apps/back-office/src/gen/**,apps/back-office/src/wasm/**,backend/platform/templates/**

# Coverage exclusions: the Dart IO seams that can only run against real
# platform/network services (gRPC channel + auth interceptor, native
# Google/Apple sign-in SDK, the desktop OAuth loopback dart:io/http glue) and the
# generated gRPC stubs. These mirror the `--ignore-filename-regex` IO-adapter list
# applied to the Rust lcov in sonar.yml (grpc.rs, interceptor.rs, session.rs, …);
# their logic is exercised through injected fakes, not unit tests. Files with
# genuine host-testable logic (e.g. token_store.dart, desktop_oauth_core.dart,
# desktop_oidc_token_source.dart) stay counted.
sonar.coverage.exclusions=apps/music/lib/services/grpc_client.dart,apps/music/lib/services/oidc_token_source.dart,apps/music/lib/services/desktop_oauth_io.dart,**/lib/src/grpc/**,apps/back-office/src/main.ts,apps/back-office/src/router.ts,apps/back-office/src/App.vue,apps/back-office/src/views/**,apps/back-office/src/components/StatBar.vue,apps/back-office/src/components/ScorePreview.vue,apps/back-office/src/lib/transport.ts,apps/back-office/src/lib/grpc-devtools.ts,apps/back-office/src/lib/e2e-seam.ts,apps/back-office/src/lib/notation/wasm.ts,apps/back-office/src/lib/audio/synth.ts,apps/back-office/src/lib/worker/**,apps/back-office/src/composables/useScorePlayer.ts,apps/back-office/src/composables/usePlayhead.ts

# Coverage reports: lcov for all three ecosystems. Dart accepts multiple
# comma-separated reports (unit/widget + integration). The back-office reports
# unit/widget coverage of its logic layer; its app shell/screens/IO seams are
# coverage-excluded above (validated by the Playwright e2e suite + vue-tsc), same
# pattern as the Dart/Rust IO seams. TS is analysed by Sonar's JavaScript analyzer.
sonar.dart.lcov.reportPaths=apps/music/coverage/lcov.info,apps/music/coverage/integration.lcov.info
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.javascript.lcov.reportPaths=apps/back-office/coverage/lcov.info
