# Shared, FFI-free MusicXML engine crate (change: add-user-score-upload).
# The pure notation model + streaming parser + geometry lifted out of
# apps/music/rust, plus .mxl decode and the client/server-shared validate() gate.
# Consumed by the app FFI engine, the backend score module, and the score crawler.
[package]
name = "cymbra-musicxml-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# Never published to crates.io (shared local crate) — also lets `cargo about`
# (change: add-oss-license-attributions) auto-exclude it as first-party via
# its `private.ignore` filter, see apps/music/rust/about.toml.
publish = false

[dependencies]
anyhow = "1"
# Streaming (SAX-style) MusicXML reader — bounded memory over multi-MB scores.
quick-xml = "0.36"
# .mxl container (ZIP) decode; deflate only, no native compression backends.
zip = { version = "2", default-features = false, features = ["deflate"] }
# NFD folding for title/work-key normalisation (shared search/dedup keys).
unicode-normalization = "0.1"
# Optional: derive Serialize/Deserialize on the notation model so the wasm
# renderer can ship geometry across the JS boundary. Off by default — the app
# FFI engine and backend never enable it, so their builds are unchanged.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
