# Score crawler (change: add-score-crawler): a resumable crawler that harvests
# only redistributable scores from git repos + the PDMX dataset, converts them
# to validated .mxl, and ingests them into the shared score store. Driven by a
# CLI and a Docker fan-out (docker-compose.yml).
[package]
name = "score-crawler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "score-crawler"
path = "src/main.rs"

[dependencies]
# Shared notation engine: validation + .mxl re-parse + the parsed model that
# metadata/difficulty read. Single source of truth across app/backend/crawler.
cymbra-musicxml-core = { path = "../musicxml-core" }
# The shared score module: the crawler ingests directly through its CatalogRepo
# into the `score` schema's catalog_scores (the same store the app reads).
cymbra-score = { path = "../../backend/score" }
uuid = { version = "1", features = ["v7"] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
sha2 = "0.10"
# .mxl container build (spec-shaped ZIP); deflate only, no native backends.
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Async runtime + trait for the SourceAdapter orchestration + concurrency cap.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }
async-trait = "0.1"
# HTTP for streaming the large PDMX dataset download (rustls, gzip).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "stream",
] }
futures-util = "0.3"
# PDMX dataset: gunzip + untar the mxl archive.
flate2 = "1"
tar = "0.4"
