# Fan-out: one score-crawler container per source, run in parallel.
#
# Usage (from the repo root):
#   # no limit — crawl everything each source offers:
#   docker compose -f crates/score-crawler/docker-compose.yml up --build
#
#   # cap each source to N items (per-source limit):
#   LIMIT=5 docker compose -f crates/score-crawler/docker-compose.yml up --build
#
# Each source writes its own corpus + manifest under ./output/<source>/ (next to
# this file), so parallel runs never clobber each other.
#
# Each crawler is a one-shot process: it exits when its crawl finishes, so its
# container stops (restart: "no"). Without --abort-on-container-exit each source
# finishes independently, and `docker compose up` returns once ALL have stopped.
#
# CATALOG INGESTION — the crawlers ingest into Postgres via
# CYMBRA_SCORE_DATABASE_URL. It defaults to the backend/docker-compose.yml
# Postgres reached through the host's mapped port (host.docker.internal:5432),
# with the password taken from POSTGRES_PASSWORD (default `cymbra_dev_pw`, the
# backend dev value) so no credential is hard-coded here. Locally just start that
# DB first:
#     docker compose -f backend/docker-compose.yml up -d postgres
#     docker compose -f crates/score-crawler/docker-compose.yml up --build
# On a server, override the whole connection string (managed DB, other host, …):
#     CYMBRA_SCORE_DATABASE_URL=postgres://user:pass@db.host:5432/cymbra \
#       docker compose -f crates/score-crawler/docker-compose.yml up
# Set it empty (CYMBRA_SCORE_DATABASE_URL=) to skip ingestion and write only the
# local corpus. (The `-` form keeps an explicit empty value; unset uses the
# default.)

x-crawler: &crawler
  build:
    context: ../..
    dockerfile: crates/score-crawler/Dockerfile
  image: score-crawler
  environment:
    # LIMIT: set → --limit N per source; unset → unbounded.
    LIMIT: ${LIMIT:-}
    # Catalog DB: default targets the backend compose's Postgres via the host
    # port; override on the server. Empty = no ingestion (local corpus only).
    CYMBRA_SCORE_DATABASE_URL: ${CYMBRA_SCORE_DATABASE_URL-postgres://cymbra:${POSTGRES_PASSWORD:-cymbra_dev_pw}@host.docker.internal:5432/cymbra}
  # Make host.docker.internal resolve on Linux servers too (no-op on Docker
  # Desktop, where it already resolves).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  entrypoint: ["/bin/sh", "-c"]
  restart: "no"

services:
  # openscore ships MuseScore `.mscx`, so it converts via the `docker` backend:
  # the crawler spawns a sibling `cymbra/musescore` container per score. That
  # needs (1) the docker socket, (2) the MuseScore image built once:
  #     docker build -f crates/score-crawler/musescore.Dockerfile \
  #         -t cymbra/musescore crates/score-crawler
  # and (3) a converter temp dir mounted at the SAME path inside and outside the
  # container, so the bind-mount the crawler passes to the host daemon resolves
  # (override the host path with SC_CONVTMP). The other sources need none of this.
  openscore:
    <<: *crawler
    command: ["score-crawler --sources openscore $${LIMIT:+--limit $$LIMIT}"]
    # A service-level `environment:` replaces the anchor's, so re-list its vars.
    environment:
      LIMIT: ${LIMIT:-}
      CYMBRA_SCORE_DATABASE_URL: ${CYMBRA_SCORE_DATABASE_URL-postgres://cymbra:${POSTGRES_PASSWORD:-cymbra_dev_pw}@host.docker.internal:5432/cymbra}
      CYMBRA_SCORE_CONVERTER_BACKEND: docker
      CYMBRA_SCORE_MUSESCORE_IMAGE: cymbra/musescore
      TMPDIR: ${SC_CONVTMP:-/tmp/cymbra-conv}
    volumes:
      - "./output/openscore:/work/output"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${SC_CONVTMP:-/tmp/cymbra-conv}:${SC_CONVTMP:-/tmp/cymbra-conv}"

  mutopia:
    <<: *crawler
    command: ["score-crawler --sources mutopia $${LIMIT:+--limit $$LIMIT}"]
    volumes: ["./output/mutopia:/work/output"]

  musetrainer:
    <<: *crawler
    command: ["score-crawler --sources musetrainer $${LIMIT:+--limit $$LIMIT}"]
    volumes: ["./output/musetrainer:/work/output"]

  eduardomourar:
    <<: *crawler
    command: ["score-crawler --sources eduardomourar $${LIMIT:+--limit $$LIMIT}"]
    volumes: ["./output/eduardomourar:/work/output"]

  # cpdl / imslp / gutenberg / hymnary were evaluated and dropped (no viable
  # free MusicXML — see crates/score-crawler/README.md "Excluded sources").

  pdmx:
    <<: *crawler
    command: ["score-crawler --sources pdmx $${LIMIT:+--limit $$LIMIT}"]
    volumes: ["./output/pdmx:/work/output"]

# The catalog Postgres is NOT defined here — the crawlers connect to the backend
# compose's Postgres (or any DB you point CYMBRA_SCORE_DATABASE_URL at). This
# keeps the fan-out one-shot: with no daemon service, `docker compose up` returns
# when every crawler has finished.
#
# Alternative (same-network instead of the host port): add
#   networks: { db: { external: true, name: backend_default } }
# put `networks: [db]` on the anchor, and use @postgres:5432 in the URL — but the
# host-port default above is more portable (works for a managed DB too).
