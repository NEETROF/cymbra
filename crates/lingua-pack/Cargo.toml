[package]
name = "lingua-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra Lingua offline pack builder (native-only): assembles a versioned pack.lingua from AGID/wordfreq/kaikki-derived tables"

[dependencies]
lingua-core = { path = "../lingua-core" }
fst = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# C-backed zstd for high-ratio gloss compression. Native-only: this crate is
# never targeted to WASM (the reader in lingua-core uses pure-Rust ruzstd).
zstd = { workspace = true }
