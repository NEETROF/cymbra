[package]
name = "lingua-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra Lingua WASM bindings: thin wasm-bindgen surface over lingua-core's page analysis"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lingua-core = { path = "../lingua-core" }
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

# The English invariance baseline (tests/english_baseline.rs) builds the real en-fr pack from
# the committed tables. Host only: the builder uses C zstd and is never compiled to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lingua-pack = { path = "../lingua-pack" }
# The French baseline (tests/french_baseline.rs) holds its corpus's NFD block to NFD.
unicode-normalization = { workspace = true }

[lints]
workspace = true
