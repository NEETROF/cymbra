[package]
name = "lingua-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cymbra Lingua WASM bindings: thin wasm-bindgen surface over lingua-core's page analysis"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lingua-core = { path = "../lingua-core" }
wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
